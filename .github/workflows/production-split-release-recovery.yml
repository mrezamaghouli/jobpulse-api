          FRONTEND_RESTART_COUNT_AFTER="$(frontend_field '{{.RestartCount}}')"
          [ "$FRONTEND_ID_AFTER" = "$FRONTEND_ID_BEFORE" ] || fail "frontend container ID changed (was recreated): before=$FRONTEND_ID_BEFORE after=$FRONTEND_ID_AFTER"
          [ "$FRONTEND_IMAGE_ID_AFTER" = "$FRONTEND_IMAGE_ID_BEFORE" ] || fail "frontend image ID changed: before=$FRONTEND_IMAGE_ID_BEFORE after=$FRONTEND_IMAGE_ID_AFTER"
          [ "$FRONTEND_RESTART_COUNT_AFTER" = "$FRONTEND_RESTART_COUNT_BEFORE" ] || fail "frontend restart_count changed: before=$FRONTEND_RESTART_COUNT_BEFORE after=$FRONTEND_RESTART_COUNT_AFTER"
          [ "$FRONTEND_RUNNING_AFTER" = "true" ] || fail "frontend is not running after reset"

          echo "== post-reset API invariant (must remain unchanged, never recreated) =="
          API_ID_AFTER="$(api_field '{{.Id}}')"
          API_CONFIG_IMAGE_AFTER="$(api_field '{{.Config.Image}}')"
          API_IMAGE_ID_AFTER="$(api_field '{{.Image}}')"
          API_RUNNING_AFTER="$(api_field '{{.State.Running}}')"
          API_HEALTH_AFTER="$(api_field '{{with (index .State "Health")}}{{.Status}}{{else}}none{{end}}')"
          API_RESTART_COUNT_AFTER="$(api_field '{{.RestartCount}}')"
          [ "$API_ID_AFTER" = "$API_ID_BEFORE" ] || fail "API container ID changed (was recreated): before=$API_ID_BEFORE after=$API_ID_AFTER"
          [ "$API_CONFIG_IMAGE_AFTER" = "$API_CONFIG_IMAGE_BEFORE" ] || fail "API Config.Image changed: before=$API_CONFIG_IMAGE_BEFORE after=$API_CONFIG_IMAGE_AFTER"
          [ "$API_IMAGE_ID_AFTER" = "$API_IMAGE_ID_BEFORE" ] || fail "API image ID changed: before=$API_IMAGE_ID_BEFORE after=$API_IMAGE_ID_AFTER"
          [ "$API_RESTART_COUNT_AFTER" = "$API_RESTART_COUNT_BEFORE" ] || fail "API restart_count changed: before=$API_RESTART_COUNT_BEFORE after=$API_RESTART_COUNT_AFTER"
          [ "$API_RUNNING_AFTER" = "true" ] || fail "API is not running after reset"
          [ "$API_HEALTH_AFTER" = "healthy" ] || fail "API is not healthy after reset (got $API_HEALTH_AFTER)"

          curl --connect-timeout 3 --max-time 5 -fsS http://127.0.0.1:8000/health > /dev/null || fail "post-reset API direct health check failed"
          curl --connect-timeout 3 --max-time 5 -fsS http://127.0.0.1/api/health > /dev/null || fail "post-reset API nginx-proxied health check failed"

          SEARCH_TRANSPORT_AFTER="$(docker exec jobpulse-api-prod printenv SEARCH_TRANSPORT 2>/dev/null || echo UNSET)"
          TOR_ENABLED_AFTER="$(docker exec jobpulse-api-prod printenv TOR_ENABLED 2>/dev/null || echo UNSET)"
          if [ "$SEARCH_TRANSPORT_AFTER" != "UNSET" ] && [ "$SEARCH_TRANSPORT_AFTER" != "direct" ]; then
            fail "post-reset SEARCH_TRANSPORT is neither unset nor 'direct' (got $SEARCH_TRANSPORT_AFTER)"
          fi
          [ "$TOR_ENABLED_AFTER" = "false" ] || fail "post-reset TOR_ENABLED is not exactly 'false' (got $TOR_ENABLED_AFTER)"
          echo "api_post_reset_invariant=ok"

          echo "== post-reset DB/Tor invariant (must remain unchanged) =="
          DB_ID_AFTER="$(db_field '{{.Id}}')"
          DB_IMAGE_ID_AFTER="$(db_field '{{.Image}}')"
          DB_RESTART_COUNT_AFTER="$(db_field '{{.RestartCount}}')"
          DB_HEALTH_AFTER="$(db_field '{{with (index .State "Health")}}{{.Status}}{{else}}none{{end}}')"
          [ "$DB_ID_AFTER" = "$DB_ID_BEFORE" ] || fail "DB container ID changed: before=$DB_ID_BEFORE after=$DB_ID_AFTER"
          [ "$DB_IMAGE_ID_AFTER" = "$DB_IMAGE_ID_BEFORE" ] || fail "DB image ID changed: before=$DB_IMAGE_ID_BEFORE after=$DB_IMAGE_ID_AFTER"
          [ "$DB_RESTART_COUNT_AFTER" = "$DB_RESTART_COUNT_BEFORE" ] || fail "DB restart_count changed: before=$DB_RESTART_COUNT_BEFORE after=$DB_RESTART_COUNT_AFTER"
          [ "$DB_HEALTH_AFTER" = "healthy" ] || fail "DB is not healthy after reset (got $DB_HEALTH_AFTER)"

          TOR_ID_AFTER="$(tor_field '{{.Id}}')"
          TOR_IMAGE_ID_AFTER="$(tor_field '{{.Image}}')"
          TOR_RESTART_COUNT_AFTER="$(tor_field '{{.RestartCount}}')"
          TOR_HEALTH_AFTER="$(tor_field '{{with (index .State "Health")}}{{.Status}}{{else}}none{{end}}')"
          [ "$TOR_ID_AFTER" = "$TOR_ID_BEFORE" ] || fail "Tor container ID changed: before=$TOR_ID_BEFORE after=$TOR_ID_AFTER"
          [ "$TOR_IMAGE_ID_AFTER" = "$TOR_IMAGE_ID_BEFORE" ] || fail "Tor image ID changed: before=$TOR_IMAGE_ID_BEFORE after=$TOR_IMAGE_ID_AFTER"
          [ "$TOR_RESTART_COUNT_AFTER" = "$TOR_RESTART_COUNT_BEFORE" ] || fail "Tor restart_count changed: before=$TOR_RESTART_COUNT_BEFORE after=$TOR_RESTART_COUNT_AFTER"
          [ "$TOR_HEALTH_AFTER" = "healthy" ] || fail "Tor is not healthy after reset (got $TOR_HEALTH_AFTER)"
          TOR_PUBLISHED_PORTS_AFTER="$(docker port jobpulse-tor-prod 2>/dev/null || true)"
          [ -z "$TOR_PUBLISHED_PORTS_AFTER" ] || fail "Tor now publishes host ports (expected none): $TOR_PUBLISHED_PORTS_AFTER"
          echo "db_tor_post_reset_invariant=ok"

          echo "===RECOVERY_END==="
          echo "FUNCTIONAL_F476_BASELINE_RESTORED_API_REFERENCE_ALIAS_REMAINS"
          echo "PRODUCTION_SPLIT_RELEASE_RECOVERY_COMPLETE"
          REMOTE
          SSH_EXIT="${PIPESTATUS[0]}"
          set -e

          if [ "$SSH_EXIT" -ne 0 ] || ! grep -q '^PRODUCTION_SPLIT_RELEASE_RECOVERY_COMPLETE$' "$OUTPUT_FILE"; then
            echo "PRODUCTION_SPLIT_RELEASE_RECOVERY_INCOMPLETE"
            {
              echo "## Production Split-Release Recovery"
              echo
              echo "**Result: PRODUCTION_SPLIT_RELEASE_RECOVERY_INCOMPLETE**"
              echo
              echo '```'
              cat "$OUTPUT_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## Production Split-Release Recovery"
            echo
            echo '```'
            sed -n '/===RECOVERY_START===/,/===RECOVERY_END===/p' "$OUTPUT_FILE"
            echo '```'
            echo
            echo "**Result: PRODUCTION_SPLIT_RELEASE_RECOVERY_COMPLETE**"
            echo
            echo "Classification: FUNCTIONAL_F476_BASELINE_RESTORED_API_REFERENCE_ALIAS_REMAINS"
            echo "(the API's Config.Image alias, jobpulse-api-rollback:bccbbd997ee8-1427495,"
            echo "is left as-is -- normalizing it is a separate, later change.)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "PRODUCTION_SPLIT_RELEASE_RECOVERY_COMPLETE"

      - name: Clean up local SSH key material
        if: always()
        run: |
          rm -f ~/.ssh/jobpulse_recovery_key
