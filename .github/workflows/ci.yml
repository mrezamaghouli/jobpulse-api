name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_real_tor:
        description: >-
          Run the live Tor integration job (tests/test_tor_real_integration.py
          -- real Tor daemon bootstrap against the live Tor network). Leave
          false for an ordinary manual CI run; this exists ONLY so that job
          can be triggered deliberately, on demand, never as a side effect
          of an ordinary push/PR/manual dispatch.
        required: false
        default: false
        type: boolean

jobs:
  verify:
    name: Verify Python and Docker Compose
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jobpulse
      POSTGRES_USER: jobpulse_user
      POSTGRES_PASSWORD: jobpulse_password
      DATABASE_URL: postgresql://jobpulse_user:jobpulse_password@db:5432/jobpulse
      LINKEDIN_BROWSER: chromium
      LINKEDIN_HEADLESS: "true"
      JOB_SEARCH_MIN_RELEVANCE_SCORE: "0.38"
      JOB_SEARCH_KEYWORD_MIN_RELEVANCE_SCORE: "0.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env <<'EOF'
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_DB=jobpulse
          POSTGRES_USER=jobpulse_user
          POSTGRES_PASSWORD=jobpulse_password
          DATABASE_URL=postgresql://jobpulse_user:jobpulse_password@db:5432/jobpulse
          LINKEDIN_BROWSER=chromium
          LINKEDIN_HEADLESS=true
          JOB_SEARCH_MIN_RELEVANCE_SCORE=0.38
          JOB_SEARCH_KEYWORD_MIN_RELEVANCE_SCORE=0.12
          EOF

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall app scripts

      - name: Check important scripts
        run: |
          python -m py_compile scripts/collector_postgres.py
          python -m py_compile scripts/process_search_demand_queue.py
          python -m py_compile scripts/seed_autonomous_search_queue.py
          python -m py_compile scripts/build_linkedin_collection_targets.py
          python -m py_compile scripts/migrate_database.py
          python -m py_compile scripts/process_summary.py
          python -m py_compile scripts/seed_priority_coverage_queue.py
          python -m py_compile scripts/reconcile_priority_coverage.py

      - name: Run focused Tor unit suite (no real Tor daemon, no network)
        # Scoped, network-free suite covering the Phase 2 Tor
        # control-plane (scripts/tor/circuit_manager.py,
        # scripts/tor/observability.py, scripts/tor/local_http_simulator.py)
        # plus the pre-existing Tor unit tests, plus
        # tests/test_tor_dark_launch_script.py (Phase 3), which executes
        # the real scripts/tor/production_dark_launch.sh with fake
        # docker/curl binaries placed first on PATH, plus
        # tests/test_tor_secret_provision.py (Phase 3.1), which executes
        # the real .github/scripts/tor/provision_production_secret.sh
        # with fake docker/curl/stat/git/ln binaries placed first on PATH,
        # plus tests/test_production_runtime_diagnostic.py (Phase 3.1A),
        # a static audit of the read-only
        # production-runtime-diagnostic.yml workflow (workflow_dispatch
        # trigger shape, secrets usage, forbidden-command absence,
        # metadata-only docker inspect templates, bash -n syntax on the
        # extracted remote script), plus tests/test_tor_runtime_monitor.py
        # (Phase 3.4D), a static/security audit of the read-only
        # tor-runtime-monitor.yml workflow plus a behavioral audit that
        # extracts its classify_evidence() bash function and actually
        # executes it with fabricated evidence for all 20 severity
        # scenarios -- no real Docker, no real network,
        # no SSH. Every other file here mocks
        # psycopg2 and stem.control.Controller -- none opens a real
        # database connection or contacts a real Tor process, and none
        # performs live LinkedIn/network traffic. This is
        # DELIBERATELY separate from a full-repository pytest run: the
        # repository has 7 known, pre-existing, environment-sensitive
        # failures (subprocess/signal/process-group behavior) unrelated
        # to Tor, tracked separately and not gated on here -- adding a
        # full-repo job in this pass would make PR CI red for reasons
        # having nothing to do with the change being validated. The
        # separate, real PostgreSQL 16 Tor integration job below
        # (`tor-postgres-integration`) is what actually exercises this
        # code against a live database.
        run: |
          PYTHONPATH=. python -m pytest \
            tests/test_tor_circuit_manager.py \
            tests/test_tor_observability.py \
            tests/test_tor_local_simulator.py \
            tests/test_tor_client_config.py \
            tests/test_tor_healthcheck_restart_safety.py \
            tests/test_verify_tor_connectivity.py \
            tests/test_tor_production_dark_launch.py \
            tests/test_tor_dark_launch_script.py \
            tests/test_tor_secret_provision.py \
            tests/test_production_runtime_diagnostic.py \
            tests/test_tor_runtime_monitor.py \
            -v

      - name: Run focused Phase 3.4K/3.4L search-transport unit suite (no real Tor, no real LinkedIn traffic)
        # Scoped, network-free suite covering the Phase 3.4K search
        # transport abstraction (scripts/search_transport/) and its
        # collector/queue integration points, plus the Phase 3.4K
        # Stabilization pass fixes: fail-closed SEARCH_TRANSPORT config
        # (tests/test_config.py's transport cases), preflight/collector
        # transport parity, unattended login/checkpoint handling, and the
        # per-query collector_postgres subprocess deadline, plus the Final
        # Pre-Commit Safety Pass's structural/behavioral proof
        # (tests/test_no_automatic_tor_rotation.py) that no collection
        # runtime module can automatically trigger a Tor circuit change,
        # plus the Phase 3.4L isolated SOCKS-only neutral canary
        # (tests/test_search_transport_canary.py) -- fully mocked
        # Playwright/transport, proving the canary's exit-code contract,
        # IsTor/IP semantic verification, and LinkedIn/control-plane
        # isolation guards. Every file here uses fakes/stubs for
        # Playwright, subprocess, and psycopg2 -- none opens a real
        # browser, contacts a real Tor daemon, makes real LinkedIn
        # traffic, or requires production credentials. This is
        # DELIBERATELY separate from the Tor unit suite step above so a
        # failure here is attributable to this phase specifically.
        run: |
          PYTHONPATH=. python -m pytest \
            tests/test_search_transport_classifier.py \
            tests/test_search_transport_executor.py \
            tests/test_search_transport_metrics.py \
            tests/test_search_transport_retry_policy.py \
            tests/test_search_transport_transport.py \
            tests/test_search_transport_canary.py \
            tests/test_linkedin_browser_provider_transport.py \
            tests/test_search_demand_queue_retry_budget.py \
            tests/test_linkedin_auth_preflight_transport.py \
            tests/test_linkedin_browser_provider_unattended_auth.py \
            tests/test_linkedin_plan_collect_query_deadline.py \
            tests/test_search_transport_benchmark_metrics.py \
            tests/test_no_automatic_tor_rotation.py \
            tests/test_config.py \
            -v

      - name: Create dummy prod env files for compose validation
        shell: bash
        run: |
          set -euo pipefail
          : > .env
          printf '%s\n' 'JOBPULSE_PUBLIC_API_KEYS=dummy-ci-key' > .api_keys.env
          sudo mkdir -p /opt/jobpulse
          printf '%s\n' 'JOBPULSE_ADMIN_TOKEN=dummy-ci-admin-token' | sudo tee /opt/jobpulse/.admin.env >/dev/null
          printf '%s\n' 'dummy-ci-admin-token' | sudo tee /opt/jobpulse/.admin_token >/dev/null
          printf '%s\n' 'TELEGRAM_BOT_TOKEN=dummy' | sudo tee /opt/jobpulse/.telegram_alert.env >/dev/null
          printf '%s\n' 'dummy-ci-tor-control-password' | sudo tee /opt/jobpulse/.tor_control_password >/dev/null

      - name: Validate Docker Compose config
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Validate production Tor dark-launch overlay config
        # Phase 3: proves the merged prod + tor overlay config resolves,
        # adds only tor/tor-diagnostic on top of the untouched base
        # services, publishes no 9050/9051 host ports, and leaves api's
        # TOR_ENABLED at "false" with no depends_on pointing at tor. This
        # is a config-resolution check only -- it starts no containers.
        env:
          JOBPULSE_TOR_IMAGE: ghcr.io/mrezamaghouli/jobpulse-tor:ci-dummy
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.tor.yml config

          echo "-- asserting no host port publication for 9050/9051 --"
          if docker compose -f docker-compose.prod.yml -f docker-compose.prod.tor.yml config --format json \
            | python3 -c "import json,sys; c=json.load(sys.stdin); assert 'ports' not in c['services']['tor'], 'tor service must not publish ports'; print('OK: no published ports for tor service')"; then
            :
          else
            echo "FAILED: tor service must not have a ports: mapping" >&2
            exit 1
          fi

          echo "-- asserting api stays TOR_ENABLED=false and has no depends_on tor --"
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.tor.yml config --format json \
            | python3 -c "import json,sys; c=json.load(sys.stdin); api=c['services']['api']; assert api['environment'].get('TOR_ENABLED')=='false', api['environment'].get('TOR_ENABLED'); assert 'tor' not in api.get('depends_on', {}), api.get('depends_on'); print('OK: api.TOR_ENABLED=false, no depends_on tor')"

          echo "-- asserting tor-diagnostic only appears under the tor-ops profile --"
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.tor.yml config --format json \
            | python3 -c "import json,sys; c=json.load(sys.stdin); assert 'tor-diagnostic' not in c['services'], 'tor-diagnostic must not appear without --profile tor-ops'; print('OK: tor-diagnostic absent from default config')"

      - name: Check production shell scripts
        run: |
          bash -n scripts/production_health_alert.sh
          bash -n scripts/run_production_alert_checks.sh
          bash -n scripts/production_cleanup.sh
          bash -n scripts/production_smoke_test.sh
          bash -n scripts/run_collection_cycle_safe.sh


  postgres-upsert-integration:
    name: PostgreSQL 16 UPSERT RETURNING integration
    runs-on: ubuntu-latest
    # Runs ONLY tests/test_upsert_returning_integration.py -- real
    # PostgreSQL 16 evidence for scripts/collector_postgres.py's
    # `RETURNING (xmax = 0) AS inserted` insert/update distinction. Every
    # other test in this repository is DB-free (mocked); this is the one
    # deliberate exception, scoped to a single file, against a disposable
    # CI-provided database -- never production, never Docker directly
    # (this is a GitHub Actions `services:` container, not this repo
    # invoking Docker itself).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpulse_test
          POSTGRES_PASSWORD: jobpulse_test
          POSTGRES_DB: jobpulse_upsert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpulse_test -d jobpulse_upsert_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JOBPULSE_TEST_POSTGRES_DSN: "postgresql://jobpulse_test:jobpulse_test@localhost:5432/jobpulse_upsert_test"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jobpulse_upsert_test
      POSTGRES_USER: jobpulse_test
      POSTGRES_PASSWORD: jobpulse_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight -- DSN set, psycopg2 importable, database reachable
        # Deliberately does NOT rely on `pg_isready` alone (it ships in
        # the postgresql-client package installed above, not in
        # build-essential/libpq-dev, which is exactly the gap this step
        # closes) -- the actual readiness gate is a bounded psycopg2
        # connection retry using the SAME driver and DSN the integration
        # test itself uses, so "ready" here means "ready for what the
        # test actually needs," not merely "the postgres process accepts
        # TCP connections." Has a hard maximum duration (30 attempts x1s
        # = 30s) and exits non-zero -- never falls through successfully
        # -- if the database never becomes reachable in that window.
        run: |
          python -c "
          import os
          import sys
          import time

          dsn = os.environ.get('JOBPULSE_TEST_POSTGRES_DSN', '')
          if not dsn:
              print('JOBPULSE_TEST_POSTGRES_DSN is not set or empty', file=sys.stderr)
              sys.exit(1)
          print('JOBPULSE_TEST_POSTGRES_DSN is set: OK')

          try:
              import psycopg2
          except ImportError as exc:
              print(f'psycopg2 import failed: {exc}', file=sys.stderr)
              sys.exit(1)
          print('psycopg2 import: OK')

          max_attempts = 30
          delay_seconds = 1.0

          for attempt in range(1, max_attempts + 1):
              try:
                  conn = psycopg2.connect(dsn, connect_timeout=5)
                  conn.close()
                  print(f'PostgreSQL reachable after {attempt} attempt(s): OK')
                  sys.exit(0)
              except Exception as exc:
                  print(f'attempt {attempt}/{max_attempts} failed: {exc}')
                  if attempt < max_attempts:
                      time.sleep(delay_seconds)

          print(f'PostgreSQL never became reachable within {max_attempts} attempts ({max_attempts * delay_seconds:.0f}s bound)', file=sys.stderr)
          sys.exit(1)
          "

      - name: Run the PostgreSQL 16 UPSERT integration test only (fails if skipped)
        # `--junit-xml` + the parser below is what proves the test file
        # was actually EXECUTED for real (skipped=0), not merely that
        # pytest exited 0 -- pytest's own exit code is 0 whether tests
        # ran or were all skipped, so the exit code alone cannot detect
        # "the DSN preflight passed but the test still didn't run."
        run: |
          PYTHONPATH=. python -m pytest tests/test_upsert_returning_integration.py -v -rs --junit-xml=pg-integration-report.xml

          python -c "
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse('pg-integration-report.xml')
          root = tree.getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')

          tests = int(suite.get('tests', 0))
          skipped = int(suite.get('skipped', 0))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))

          print(f'tests={tests} skipped={skipped} failures={failures} errors={errors}')

          if tests == 0:
              print('No tests were collected in tests/test_upsert_returning_integration.py -- treating as failure', file=sys.stderr)
              sys.exit(1)
          if skipped > 0:
              print(f'{skipped} test(s) were unexpectedly SKIPPED in CI -- the PostgreSQL 16 integration test must actually run here, never be skipped', file=sys.stderr)
              sys.exit(1)
          if failures > 0 or errors > 0:
              sys.exit(1)

          print('PostgreSQL 16 integration test executed for real with zero skips: OK')
          "


  postgres-collection-integration:
