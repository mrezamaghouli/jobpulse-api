name: Provision Production Tor Secret

# ============================================================================
# PHASE 3.1 -- PRODUCTION TOR SECRET PROVISIONING ONLY.
#
# This workflow creates (or validates the existing) production Tor
# ControlPort secret at /opt/jobpulse/.tor_control_password. It never
# starts Tor, never changes TOR_ENABLED, never mutates api/db/frontend,
# and never routes any traffic through Tor. workflow_dispatch ONLY -- no
# push, pull_request, workflow_run, or schedule trigger exists here, so
# this can never run as a side effect of ordinary CI or of
# docker-build.yml / tor-image-build.yml / deploy.yml.
#
# The entire remote procedure lives in the version-controlled, directly
# testable .github/scripts/tor/provision_production_secret.sh -- see
# tests/test_tor_secret_provision.py, which executes that EXACT file
# (never a duplicated/simplified copy) with fake docker/curl/stat/git on
# PATH. That file is piped over this SSH session's stdin from the
# runner's own checkout on every dispatch -- deliberately NOT invoked
# from an already-deployed copy on the VM (contrast
# tor-dark-launch.yml), since this phase must work even while production
# is still pinned at a SHA that predates this workflow's own existence.
#
# The Tor ControlPort password itself is generated with `openssl rand
# -hex 32` directly on the production VM, inside the script above --
# never on this runner, never as a GitHub secret, env var, or workflow
# output. Only secrets.VM_SSH_KEY is used here, purely to establish SSH
# transport.
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROVISION_TOR_SECRET to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jobpulse-production-tor-secret-provision
  cancel-in-progress: false

jobs:
  provision-secret:
    runs-on: ubuntu-latest

    env:
      VM_HOST: "35.192.251.190"
      VM_USER: "mrezamaghouli"
      VM_PORT: "22"
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      CONFIRM_INPUT: ${{ inputs.confirm }}
      # Not a secret -- deliberately NOT a workflow_dispatch input (an
      # operator-editable field here could target the wrong commit by
      # typo). Pinned to the validated production SHA for Phase 3.1.
      # Intentionally never compared against origin/main, which will
      # move as soon as this workflow file itself is merged.
      EXPECTED_PRODUCTION_SHA: "5dffbd669eec52f5283503bb6409a430509175a0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate confirmation input and secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CONFIRM_INPUT" != "PROVISION_TOR_SECRET" ]; then
            echo "ERROR: confirm input must be exactly PROVISION_TOR_SECRET (got: $CONFIRM_INPUT)" >&2
            exit 1
          fi

          if [ -z "${VM_SSH_KEY:-}" ]; then
            echo "VM_SSH_KEY secret is missing"
            exit 1
          fi

      - name: Provision Tor secret on production VM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/jobpulse_tor_secret_key
          chmod 600 ~/.ssh/jobpulse_tor_secret_key
          ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

          # The helper script travels over this ssh session's stdin from
          # the runner's own checkout -- see the header comment above.
          # EXPECTED_PRODUCTION_SHA is not a secret; the generated
          # password never appears on this runner or in this workflow's
          # own logs.
          ssh -i ~/.ssh/jobpulse_tor_secret_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            "EXPECTED_PRODUCTION_SHA='$EXPECTED_PRODUCTION_SHA' bash -s" \
            < .github/scripts/tor/provision_production_secret.sh
