name: Production Tor Dark Launch

# ============================================================================
# PHASE 3 DESIGN ONLY -- NOT TO BE DISPATCHED AS PART OF THIS TASK.
#
# This workflow is written so the manual dark-launch procedure exists as
# reviewable, version-controlled code, not tribal knowledge. It has never
# been run. Dispatching it is a separate, explicit, future decision by an
# operator -- creating this file does not start, schedule, or authorize
# any run of it.
# ============================================================================
#
# workflow_dispatch ONLY -- this must never trigger automatically. It is
# NOT wired to "Build JobPulse Tor Image" or "Deploy Production" the way
# deploy.yml reacts to "Build JobPulse API Image": no `push`, no
# `workflow_run`, no `schedule` trigger exists here at all. Building/
# pushing a new Tor image (tor-image-build.yml) or deploying an
# application change (deploy.yml) can never, by themselves, cause this
# workflow to run.
#
# This workflow is deliberately THIN: all operational logic (secret
# preconditions, GHCR auth, image pull + identity verification, tor-only
# start, before/after API invariant checks, tor-only rollback on any
# failure) lives in the version-controlled, directly-testable
# scripts/tor/production_dark_launch.sh -- see
# tests/test_tor_dark_launch_script.py, which executes that EXACT file
# (never a duplicated/simplified copy) with fake docker/curl on PATH.
# This job's only jobs are: validate the operator-supplied image
# reference, establish SSH, and invoke the ALREADY-DEPLOYED copy of that
# exact script at /opt/jobpulse/scripts/tor/production_dark_launch.sh on
# the remote host (put there by the normal deploy pipeline, same as every
# other scripts/ file -- this workflow never scp's/pushes it itself).
#
# Deliberately does NOT pipe the script body over the ssh session's
# stdin (an earlier design did): doing so would leave stdin unavailable
# for anything else, forcing GHCR_TOKEN_B64 into the ssh command line
# itself, where it is a plain process argv substring on the remote host
# for the life of that command (observable via `ps`/`/proc/<pid>/cmdline`
# to any other local user/process with visibility into the process
# table). Invoking the already-deployed path instead frees stdin to
# carry GHCR_TOKEN_B64: the remote shell reads it into an env var via
# `$(cat)` before exec'ing the script, so the token bytes are never a
# command-line argument on the remote host. Residual exposure: once
# assigned, the token is visible in that one remote bash (and its
# `docker login` child) process's own environment -- e.g. via
# /proc/<pid>/environ to the same user or root -- which is unavoidable
# since docker login must receive it somehow; this eliminates only the
# argv/`ps` exposure, not same-host root/same-user introspection.
# TOR_IMAGE_B64 is NOT a secret (a strictly-validated image reference,
# already gated by the step above) and stays in the ssh argv assignment.
#
# --- Phase 3.2B pinning ---------------------------------------------------
# docker-compose.prod.tor.yml's `tor-diagnostic` service resolves its image
# as `${JOBPULSE_API_IMAGE:-ghcr.io/mrezamaghouli/jobpulse-api:main}`, and
# its `TOR_IP_CHECK_URL` as `${TOR_IP_CHECK_URL:-https://check.torproject.org/api/ip}`.
# Compose only falls back to those mutable defaults when the shell
# environment does NOT already define the variable -- so this workflow
# must always supply both explicitly, or the diagnostic could silently
# run the floating `:main` API image, or a `TOR_IP_CHECK_URL` overridden
# by production's own .env, neither of which is acceptable for the first
# production dark launch. PRODUCTION_API_IMAGE is a fixed, non-secret,
# strictly-validated constant -- NOT derived from `github.sha`/main (the
# GitHub runner's checkout may be newer than what's actually deployed;
# production is intentionally still pinned to Phase 3's
# 5dffbd669eec52f5283503bb6409a430509175a0) and NOT a workflow_dispatch
# input (an operator-editable field here could target the wrong image by
# typo, exactly like EXPECTED_PRODUCTION_SHA in tor-secret-provision.yml).
# TOR_DARK_LAUNCH_IP_CHECK_URL is likewise fixed, not an input: the first
# production dark launch must always probe the same well-known neutral
# endpoint, never an operator-supplied URL.
on:
  workflow_dispatch:
    inputs:
      tor_image:
        description: >-
          Exact immutable Tor image to launch, e.g.
          ghcr.io/mrezamaghouli/jobpulse-tor:<40-char-commit-sha>. Must be
          pinned to a commit SHA tag -- "main"/"latest" are rejected. For
          the first production dark launch this must equal
          EXPECTED_TOR_IMAGE below exactly.
        required: true
        type: string
      confirm:
        description: 'Type LAUNCH_TOR_DARK to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jobpulse-production-tor-dark-launch
  cancel-in-progress: false

jobs:
  dark-launch:
    runs-on: ubuntu-latest

    env:
      VM_HOST: "35.192.251.190"
      VM_USER: "mrezamaghouli"
      VM_PORT: "22"
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      TOR_IMAGE_INPUT: ${{ inputs.tor_image }}
      CONFIRM_INPUT: ${{ inputs.confirm }}
      # Not secrets -- see the "Phase 3.2B pinning" header comment above.
      # Fixed constants, deliberately never workflow_dispatch inputs.
      PRODUCTION_API_IMAGE: "ghcr.io/mrezamaghouli/jobpulse-api:5dffbd669eec52f5283503bb6409a430509175a0"
      TOR_DARK_LAUNCH_IP_CHECK_URL: "https://check.torproject.org/api/ip"
      # Phase 3.2C: the FIRST production dark launch must target the
      # exact, currently-observed production checkout and its
      # correspondingly-built Tor image -- not merely "a" validly-shaped
      # SHA. Not derived from github.sha: the GitHub runner's checkout is
      # intentionally newer than what's actually deployed (production
      # remains pinned to Phase 3's 5dffbd669eec52f5283503bb6409a430509175a0
      # until a separate, explicit deploy decision moves it). Both are
      # fixed constants, never workflow_dispatch inputs, for the same
      # typo-safety reason as PRODUCTION_API_IMAGE above.
      EXPECTED_PRODUCTION_SHA: "5dffbd669eec52f5283503bb6409a430509175a0"
      EXPECTED_TOR_IMAGE: "ghcr.io/mrezamaghouli/jobpulse-tor:5dffbd669eec52f5283503bb6409a430509175a0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs and secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CONFIRM_INPUT" != "LAUNCH_TOR_DARK" ]; then
            echo "ERROR: confirm input must be exactly LAUNCH_TOR_DARK (got: $CONFIRM_INPUT)" >&2
            exit 1
          fi

          if [ -z "${VM_SSH_KEY:-}" ]; then
            echo "VM_SSH_KEY secret is missing"
            exit 1
          fi

          # Must be ghcr.io/mrezamaghouli/jobpulse-tor:<40-hex-char-sha> --
          # explicitly rejects "main"/"latest"/short SHAs/any other
          # floating tag, any foreign registry or repository, and any
          # value containing shell metacharacters or whitespace (the
          # regex's fixed charset admits none), so a dark-launch run
          # always names an exact, reviewable image. Revalidated again,
          # independently, on the remote host by
          # scripts/tor/production_dark_launch.sh itself -- this step
          # must never be the only gate.
          if ! [[ "$TOR_IMAGE_INPUT" =~ ^ghcr\.io/mrezamaghouli/jobpulse-tor:[0-9a-f]{40}$ ]]; then
            echo "ERROR: tor_image must be ghcr.io/mrezamaghouli/jobpulse-tor:<40-char-commit-sha> (got: $TOR_IMAGE_INPUT)" >&2
            exit 1
          fi

          # Phase 3.2C: the regex above accepts ANY validly-shaped SHA --
          # exact equality against EXPECTED_TOR_IMAGE is what actually
          # pins the FIRST dark launch to the one Tor image that was
          # really built from the currently-deployed production commit.
          # A different, otherwise-valid 40-hex-char SHA must be rejected
          # here.
          if [ "$TOR_IMAGE_INPUT" != "$EXPECTED_TOR_IMAGE" ]; then
            echo "ERROR: tor_image must be exactly $EXPECTED_TOR_IMAGE for the first production dark launch (got: $TOR_IMAGE_INPUT)" >&2
            exit 1
          fi

          echo "Validated tor_image: $TOR_IMAGE_INPUT"

          # PRODUCTION_API_IMAGE/TOR_DARK_LAUNCH_IP_CHECK_URL are fixed
          # constants above, not operator input -- validated anyway as a
          # regression guard, same discipline as the tor_image check.
          if ! [[ "$PRODUCTION_API_IMAGE" =~ ^ghcr\.io/mrezamaghouli/jobpulse-api:[0-9a-f]{40}$ ]]; then
            echo "ERROR: PRODUCTION_API_IMAGE must be ghcr.io/mrezamaghouli/jobpulse-api:<40-char-commit-sha> (got: $PRODUCTION_API_IMAGE)" >&2
            exit 1
          fi
          if [ "$PRODUCTION_API_IMAGE" != "ghcr.io/mrezamaghouli/jobpulse-api:5dffbd669eec52f5283503bb6409a430509175a0" ]; then
            echo "ERROR: PRODUCTION_API_IMAGE must be pinned to the currently deployed production SHA 5dffbd669eec52f5283503bb6409a430509175a0 (got: $PRODUCTION_API_IMAGE)" >&2
            exit 1
          fi
          echo "Validated PRODUCTION_API_IMAGE: $PRODUCTION_API_IMAGE"

          if [ "$TOR_DARK_LAUNCH_IP_CHECK_URL" != "https://check.torproject.org/api/ip" ]; then
            echo "ERROR: TOR_DARK_LAUNCH_IP_CHECK_URL must be exactly https://check.torproject.org/api/ip (got: $TOR_DARK_LAUNCH_IP_CHECK_URL)" >&2
            exit 1
          fi
          echo "Validated TOR_DARK_LAUNCH_IP_CHECK_URL: $TOR_DARK_LAUNCH_IP_CHECK_URL"

      - name: Run Tor dark-launch on production VM
        shell: bash
        run: |
          set -euo pipefail

          # --- Operator-facing DB side-effect notice (non-secret, no DB
          # credentials) -- printed to this GitHub Actions log BEFORE the
          # production SSH connection is even established, so an operator
          # reading the log has the correct semantics up front. The
          # already-deployed scripts/tor/production_dark_launch.sh
          # contains one legacy diagnostic-failure message whose wording
          # about the database is not fully accurate -- this notice
          # corrects that at the workflow level without modifying that
          # deployed script in this pass.
          cat <<'NOTICE'
          ============================================================
          Dark-launch diagnostic DB side-effect notice:

          The Tor dark-launch diagnostic (tor-diagnostic service,
          scripts/tor/production_dark_launch_check.py) MAY persist Tor
          control-plane bootstrap observability in PostgreSQL:
            - tor_instances       (bootstrap status/timestamps)
            - tor_circuit_events  (bounded-retention lifecycle events)

          It must NOT mutate business/job data:
            - jobs
            - companies
            - linkedin_query_runs
            - any collector/job-ingestion execution

          Tor rollback (on any dark-launch failure) removes ONLY the tor
          container/service -- it does NOT revert the Tor control-plane
          observability records above.
          ============================================================
          NOTICE

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/jobpulse_tor_launch_key
          chmod 600 ~/.ssh/jobpulse_tor_launch_key
          ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

          TOR_IMAGE_B64="$(printf '%s' "$TOR_IMAGE_INPUT" | base64 -w 0)"
          GHCR_TOKEN_B64="$(printf '%s' "${GHCR_TOKEN:-}" | base64 -w 0)"

          # Invokes the exact, already-deployed script file at
          # /opt/jobpulse/scripts/tor/production_dark_launch.sh -- the
          # same file exercised by tests/test_tor_dark_launch_script.py,
          # never a duplicated/simplified copy. GHCR_TOKEN_B64 travels
          # only over this ssh session's stdin (never the command line);
          # the remote shell reads it into an env var via `$(cat)` before
          # running the script. See the comment block above this job for
          # why (avoids the token being a process argv substring on the
          # remote host).
          #
          # JOBPULSE_API_IMAGE/TOR_IP_CHECK_URL are set here in the remote
          # shell environment, exactly like TOR_IMAGE_B64 -- non-secret,
          # strictly-validated fixed constants, safe as plain ssh argv
          # assignments. docker compose (invoked inside
          # production_dark_launch.sh) only falls back to
          # docker-compose.prod.tor.yml's `:main`/production-.env-derived
          # defaults when a variable is UNSET in its process environment,
          # so explicitly setting both here -- not merely hoping
          # production's .env happens to agree -- is what actually pins
          # the tor-diagnostic container's API image and neutral URL for
          # this run.
          #
          # Phase 3.2C: BEFORE any of that, this SAME remote shell session
          # (one ssh invocation, one bash -c process on the VM -- not a
          # separate SSH round-trip that could race) runs a preflight
          # gate: (1) production's actual git HEAD must equal
          # EXPECTED_PRODUCTION_SHA -- the earlier manual/workflow-level
          # SHA observations are not relied on for this decision, only a
          # live `git rev-parse HEAD` on the VM itself; (2) none of the
          # exact tracked dark-launch-critical files may differ from
          # HEAD (read-only `git diff --quiet HEAD -- <files>`,
          # deliberately scoped to only those files rather than requiring
          # the whole working tree clean -- production has known,
          # legitimate untracked runtime paths such as state/). Either
          # failure prints a non-secret error and exits non-zero WITHOUT
          # ever reaching production_dark_launch.sh -- no docker login,
          # no pull, no Tor start.
          ssh -i ~/.ssh/jobpulse_tor_launch_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            "set -e
          cd /opt/jobpulse || { echo 'TOR_DARK_LAUNCH_PREFLIGHT_FAILED: cannot cd to /opt/jobpulse' >&2; exit 1; }
          ACTUAL_PRODUCTION_SHA=\$(git rev-parse HEAD)
          if [ \"\$ACTUAL_PRODUCTION_SHA\" != '$EXPECTED_PRODUCTION_SHA' ]; then
            echo \"TOR_DARK_LAUNCH_PREFLIGHT_FAILED: production SHA mismatch -- expected $EXPECTED_PRODUCTION_SHA, found \$ACTUAL_PRODUCTION_SHA\" >&2
            exit 1
          fi
          if ! git diff --quiet HEAD -- scripts/tor/production_dark_launch.sh scripts/tor/production_dark_launch_check.py docker-compose.prod.yml docker-compose.prod.tor.yml; then
            echo 'TOR_DARK_LAUNCH_PREFLIGHT_FAILED: tracked dark-launch-critical file(s) differ from HEAD -- refusing to proceed' >&2
            exit 1
          fi
          echo TOR_DARK_LAUNCH_PREFLIGHT_OK
          GHCR_TOKEN_B64=\"\$(cat)\" TOR_IMAGE_B64='$TOR_IMAGE_B64' JOBPULSE_API_IMAGE='$PRODUCTION_API_IMAGE' TOR_IP_CHECK_URL='$TOR_DARK_LAUNCH_IP_CHECK_URL' /opt/jobpulse/scripts/tor/production_dark_launch.sh" \
            <<< "$GHCR_TOKEN_B64"
