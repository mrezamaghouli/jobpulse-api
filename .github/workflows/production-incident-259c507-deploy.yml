          SEARCH_TRANSPORT_BEFORE="$(docker exec jobpulse-api-prod printenv SEARCH_TRANSPORT 2>/dev/null || echo UNSET)"
          TOR_ENABLED_BEFORE="$(docker exec jobpulse-api-prod printenv TOR_ENABLED 2>/dev/null || echo UNSET)"
          echo "search_transport_before=$SEARCH_TRANSPORT_BEFORE"
          echo "tor_enabled_before=$TOR_ENABLED_BEFORE"
          if [ "$SEARCH_TRANSPORT_BEFORE" != "UNSET" ] && [ "$SEARCH_TRANSPORT_BEFORE" != "direct" ]; then
            fail "SEARCH_TRANSPORT is neither unset nor 'direct' (got $SEARCH_TRANSPORT_BEFORE)"
          fi
          [ "$TOR_ENABLED_BEFORE" = "false" ] || fail "TOR_ENABLED is not exactly 'false' (got $TOR_ENABLED_BEFORE)"

          echo "== precondition: running API executes the f476 (pre-fix) collector =="
          COLLECTOR_SHA_BEFORE="$(in_container_collector_sha256)" || fail "cannot read the in-container collector hash"
          [ "$COLLECTOR_SHA_BEFORE" = "$F476_COLLECTOR_SHA256" ] || fail "running API collector_postgres.py SHA-256 ($COLLECTOR_SHA_BEFORE) is not the f476 version ($F476_COLLECTOR_SHA256)"
          echo "in_container_collector=f476"
          PROVIDER_SHA_BEFORE="$(in_container_provider_sha256)" || fail "cannot read the in-container provider hash"
          [ "$PROVIDER_SHA_BEFORE" = "$F476_PROVIDER_SHA256" ] || fail "running API linkedin_browser_provider.py SHA-256 ($PROVIDER_SHA_BEFORE) is not the f476 version ($F476_PROVIDER_SHA256)"
          echo "in_container_provider=f476"

          echo "== precondition: DB / frontend / Tor identity captured (never recreated/restarted) =="
          DB_STATE_BEFORE="$(container_state jobpulse-postgres-prod)" || fail "jobpulse-postgres-prod does not exist"
          FRONTEND_STATE_BEFORE="$(container_state jobpulse-frontend-prod)" || fail "jobpulse-frontend-prod does not exist"
          TOR_STATE_BEFORE="$(container_state jobpulse-tor-prod)" || fail "jobpulse-tor-prod does not exist"
          echo "db_state_before=$DB_STATE_BEFORE"
          echo "frontend_state_before=$FRONTEND_STATE_BEFORE"
          echo "tor_state_before=$TOR_STATE_BEFORE"
          [ "$(state_field "$DB_STATE_BEFORE" 4)" = "true" ] || fail "DB is not running"
          [ "$(state_field "$DB_STATE_BEFORE" 5)" = "healthy" ] || fail "DB is not healthy (got $(state_field "$DB_STATE_BEFORE" 5))"
          [ "$(state_field "$FRONTEND_STATE_BEFORE" 4)" = "true" ] || fail "frontend is not running"
          [ "$(state_field "$TOR_STATE_BEFORE" 4)" = "true" ] || fail "Tor is not running"
          TOR_HEALTH_BEFORE="$(state_field "$TOR_STATE_BEFORE" 5)"
          [ "$TOR_HEALTH_BEFORE" = "healthy" ] || [ "$TOR_HEALTH_BEFORE" = "none" ] || fail "Tor health is not healthy (got $TOR_HEALTH_BEFORE)"
          [ -z "$(docker port jobpulse-tor-prod 2>/dev/null || true)" ] || fail "Tor publishes host ports (expected none)"
          echo "other_services_precondition=ok"

          echo "== precondition: frontend bind mount + live f476 frontend bytes =="
          MOUNT_LINE="$(docker inspect jobpulse-frontend-prod --format '{{range .Mounts}}{{if eq .Destination "/usr/share/nginx/html"}}{{.Type}}|{{.Source}}|{{.RW}}{{end}}{{end}}')"
          [ "$MOUNT_LINE" = "bind|/opt/jobpulse/frontend|false" ] || fail "frontend html mount is '$MOUNT_LINE', expected 'bind|/opt/jobpulse/frontend|false'"
          LIVE_FRONTEND_SHA256_BEFORE="$(curl --connect-timeout 3 --max-time 5 -fsS http://127.0.0.1/ | sha256sum | awk '{print $1}')"
          [ "$LIVE_FRONTEND_SHA256_BEFORE" = "$FRONTEND_SHA256" ] || fail "live frontend SHA-256 ($LIVE_FRONTEND_SHA256_BEFORE) is not the immutable f476 frontend ($FRONTEND_SHA256)"
          echo "frontend_live_baseline=confirmed_f476"

          # ---------------------------------------------------------------
          # Scheduler provenance (bounded, read-only, non-executing).
          #
          # Copied verbatim from the already-reviewed Phase 4M version in
          # .github/workflows/production-api-reference-normalization.yml
          # (itself copied from the Phase 4J recovery runner) -- see this
          # workflow's test parity check. It proves the authoritative
          # collection cron is still exactly the canonical
          # `cd /opt/jobpulse && flock -n /tmp/jobpulse_collection_cycle.lock
          # ./scripts/run_collection_cycle_safe.sh` launcher before either
          # lock below is taken. Never modifies any scheduler source.
          # ---------------------------------------------------------------
          echo "== scheduler provenance: this account's own crontab (bounded, read-only, non-executing) =="
          command -v timeout > /dev/null 2>&1 || fail "timeout utility unavailable -- cannot bound scheduler provenance checks"
          command -v crontab > /dev/null 2>&1 || fail "crontab command unavailable -- cannot establish this account's own scheduled launcher"

          CANONICAL_LAUNCHER_LINE='*/30 * * * * cd /opt/jobpulse && flock -n /tmp/jobpulse_collection_cycle.lock ./scripts/run_collection_cycle_safe.sh'

          OWN_CRONTAB_STATUS=0
          OWN_CRONTAB_OUTPUT="$(timeout 5 crontab -l 2>&1)" || OWN_CRONTAB_STATUS=$?
          # Historical evidence (runs 34479326097 and 34679402811) proves
          # this account HAS a scheduled launcher -- an unreadable or
          # empty ("no crontab for this account") crontab is therefore
          # itself scheduler drift, never an acceptable empty state.
          if [ "$OWN_CRONTAB_STATUS" -ne 0 ]; then
            # Never echo $OWN_CRONTAB_OUTPUT -- a crontab may contain
            # unrelated sensitive commands or environment values. Report
            # only a bounded classification, never the raw content.
            OWN_CRONTAB_FAILURE_CATEGORY="read_error"
            grep -qi 'no crontab for' <<< "$OWN_CRONTAB_OUTPUT" && OWN_CRONTAB_FAILURE_CATEGORY="no_crontab"
            fail "cannot read this account's own crontab in a bounded way (exit $OWN_CRONTAB_STATUS, category=$OWN_CRONTAB_FAILURE_CATEGORY) -- historical evidence proves a scheduled launcher exists here, so this is scheduler drift, not an acceptable empty state"
          fi

          CANONICAL_MATCH_COUNT="$(grep -Fxc "$CANONICAL_LAUNCHER_LINE" <<< "$OWN_CRONTAB_OUTPUT" || true)"
          WRAPPER_MENTION_COUNT="$(grep -Fc 'run_collection_cycle_safe.sh' <<< "$OWN_CRONTAB_OUTPUT" || true)"
          OWN_ROOT_VAR_COUNT="$(grep -Fc 'JOBPULSE_COLLECTION_ROOT' <<< "$OWN_CRONTAB_OUTPUT" || true)"
          OWN_LOCK_VAR_COUNT="$(grep -Fc 'JOBPULSE_COLLECTION_CYCLE_LOCK_PATH' <<< "$OWN_CRONTAB_OUTPUT" || true)"

          [ "$CANONICAL_MATCH_COUNT" = "1" ] || fail "this account's crontab does not contain exactly one occurrence of the historically proven canonical launcher line (found $CANONICAL_MATCH_COUNT) -- refusing to proceed, scheduler may have drifted"
          [ "$WRAPPER_MENTION_COUNT" = "1" ] || fail "this account's crontab mentions run_collection_cycle_safe.sh $WRAPPER_MENTION_COUNT time(s), expected exactly 1 -- refusing to proceed"
          # Historical evidence proves the canonical launcher line itself,
          # never an environment-variable override -- any such reference
          # now would be unproven drift, not something to guess about.
          [ "$OWN_ROOT_VAR_COUNT" = "0" ] || fail "this account's crontab references JOBPULSE_COLLECTION_ROOT, which historical evidence never proved -- refusing to guess, failing closed"
          [ "$OWN_LOCK_VAR_COUNT" = "0" ] || fail "this account's crontab references JOBPULSE_COLLECTION_CYCLE_LOCK_PATH, which historical evidence never proved -- refusing to guess, failing closed"
          echo "own_crontab_provenance=confirmed_canonical_launcher"

          echo "== scheduler drift check: /etc/crontab (read-only, bounded, absence-only) =="
          if [ -e /etc/crontab ]; then
            [ -r /etc/crontab ] || fail "/etc/crontab exists but is not readable -- refusing to proceed without proven scheduler drift status"
            ETC_CRONTAB_CONTENT="$(timeout 5 cat /etc/crontab)" || fail "timed out reading /etc/crontab"
            if grep -Fq 'run_collection_cycle_safe.sh' <<< "$ETC_CRONTAB_CONTENT" \
              || grep -Fq 'JOBPULSE_COLLECTION_ROOT' <<< "$ETC_CRONTAB_CONTENT" \
              || grep -Fq 'JOBPULSE_COLLECTION_CYCLE_LOCK_PATH' <<< "$ETC_CRONTAB_CONTENT"; then
              fail "/etc/crontab now references the collection wrapper or its launcher variables -- unexpected scheduler drift from the historically proven single-launcher state (run 34679402811), refusing to proceed"
            fi
          fi
          echo "etc_crontab_drift=none"

          echo "== scheduler drift check: /etc/cron.d/* (read-only, bounded, absence-only) =="
          if [ -d /etc/cron.d ]; then
            CRON_D_FILES="$(timeout 5 find /etc/cron.d -maxdepth 1 -type f 2>&1)" || fail "could not list /etc/cron.d in a bounded way"
            while IFS= read -r cron_d_file; do
              [ -z "$cron_d_file" ] && continue
              [ -r "$cron_d_file" ] || fail "$cron_d_file exists but is not readable -- refusing to proceed without proven scheduler drift status"
              CRON_D_CONTENT="$(timeout 5 cat "$cron_d_file")" || fail "timed out reading $cron_d_file"
              if grep -Fq 'run_collection_cycle_safe.sh' <<< "$CRON_D_CONTENT" \
                || grep -Fq 'JOBPULSE_COLLECTION_ROOT' <<< "$CRON_D_CONTENT" \
                || grep -Fq 'JOBPULSE_COLLECTION_CYCLE_LOCK_PATH' <<< "$CRON_D_CONTENT"; then
                fail "$cron_d_file now references the collection wrapper or its launcher variables -- unexpected scheduler drift, refusing to proceed"
              fi
            done <<< "$CRON_D_FILES"
          fi
          echo "cron_d_drift=none"

          echo "== scheduler drift check: root crontab (bounded, non-interactive sudo, absence-only) =="
          if command -v sudo > /dev/null 2>&1 && command -v crontab > /dev/null 2>&1; then
            ROOT_CRONTAB_STATUS=0
            ROOT_CRONTAB_OUTPUT="$(timeout 5 sudo -n crontab -u root -l 2>&1)" || ROOT_CRONTAB_STATUS=$?
            if [ "$ROOT_CRONTAB_STATUS" -eq 0 ]; then
              if grep -Fq 'run_collection_cycle_safe.sh' <<< "$ROOT_CRONTAB_OUTPUT" \
                || grep -Fq 'JOBPULSE_COLLECTION_ROOT' <<< "$ROOT_CRONTAB_OUTPUT" \
                || grep -Fq 'JOBPULSE_COLLECTION_CYCLE_LOCK_PATH' <<< "$ROOT_CRONTAB_OUTPUT"; then
                fail "root's crontab now references the collection wrapper or its launcher variables -- unexpected scheduler drift, refusing to proceed"
              fi
            elif grep -qi 'no crontab for' <<< "$ROOT_CRONTAB_OUTPUT"; then
              :
            else
              # Never echo $ROOT_CRONTAB_OUTPUT -- root's crontab may
              # contain unrelated sensitive commands or environment
              # values. Report only source label and exit status.
              fail "cannot establish root's crontab configuration read-only (source=sudo -n crontab -u root -l, exit $ROOT_CRONTAB_STATUS) -- refusing to proceed without proven root-cron provenance"
            fi
          else
            fail "sudo or crontab command unavailable -- cannot establish root's crontab configuration, refusing to proceed without proven root-cron provenance"
          fi
          echo "root_crontab_drift=none"

          echo "== scheduler drift check: systemd effective unit configuration (read-only, bounded, fail-closed, absence-only) =="
          # Fail-closed: systemd state must be positively established --
          # never silently skipped -- before this runner is allowed to
          # proceed to mutation. Every enumeration/inspection step below
          # captures its exit status explicitly via a dedicated STATUS
          # variable (never a blanket fallback that would mask a
          # nonzero exit), and none print the complete raw command
          # output (bounded status code + source/action label only).
          #
          # Phase 4I (run 35846112545) proved this needs a two-level
          # model, not a single blind `systemctl show` over every name
          # `systemctl list-unit-files` returns: the live host's
          # persistent unit-file inventory includes uninstantiated
          # systemd TEMPLATE units (e.g. apport-coredump-hook@.service),
          # and `systemctl show <template>@.service` is not a reliable
          # operation for those -- it returned exit 1, which correctly
          # fail-closed this runner before any mutation, but the
          # enumeration/inspection model itself was too naive. Phase 4J
          # distinguishes, semantically (never by hardcoded unit name):
          #   - an uninstantiated template unit file (name matches
          #     *@.service exactly) -> inspect its static definition via
          #     `systemctl cat`, never `systemctl show`.
          #   - every other (ordinary, concrete) unit-file name -> as
          #     before, `systemctl show`.
          # A currently-instantiated copy of a template (e.g.
          # foo@instance.service) does not appear in the persistent
          # unit-file inventory as such, so it is caught separately below
          # via `systemctl list-units` (the loaded-unit inventory) and
          # inspected via `systemctl show` like any other loaded unit.
          command -v systemctl > /dev/null 2>&1 || fail "systemctl command unavailable -- cannot establish systemd scheduler state, refusing to proceed without proven systemd provenance"

          UNIT_LIST_STATUS=0
          UNIT_LIST_OUTPUT="$(timeout 5 systemctl list-unit-files --type=service --no-legend --no-pager --full 2>&1)" || UNIT_LIST_STATUS=$?
          [ "$UNIT_LIST_STATUS" -eq 0 ] || fail "systemctl list-unit-files failed in a bounded read (source=systemctl list-unit-files, exit $UNIT_LIST_STATUS) -- refusing to proceed without proven systemd unit enumeration"
          # `--full` so a long unit name is never ellipsized before
          # semantic template detection; `NF {print $1}` so a blank
          # record never yields an empty first field.
          UNIT_NAMES="$(awk 'NF {print $1}' <<< "$UNIT_LIST_OUTPUT")"

          while IFS= read -r unit; do
            [ -z "$unit" ] && continue
            # Defense in depth: if `systemctl list-unit-files` output
            # ever shapes differently than expected (decoration,
            # truncation, a future systemd version), refuse to guess and
            # never let a malformed token reach `systemctl show`/`cat`.
            case "$unit" in
              *.service) ;;
              *) fail "unexpected token while parsing systemctl list-unit-files output (token=$unit)" ;;
            esac
            case "$unit" in
              *@.service)
                # Uninstantiated systemd template unit -- `systemctl show`
                # against a bare template name is not a reliable
                # operation (this is the exact Phase 4I regression:
                # apport-coredump-hook@.service returned exit 1). Inspect
                # the template's static definition instead.
                TEMPLATE_CAT_STATUS=0
                TEMPLATE_CAT_OUTPUT="$(timeout 5 systemctl cat "$unit" --no-pager 2>&1)" || TEMPLATE_CAT_STATUS=$?
                [ "$TEMPLATE_CAT_STATUS" -eq 0 ] || fail "systemctl cat failed in a bounded read (source=systemctl cat, unit=$unit, exit $TEMPLATE_CAT_STATUS) -- refusing to proceed without proven template unit definition"
                [ -n "$TEMPLATE_CAT_OUTPUT" ] || fail "systemctl cat returned an unusable (empty) result for template unit $unit -- refusing to proceed without proven template unit definition"
                if grep -Fq 'run_collection_cycle_safe.sh' <<< "$TEMPLATE_CAT_OUTPUT" \
                  || grep -Fq 'JOBPULSE_COLLECTION_ROOT' <<< "$TEMPLATE_CAT_OUTPUT" \
                  || grep -Fq 'JOBPULSE_COLLECTION_CYCLE_LOCK_PATH' <<< "$TEMPLATE_CAT_OUTPUT"; then
                  fail "systemd template unit $unit definition references the collection wrapper or its launcher variables -- unexpected scheduler drift, refusing to proceed"
                fi
                ;;
              *)
                UNIT_SHOW_STATUS=0
                UNIT_SHOW_OUTPUT="$(timeout 5 systemctl show "$unit" --property=ExecStart,Environment,EnvironmentFiles,FragmentPath,DropInPaths --no-pager 2>&1)" || UNIT_SHOW_STATUS=$?
                [ "$UNIT_SHOW_STATUS" -eq 0 ] || fail "systemctl show failed in a bounded read (source=systemctl show, unit=$unit, exit $UNIT_SHOW_STATUS) -- refusing to proceed without proven effective systemd state"
                [ -n "$UNIT_SHOW_OUTPUT" ] || fail "systemctl show returned an unusable (empty) result for unit $unit -- refusing to proceed without proven effective systemd state"
                if grep -Fq 'run_collection_cycle_safe.sh' <<< "$UNIT_SHOW_OUTPUT" \
                  || grep -Fq 'JOBPULSE_COLLECTION_ROOT' <<< "$UNIT_SHOW_OUTPUT" \
                  || grep -Fq 'JOBPULSE_COLLECTION_CYCLE_LOCK_PATH' <<< "$UNIT_SHOW_OUTPUT"; then
                  fail "systemd unit $unit effective configuration references the collection wrapper or its launcher variables -- unexpected scheduler drift, refusing to proceed"
                fi
                ;;
            esac
          done <<< "$UNIT_NAMES"
          echo "systemd_unit_file_drift=none"

          echo "== scheduler drift check: systemd loaded unit inventory (systemctl list-units, catches instantiated templates) =="
          LOADED_UNIT_LIST_STATUS=0
          # `--plain` is mandatory: without it, systemctl renders a
          # leading status-circle glyph (e.g. "* broken.service ...") for
          # a failed/degraded unit, which would otherwise become a
          # pseudo-column and shift $1 away from the actual unit name.
          # `--full` prevents a long unit name from being ellipsized
          # before it is inspected.
          LOADED_UNIT_LIST_OUTPUT="$(timeout 5 systemctl list-units --type=service --all --no-legend --no-pager --plain --full 2>&1)" || LOADED_UNIT_LIST_STATUS=$?
          [ "$LOADED_UNIT_LIST_STATUS" -eq 0 ] || fail "systemctl list-units failed in a bounded read (source=systemctl list-units, exit $LOADED_UNIT_LIST_STATUS) -- refusing to proceed without proven loaded systemd unit enumeration"
          LOADED_UNIT_NAMES="$(awk 'NF {print $1}' <<< "$LOADED_UNIT_LIST_OUTPUT")"

          while IFS= read -r loaded_unit; do
            [ -z "$loaded_unit" ] && continue
            # Defense in depth: refuse to guess if a parsed record is not
            # a `*.service` name (see the identical unit-file check
            # above) -- never call `systemctl show` with an unexpected
            # token such as a stray status-circle glyph.
            case "$loaded_unit" in
              *.service) ;;
              *) fail "unexpected token while parsing systemctl list-units output (token=$loaded_unit)" ;;
            esac
            # Every loaded unit -- including an instantiated template
            # such as foo@instance.service -- is inspected the same way
            # as an ordinary concrete unit. A normal service may already
            # have been inspected once above from the unit-file
            # inventory; inspecting it again here is acceptable (simple,
            # auditable logic beats premature deduplication).
            LOADED_UNIT_SHOW_STATUS=0
            LOADED_UNIT_SHOW_OUTPUT="$(timeout 5 systemctl show "$loaded_unit" --property=ExecStart,Environment,EnvironmentFiles,FragmentPath,DropInPaths --no-pager 2>&1)" || LOADED_UNIT_SHOW_STATUS=$?
            [ "$LOADED_UNIT_SHOW_STATUS" -eq 0 ] || fail "systemctl show failed in a bounded read (source=systemctl show, unit=$loaded_unit, exit $LOADED_UNIT_SHOW_STATUS) -- refusing to proceed without proven effective systemd state"
            [ -n "$LOADED_UNIT_SHOW_OUTPUT" ] || fail "systemctl show returned an unusable (empty) result for unit $loaded_unit -- refusing to proceed without proven effective systemd state"
            if grep -Fq 'run_collection_cycle_safe.sh' <<< "$LOADED_UNIT_SHOW_OUTPUT" \
              || grep -Fq 'JOBPULSE_COLLECTION_ROOT' <<< "$LOADED_UNIT_SHOW_OUTPUT" \
              || grep -Fq 'JOBPULSE_COLLECTION_CYCLE_LOCK_PATH' <<< "$LOADED_UNIT_SHOW_OUTPUT"; then
              fail "systemd loaded unit $loaded_unit effective configuration references the collection wrapper or its launcher variables -- unexpected scheduler drift, refusing to proceed"
            fi
          done <<< "$LOADED_UNIT_NAMES"
          echo "systemd_loaded_unit_drift=none"

          echo "systemd_drift=none"

          echo "== effective internal lock path provenance: /opt/jobpulse/.collection.env (parsed as data only, never sourced/eval'd) =="
          COLLECTION_ENV_PATH="/opt/jobpulse/.collection.env"
          if [ -e "$COLLECTION_ENV_PATH" ]; then
            [ -r "$COLLECTION_ENV_PATH" ] || fail "$COLLECTION_ENV_PATH exists but is not readable -- refusing to proceed"
            COLLECTION_ENV_CONTENT="$(timeout 5 cat "$COLLECTION_ENV_PATH")" || fail "timed out reading $COLLECTION_ENV_PATH"
            LOCK_ASSIGNMENTS_FOUND=0
            while IFS= read -r line; do
              [[ "$line" =~ ^[[:space:]]*$ ]] && continue
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              if [[ "$line" =~ ^[[:space:]]*(export[[:space:]]+)?JOBPULSE_COLLECTION_CYCLE_LOCK_PATH=(.*)$ ]]; then
                RAW_VALUE="${BASH_REMATCH[2]}"
                if [[ "$RAW_VALUE" =~ ^([^\#]*[^[:space:]\#])[[:space:]]+\#.*$ ]]; then
                  RAW_VALUE="${BASH_REMATCH[1]}"
                fi
                RAW_VALUE="${RAW_VALUE%"${RAW_VALUE##*[![:space:]]}"}"
                if [[ "$RAW_VALUE" =~ ^\'(.*)\'$ ]]; then
                  LOCK_VALUE="${BASH_REMATCH[1]}"
                elif [[ "$RAW_VALUE" =~ ^\"(.*)\"$ ]]; then
                  LOCK_VALUE="${BASH_REMATCH[1]}"
                  if [[ "$LOCK_VALUE" == *'$'* ]] || [[ "$LOCK_VALUE" == *'`'* ]]; then
                    fail "$COLLECTION_ENV_PATH sets JOBPULSE_COLLECTION_CYCLE_LOCK_PATH using dynamic shell syntax -- refusing to guess, failing closed"
                  fi
                else
                  LOCK_VALUE="$RAW_VALUE"
                fi
                if [[ "$LOCK_VALUE" == *'$'* ]] || [[ "$LOCK_VALUE" == *'`'* ]]; then
                  fail "$COLLECTION_ENV_PATH sets JOBPULSE_COLLECTION_CYCLE_LOCK_PATH using dynamic shell syntax -- refusing to guess, failing closed"
                fi
                LOCK_ASSIGNMENTS_FOUND=$((LOCK_ASSIGNMENTS_FOUND + 1))
                if [ "$LOCK_ASSIGNMENTS_FOUND" -gt 1 ]; then
                  fail "$COLLECTION_ENV_PATH sets JOBPULSE_COLLECTION_CYCLE_LOCK_PATH more than once with potentially conflicting values -- refusing to guess which is authoritative, failing closed"
                fi
                if [ "$LOCK_VALUE" != "$INTERNAL_LOCK_PATH" ]; then
                  fail "$COLLECTION_ENV_PATH sets JOBPULSE_COLLECTION_CYCLE_LOCK_PATH to '$LOCK_VALUE', not the expected '$INTERNAL_LOCK_PATH' -- refusing to proceed"
                fi
              elif [[ "$line" == *"JOBPULSE_COLLECTION_CYCLE_LOCK_PATH"* ]]; then
                fail "$COLLECTION_ENV_PATH references JOBPULSE_COLLECTION_CYCLE_LOCK_PATH in a line that is not a recognizable assignment -- refusing to guess, failing closed"
              fi
            done <<< "$COLLECTION_ENV_CONTENT"
          fi
          # Absent file or absent assignment is acceptable: the wrapper's
          # own source default already resolves to INTERNAL_LOCK_PATH,
          # and run 34679402811 proved that is the live effective value.
          echo "effective_internal_lock_provenance=confirmed_or_absent_default"

          SCHEDULER_FINGERPRINT_BEFORE="$(scheduler_fingerprint)"
          [ -n "$SCHEDULER_FINGERPRINT_BEFORE" ] || fail "could not fingerprint scheduler inputs"
          echo "scheduler_fingerprint_before=$SCHEDULER_FINGERPRINT_BEFORE"

          echo "== collection scheduler safety: acquire locks non-blocking, outer then internal (held for the whole operation) =="
          # Holding both locks makes any cron/manual collection cycle that
          # fires during this deployment skip cleanly (flock -n), so the
          # API is never replaced underneath an in-flight cycle.
          exec {OUTER_LOCK_FD}>"$OUTER_LOCK_PATH" || fail "cannot open outer lock file $OUTER_LOCK_PATH"
          flock -n "$OUTER_LOCK_FD" || fail "outer collection lock busy: $OUTER_LOCK_PATH -- refusing to proceed, no mutation"
          echo "outer_lock_acquired=yes"
          exec {INTERNAL_LOCK_FD}>"$INTERNAL_LOCK_PATH" || fail "cannot open internal lock file $INTERNAL_LOCK_PATH"
          flock -n "$INTERNAL_LOCK_FD" || fail "internal collection lock busy: $INTERNAL_LOCK_PATH -- refusing to proceed, no mutation"
          echo "internal_lock_acquired=yes"

          echo "== active collector check (read-only, docker top -- never kills anything) =="
          TOP_OUTPUT="$(docker top jobpulse-api-prod)"
          ACTIVE_COLLECTOR=no
          for pattern in linkedin_auth_preflight seed_priority_coverage_queue process_search_demand_queue linkedin_plan_collect collector_postgres reconcile_priority_coverage run_collection_cycle; do
            if grep -q "$pattern" <<< "$TOP_OUTPUT"; then
              ACTIVE_COLLECTOR=yes
              echo "active_collector_pattern=$pattern"
            fi
          done
          echo "active_collector=$ACTIVE_COLLECTOR"
          [ "$ACTIVE_COLLECTOR" = "no" ] || fail "active collector process detected -- refusing to proceed, no mutation"

          echo "== incident image provenance on this host (pull BY DIGEST only, never by tag; never touches a running container) =="
          TMP_DOCKER_CONFIG="$(mktemp -d)"
          if [ "$HAS_TOKEN" = "true" ]; then
            # The GHCR token arrives on THIS script's own stdin through
            # the SSH session -- never argv, never Base64, never printed.
            DOCKER_CONFIG="$TMP_DOCKER_CONFIG" docker login ghcr.io -u mrezamaghouli --password-stdin
          fi
          DOCKER_CONFIG="$TMP_DOCKER_CONFIG" docker pull "$INCIDENT_IMAGE_DIGEST_REFERENCE"
          PULLED_IMAGE_ID="$(docker image inspect "$INCIDENT_IMAGE_DIGEST_REFERENCE" --format '{{.Id}}')"
          [ "$PULLED_IMAGE_ID" = "$EXPECTED_INCIDENT_IMAGE_ID" ] || fail "incident image resolved to ID $PULLED_IMAGE_ID, expected exactly $EXPECTED_INCIDENT_IMAGE_ID"
          [ "$PULLED_IMAGE_ID" != "$EXPECTED_F476_IMAGE_ID" ] || fail "incident image ID equals the f476 image ID"
          PULLED_IMAGE_LABELS="$(docker image inspect "$INCIDENT_IMAGE_DIGEST_REFERENCE" --format "$IMAGE_LABELS_FORMAT")"
          [ "$PULLED_IMAGE_LABELS" = "$TARGET_SOURCE_SHA|$EXPECTED_PRODUCTION_GIT_SHA|$INCIDENT_PURPOSE_LABEL|$INCIDENT_BUILD_RUN_ID" ] || fail "incident image labels are '$PULLED_IMAGE_LABELS', expected revision/parent/build-run-id '$TARGET_SOURCE_SHA|$EXPECTED_PRODUCTION_GIT_SHA|$INCIDENT_PURPOSE_LABEL|$INCIDENT_BUILD_RUN_ID'"
          echo "incident_image_provenance=confirmed id=$PULLED_IMAGE_ID manifest=$INCIDENT_IMAGE_AMD64_MANIFEST_DIGEST config=$INCIDENT_IMAGE_CONFIG_DIGEST"

          echo "== f476 rollback artifact preparation (pull BY DIGEST only; the runner already verified its GHCR chain; does NOT authorize mutation) =="
          # The running API may survive only on its containerd snapshot with
          # no local f476 image object (proven on production 2026-10-02), so
          # the rollback artifact is (re)materialized here from its immutable
          # digest. Pulling an already-present digest is a no-op.
          F476_LOCAL_ID_BEFORE_PULL="$(docker image inspect "$F476_IMAGE_DIGEST_REFERENCE" --format '{{.Id}}' 2>/dev/null || true)"
          echo "f476_rollback_artifact_locally_present_before_pull=$([ "$F476_LOCAL_ID_BEFORE_PULL" = "$EXPECTED_F476_IMAGE_ID" ] && echo yes || echo no)"
          DOCKER_CONFIG="$TMP_DOCKER_CONFIG" docker pull "$F476_IMAGE_DIGEST_REFERENCE" || fail "could not pull the f476 rollback artifact $F476_IMAGE_DIGEST_REFERENCE -- rollback cannot be prepared, no mutation"
          F476_PULLED_ID="$(docker image inspect "$F476_IMAGE_DIGEST_REFERENCE" --format '{{.Id}}' 2>/dev/null || true)"
          [ "$F476_PULLED_ID" = "$EXPECTED_F476_IMAGE_ID" ] || fail "f476 rollback artifact resolved to ID '${F476_PULLED_ID:-<absent>}', expected exactly $EXPECTED_F476_IMAGE_ID -- no mutation"
          F476_PULLED_PLATFORM="$(docker image inspect "$F476_IMAGE_DIGEST_REFERENCE" --format '{{.Os}}/{{.Architecture}}' 2>/dev/null || true)"
          [ "$F476_PULLED_PLATFORM" = "linux/amd64" ] || fail "f476 rollback artifact platform is '$F476_PULLED_PLATFORM', expected linux/amd64 -- no mutation"
          [ "$F476_PULLED_ID" = "$API_IMAGE_ID_BEFORE" ] || fail "f476 rollback artifact ID differs from the running API's image ID -- no mutation"
          echo "f476_rollback_artifact=confirmed id=$F476_PULLED_ID manifest=$EXPECTED_F476_AMD64_MANIFEST_DIGEST config=$EXPECTED_F476_CONFIG_DIGEST"

          prove_deploy_inputs

          echo "== final pre-mutation revalidation (narrows the preflight-to-mutation race window) =="
          REVALIDATE_SHA="$(git rev-parse HEAD)"
          [ "$REVALIDATE_SHA" = "$EXPECTED_PRODUCTION_GIT_SHA" ] || fail "production git SHA drifted before mutation"
          REVALIDATE_API_STATE="$(container_state jobpulse-api-prod)"
          [ "$REVALIDATE_API_STATE" = "$API_STATE_BEFORE" ] || fail "API container identity/state drifted before mutation"
          REVALIDATE_DB_STATE="$(container_state jobpulse-postgres-prod)"
          [ "$REVALIDATE_DB_STATE" = "$DB_STATE_BEFORE" ] || fail "DB container identity/state drifted before mutation"
          REVALIDATE_FRONTEND_STATE="$(container_state jobpulse-frontend-prod)"
          [ "$REVALIDATE_FRONTEND_STATE" = "$FRONTEND_STATE_BEFORE" ] || fail "frontend container identity/state drifted before mutation"
          REVALIDATE_TOR_STATE="$(container_state jobpulse-tor-prod)"
          [ "$REVALIDATE_TOR_STATE" = "$TOR_STATE_BEFORE" ] || fail "Tor container identity/state drifted before mutation"
          REVALIDATE_COMPOSE_SHA256="$(sha256sum "$COMPOSE_FILE" | awk '{print $1}')"
          [ "$REVALIDATE_COMPOSE_SHA256" = "$COMPOSE_SHA256" ] || fail "compose file drifted before mutation"
          REVALIDATE_SEARCH_TRANSPORT="$(docker exec jobpulse-api-prod printenv SEARCH_TRANSPORT 2>/dev/null || echo UNSET)"
          if [ "$REVALIDATE_SEARCH_TRANSPORT" != "UNSET" ] && [ "$REVALIDATE_SEARCH_TRANSPORT" != "direct" ]; then
            fail "SEARCH_TRANSPORT drifted before mutation"
          fi
          REVALIDATE_TOR_ENABLED="$(docker exec jobpulse-api-prod printenv TOR_ENABLED 2>/dev/null || echo UNSET)"
          [ "$REVALIDATE_TOR_ENABLED" = "false" ] || fail "TOR_ENABLED drifted before mutation"
          REVALIDATE_SCHEDULER_FINGERPRINT="$(scheduler_fingerprint)"
          [ "$REVALIDATE_SCHEDULER_FINGERPRINT" = "$SCHEDULER_FINGERPRINT_BEFORE" ] || fail "scheduler inputs drifted before mutation"
          echo "final_pre_mutation_revalidation=ok"

          echo "== final pre-mutation revalidation: full deploy-inputs proof re-run fresh, immediately before mutation =="
          prove_deploy_inputs
          echo "final_deploy_inputs_revalidation=ok"

          echo "== rollback preparation (BEFORE mutation): prove the f476 API runtime is restorable from its immutable digest =="
          # Rollback restores by IMMUTABLE identity: the f476 digest
          # reference (pulled and verified above) must still resolve locally
          # to exactly the f476 image ID, and the final-gate rollback
          # Compose/env snapshots must exist. Re-proven here, immediately
          # before mutation. The historical alias is never consulted.
          ROLLBACK_F476_LOCAL_ID="$(docker image inspect "$F476_IMAGE_DIGEST_REFERENCE" --format '{{.Id}}' 2>/dev/null || true)"
          [ "$ROLLBACK_F476_LOCAL_ID" = "$EXPECTED_F476_IMAGE_ID" ] || fail "f476 rollback artifact $F476_IMAGE_DIGEST_REFERENCE is not locally present as $EXPECTED_F476_IMAGE_ID -- rollback cannot be prepared"
          [ -n "$FINAL_EFFECTIVE_ROLLBACK_CONFIG_SHA256" ] && [ -n "$FINAL_EXPECTED_CURRENT_ENV_SHA256" ] || fail "final-gate rollback snapshots are missing -- rollback cannot be prepared"
          ROLLBACK_PREPARED=true
          echo "rollback_prepared=yes source=$F476_IMAGE_DIGEST_REFERENCE image=$EXPECTED_F476_IMAGE_ID (pre-deployment Config.Image $API_CONFIG_IMAGE_BEFORE is observational only)"

          echo "== ONLY AUTHORIZED PRODUCTION MUTATION: recreate api ONLY from the immutable incident image (by digest) =="
          API_MUTATION_STARTED=true
          JOBPULSE_API_IMAGE="$INCIDENT_IMAGE_DIGEST_REFERENCE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" up -d --no-build --no-deps --force-recreate api

          wait_for_api_convergence "$INCIDENT_IMAGE_DIGEST_REFERENCE" "$EXPECTED_INCIDENT_IMAGE_ID" || exit 1

          echo "== post-deploy: new API container identity and stability =="
          API_STATE_AFTER="$(container_state jobpulse-api-prod)"
          echo "api_state_after=$API_STATE_AFTER"
          [ "$(state_field "$API_STATE_AFTER" 1)" != "$API_ID_BEFORE" ] || fail "API container ID unchanged after --force-recreate -- recreation did not occur"
          verify_api_stability "$EXPECTED_INCIDENT_IMAGE_ID" || exit 1

          echo "== post-deploy: running image identity/config corresponds to the incident artifact =="
          RUNNING_LABELS="$(docker inspect jobpulse-api-prod --format "$IMAGE_LABELS_FORMAT")"
          [ "$RUNNING_LABELS" = "$TARGET_SOURCE_SHA|$EXPECTED_PRODUCTION_GIT_SHA|$INCIDENT_PURPOSE_LABEL|$INCIDENT_BUILD_RUN_ID" ] || fail "running API labels are '$RUNNING_LABELS', expected the incident artifact's revision/parent/build-run-id"
          COLLECTOR_SHA_AFTER="$(in_container_collector_sha256)" || fail "cannot read the in-container collector hash after deployment"
          [ "$COLLECTOR_SHA_AFTER" = "$INCIDENT_COLLECTOR_SHA256" ] || fail "running API collector_postgres.py SHA-256 ($COLLECTOR_SHA_AFTER) is not the 259c507 version ($INCIDENT_COLLECTOR_SHA256)"
          echo "in_container_collector=259c507"
          PROVIDER_SHA_AFTER="$(in_container_provider_sha256)" || fail "cannot read the in-container provider hash after deployment"
          [ "$PROVIDER_SHA_AFTER" = "$F476_PROVIDER_SHA256" ] || fail "running API linkedin_browser_provider.py SHA-256 ($PROVIDER_SHA_AFTER) is not the f476 version -- Phase 4B code must not be deployed"
          echo "in_container_provider=f476_no_phase4b"

          echo "== post-deploy: API service behavior (health JSON, transport mode, environment) =="
          health_json_ok http://127.0.0.1:8000/health || fail "post-deploy direct health check failed"
          health_json_ok http://127.0.0.1/api/health || fail "post-deploy nginx-proxied health check failed"
          TRANSPORT_MODE_AFTER="$(docker exec jobpulse-api-prod python -c 'from app.config import get_search_transport_mode; print(get_search_transport_mode())')"
          [ "$TRANSPORT_MODE_AFTER" = "direct" ] || fail "post-deploy get_search_transport_mode() is '$TRANSPORT_MODE_AFTER', expected 'direct'"
          TOR_ENABLED_AFTER="$(docker exec jobpulse-api-prod printenv TOR_ENABLED 2>/dev/null || echo UNSET)"
          [ "$TOR_ENABLED_AFTER" = "false" ] || fail "post-deploy TOR_ENABLED is '$TOR_ENABLED_AFTER', expected 'false'"
          RUNTIME_ENV_AFTER="$(docker inspect jobpulse-api-prod --format '{{json .Config.Env}}')" || fail "cannot read post-deploy API environment"
          INCIDENT_ENV_JSON_AFTER="$(decode_image_env "$INCIDENT_IMAGE_ENV_JSON_B64")" || fail "cannot decode the digest-verified incident image Env"
          render_compose_json "$INCIDENT_IMAGE_DIGEST_REFERENCE" || exit 1
          compute_env_parity_hashes "$RENDERED_COMPOSE_JSON" "$INCIDENT_ENV_JSON_AFTER" "$RUNTIME_ENV_AFTER" || exit 1
          [ "$ACTUAL_RUNTIME_ENV_SHA256" = "$EXPECTED_CANDIDATE_ENV_SHA256" ] || fail "post-deploy API environment is not exactly the proven expected environment (incident image defaults overlaid by the unchanged Compose environment)"
          echo "post_deploy_env_parity=confirmed"

          echo "== post-deploy: db/frontend/tor, frontend bytes, git, scheduler unchanged =="
          verify_other_services_unchanged || exit 1
          LIVE_FRONTEND_SHA256_AFTER="$(curl --connect-timeout 3 --max-time 5 -fsS http://127.0.0.1/ | sha256sum | awk '{print $1}')"
          [ "$LIVE_FRONTEND_SHA256_AFTER" = "$FRONTEND_SHA256" ] || fail "live frontend SHA-256 changed after API recreation"
          verify_git_unchanged || exit 1
          SCHEDULER_FINGERPRINT_AFTER="$(scheduler_fingerprint)"
          [ "$SCHEDULER_FINGERPRINT_AFTER" = "$SCHEDULER_FINGERPRINT_BEFORE" ] || fail "scheduler inputs changed during deployment"
          echo "scheduler_unchanged=confirmed"

          echo "===INCIDENT_259C507_API_DEPLOY_END==="
          echo "collection_cycle_run=no (deployment does not authorize a collection run)"
          echo "phase4m_action=none"
          echo "INCIDENT_259C507_API_DEPLOYED"
          DEPLOY_CONFIRMED=true
          WORKFLOW_SUCCESS=true
          REMOTE_SCRIPT

          cleanup_runner() {
            rm -f ~/.ssh/jobpulse_incident_deploy_key "$REMOTE_SCRIPT_LOCAL"
          }
          trap cleanup_runner EXIT

          REMOTE_SCRIPT_PATH="/tmp/jobpulse-incident-259c507-deploy-remote-${RUN_ID}.sh"

          # Only this one temporary script is transferred -- never .env,
          # .api_keys.env, .admin.env, .auth, cookies, the ControlPort
          # password file, or database credentials.
          scp "${SSH_OPTS[@]}" -i "$SSH_KEY_PATH" -P "$VM_PORT" \
            "$REMOTE_SCRIPT_LOCAL" "$VM_USER@$VM_HOST:${REMOTE_SCRIPT_PATH}"

          HAS_TOKEN="false"
          if [ -n "${GHCR_TOKEN:-}" ]; then
            HAS_TOKEN="true"
          fi

          # The GHCR token (if any) travels ONLY through this ssh
          # invocation's stdin into `docker login --password-stdin` with an
          # isolated temporary DOCKER_CONFIG -- never argv, never Base64,
          # never logged, never persisted in ~/.docker/config.json.
          printf '%s' "${GHCR_TOKEN:-}" | ssh "${SSH_OPTS[@]}" -i "$SSH_KEY_PATH" -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            "bash '$REMOTE_SCRIPT_PATH' '$COMPOSE_SHA256' '$FRONTEND_SHA256' '$F476_COLLECTOR_SHA256' '$INCIDENT_COLLECTOR_SHA256' '$F476_PROVIDER_SHA256' '$F476_IMAGE_ENV_JSON_B64' '$INCIDENT_IMAGE_ENV_JSON_B64' '$HAS_TOKEN'"
