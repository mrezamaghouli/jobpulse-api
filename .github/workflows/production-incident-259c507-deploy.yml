          ENV_PARITY_PY_SOURCE="$(cat <<'ENV_PARITY_PY'
          import json
          import sys
          import hashlib

          MAX_RECORD_BYTES = 16 * 1024 * 1024


          def read_record(stream):
              length_field = b""
              while True:
                  ch = stream.read(1)
                  if not ch:
                      raise ValueError("unexpected EOF while reading a record length")
                  if ch == b"\n":
                      break
                  if not ch.isdigit():
                      raise ValueError("malformed record length")
                  length_field += ch
                  if len(length_field) > 10:
                      raise ValueError("record length field too long")
              if not length_field:
                  raise ValueError("empty record length")
              length = int(length_field.decode("ascii"))
              if length > MAX_RECORD_BYTES:
                  raise ValueError("record length out of bounds")
              payload = stream.read(length)
              if len(payload) != length:
                  raise ValueError("unexpected EOF while reading a record payload")
              return payload


          def stringify(value, ctx):
              if value is None:
                  raise ValueError(f"{ctx}: ambiguous null value")
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, (str, int, float)):
                  return str(value)
              raise ValueError(f"{ctx}: unexpected type {type(value).__name__}")


          def parse_kv_list(entries, ctx):
              result = {}
              for entry in entries:
                  if not isinstance(entry, str) or "=" not in entry:
                      raise ValueError(f"{ctx}: malformed entry")
                  key, _, value = entry.partition("=")
                  if not key:
                      raise ValueError(f"{ctx}: malformed entry (empty key)")
                  if key in result:
                      raise ValueError(f"{ctx}: duplicate key {key}")
                  result[key] = value
              return result


          def canonical_hash(env_map):
              canonical = json.dumps(env_map, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()


          try:
              stdin = sys.stdin.buffer

              compose_bytes = read_record(stdin)
              image_env_bytes = read_record(stdin)
              runtime_env_bytes = read_record(stdin)

              compose_config = json.loads(compose_bytes.decode("utf-8"))
              services = compose_config.get("services")
              if not isinstance(services, dict):
                  raise ValueError("effective config: 'services' missing or not an object")
              api = services.get("api")
              if not isinstance(api, dict):
                  raise ValueError("effective config: 'api' service missing or not an object")
              environment = api.get("environment")
              if not isinstance(environment, dict):
                  raise ValueError("effective config: api 'environment' missing or not an object")
              compose_env = {
                  key: stringify(value, f"effective environment key {key}")
                  for key, value in environment.items()
              }

              image_env_list = json.loads(image_env_bytes.decode("utf-8"))
              if not isinstance(image_env_list, list):
                  raise ValueError("image default Env is not a list")
              image_env = parse_kv_list(image_env_list, "image default Env")

              runtime_env_list = json.loads(runtime_env_bytes.decode("utf-8"))
              if not isinstance(runtime_env_list, list):
                  raise ValueError("running container Env is not a list")
              runtime_env = parse_kv_list(runtime_env_list, "running container Env")

              expected_env = dict(image_env)
              expected_env.update(compose_env)

              print(f"EXPECTED_RUNTIME_ENV_SHA256={canonical_hash(expected_env)}")
              print(f"ACTUAL_RUNTIME_ENV_SHA256={canonical_hash(runtime_env)}")
              print(f"EXPECTED_ENV_KEY_COUNT={len(expected_env)}")
              print(f"ACTUAL_ENV_KEY_COUNT={len(runtime_env)}")
          except Exception as exc:
              print(f"ENV_PARITY_ERROR: {exc}", file=sys.stderr)
              sys.exit(1)
          ENV_PARITY_PY
          )"

          # compute_env_parity_hashes <compose-json> <image-env-json>
          # <runtime-env-json> -- sets EXPECTED_RUNTIME_ENV_SHA256,
          # ACTUAL_RUNTIME_ENV_SHA256, EXPECTED_ENV_KEY_COUNT,
          # ACTUAL_ENV_KEY_COUNT. `set +e` plus `exit "${PIPESTATUS[1]}"`
          # makes python3's own status decisive.
          compute_env_parity_hashes() {
            local compose_json="$1" image_env_json="$2" runtime_env_json="$3"
            local py_output py_status
            if py_output="$(
              set +e
              { emit_env_parity_frame "$compose_json"; emit_env_parity_frame "$image_env_json"; emit_env_parity_frame "$runtime_env_json"; } \
                | python3 -c "$ENV_PARITY_PY_SOURCE" 2>&1
              exit "${PIPESTATUS[1]}"
            )"; then
              py_status=0
            else
              py_status=$?
            fi
            if [ "$py_status" -ne 0 ]; then
              echo "FATAL: semantic environment comparison failed: $py_output" >&2
              return 1
            fi
            EXPECTED_RUNTIME_ENV_SHA256=""
            ACTUAL_RUNTIME_ENV_SHA256=""
            EXPECTED_ENV_KEY_COUNT=""
            ACTUAL_ENV_KEY_COUNT=""
            while IFS='=' read -r env_parity_key env_parity_value; do
              case "$env_parity_key" in
                EXPECTED_RUNTIME_ENV_SHA256) EXPECTED_RUNTIME_ENV_SHA256="$env_parity_value" ;;
                ACTUAL_RUNTIME_ENV_SHA256) ACTUAL_RUNTIME_ENV_SHA256="$env_parity_value" ;;
                EXPECTED_ENV_KEY_COUNT) EXPECTED_ENV_KEY_COUNT="$env_parity_value" ;;
                ACTUAL_ENV_KEY_COUNT) ACTUAL_ENV_KEY_COUNT="$env_parity_value" ;;
              esac
            done <<< "$py_output"
            [ -n "$EXPECTED_RUNTIME_ENV_SHA256" ] && [ -n "$ACTUAL_RUNTIME_ENV_SHA256" ] || {
              echo "FATAL: semantic environment comparison produced no hashes" >&2
              return 1
            }
            return 0
          }

          # render_compose_json <api-image-reference> -- renders the
          # effective Compose config as JSON (never a YAML-value parser
          # fallback) into RENDERED_COMPOSE_JSON. Read-only.
          render_compose_json() {
            local ref="$1" rendered
            rendered="$(JOBPULSE_API_IMAGE="$ref" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config --format json)" || {
              echo "FATAL: docker compose config --format json failed -- failing closed, never falling back to an unsafe YAML-value parser" >&2
              return 1
            }
            RENDERED_COMPOSE_JSON="$rendered"
            return 0
          }

          decode_image_env() {
            printf '%s' "$1" | base64 -d
          }

          # ---------------------------------------------------------------
          # prove_deploy_inputs: the full pre-mutation proof that the ONLY
          # difference between the current API and the candidate is the
          # immutable image. Called once as preflight and again
          # immediately before the mutation marker (both AFTER the locks
          # are held). Never mutates anything; any violation calls fail().
          # ---------------------------------------------------------------
          prove_deploy_inputs() {
            echo "== effective compose configs (read-only render): CURRENT (pre-deploy reference) + CANDIDATE (incident digest reference) =="
            EFFECTIVE_CURRENT_CONFIG="$(JOBPULSE_API_IMAGE="$API_CONFIG_IMAGE_BEFORE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config)" || fail "failed to render effective CURRENT Compose config -- failing closed before mutation"
            EFFECTIVE_CANDIDATE_CONFIG="$(JOBPULSE_API_IMAGE="$INCIDENT_IMAGE_DIGEST_REFERENCE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config)" || fail "failed to render effective CANDIDATE Compose config -- failing closed before mutation"

            local current_block_count candidate_block_count
            current_block_count="$(grep -c '^  api:' <<< "$EFFECTIVE_CURRENT_CONFIG" || true)"
            candidate_block_count="$(grep -c '^  api:' <<< "$EFFECTIVE_CANDIDATE_CONFIG" || true)"
            [ "$current_block_count" = "1" ] || fail "effective current Compose config does not have exactly one api service block (found $current_block_count)"
            [ "$candidate_block_count" = "1" ] || fail "effective candidate Compose config does not have exactly one api service block (found $candidate_block_count)"

            local current_api_block candidate_api_block
            current_api_block="$(printf '%s\n' "$EFFECTIVE_CURRENT_CONFIG" | awk '
              /^  api:/ { in_api=1; next }
              in_api && /^  [A-Za-z0-9_.-]+:/ { in_api=0 }
              in_api { print }
            ')"
            candidate_api_block="$(printf '%s\n' "$EFFECTIVE_CANDIDATE_CONFIG" | awk '
              /^  api:/ { in_api=1; next }
              in_api && /^  [A-Za-z0-9_.-]+:/ { in_api=0 }
              in_api { print }
            ')"

            local current_image_lines candidate_image_lines
            current_image_lines="$(grep -c '^[[:space:]]*image:[[:space:]]*' <<< "$current_api_block" || true)"
            candidate_image_lines="$(grep -c '^[[:space:]]*image:[[:space:]]*' <<< "$candidate_api_block" || true)"
            [ "$current_image_lines" = "1" ] || fail "effective current Compose api block does not have exactly one image: line (found $current_image_lines)"
            [ "$candidate_image_lines" = "1" ] || fail "effective candidate Compose api block does not have exactly one image: line (found $candidate_image_lines)"

            local current_image candidate_image
            current_image="$(printf '%s\n' "$current_api_block" | sed -n 's/^[[:space:]]*image:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            candidate_image="$(printf '%s\n' "$candidate_api_block" | sed -n 's/^[[:space:]]*image:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            [ "$current_image" = "$API_CONFIG_IMAGE_BEFORE" ] || fail "effective current Compose image is '$current_image', expected exactly the pre-deploy reference '$API_CONFIG_IMAGE_BEFORE'"
            [ "$candidate_image" = "$INCIDENT_IMAGE_DIGEST_REFERENCE" ] || fail "effective candidate Compose image is '$candidate_image', expected exactly '$INCIDENT_IMAGE_DIGEST_REFERENCE'"
            echo "effective_candidate_api_image=$candidate_image"

            local current_env_block candidate_env_block
            current_env_block="$(printf '%s\n' "$current_api_block" | awk '
              /^    environment:/ { in_env=1; next }
              in_env && /^    [A-Za-z0-9_.-]+:/ { in_env=0 }
              in_env { print }
            ')"
            candidate_env_block="$(printf '%s\n' "$candidate_api_block" | awk '
              /^    environment:/ { in_env=1; next }
              in_env && /^    [A-Za-z0-9_.-]+:/ { in_env=0 }
              in_env { print }
            ')"

            echo "== effective CURRENT/CANDIDATE compose config: SEARCH_TRANSPORT and TOR_ENABLED (both sides; rollback recreates from CURRENT) =="
            local current_st candidate_st current_te candidate_te
            current_st="$(printf '%s\n' "$current_env_block" | sed -n 's/^[[:space:]]*SEARCH_TRANSPORT:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            candidate_st="$(printf '%s\n' "$candidate_env_block" | sed -n 's/^[[:space:]]*SEARCH_TRANSPORT:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            current_te="$(printf '%s\n' "$current_env_block" | sed -n 's/^[[:space:]]*TOR_ENABLED:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            candidate_te="$(printf '%s\n' "$candidate_env_block" | sed -n 's/^[[:space:]]*TOR_ENABLED:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            if [ -n "$current_st" ] && [ "$current_st" != "direct" ]; then
              fail "effective current Compose SEARCH_TRANSPORT is not unset/direct (got '$current_st')"
            fi
            if [ -n "$candidate_st" ] && [ "$candidate_st" != "direct" ]; then
              fail "effective candidate Compose SEARCH_TRANSPORT is not unset/direct (got '$candidate_st')"
            fi
            [ "$current_te" = "false" ] || fail "effective current Compose TOR_ENABLED is not exactly 'false' (got '${current_te:-<unset>}')"
            [ "$candidate_te" = "false" ] || fail "effective candidate Compose TOR_ENABLED is not exactly 'false' (got '${candidate_te:-<unset>}')"
            echo "effective_search_transport=${candidate_st:-<unset>}"
            echo "effective_tor_enabled=$candidate_te"

            echo "== image-reference-only Compose parity: CURRENT and CANDIDATE must differ ONLY in the api image reference =="
            normalize_config_image() {
              awk '
                /^  api:/ { in_api=1; print; next }
                in_api && /^  [A-Za-z0-9_.-]+:/ { in_api=0 }
                in_api && /^[[:space:]]*image:[[:space:]]*/ { sub(/image:.*/, "image: __JOBPULSE_API_REFERENCE__"); print; next }
                { print }
              '
            }
            local current_norm_sha candidate_norm_sha
            current_norm_sha="$(printf '%s\n' "$EFFECTIVE_CURRENT_CONFIG" | normalize_config_image | sha256sum | awk '{print $1}')"
            candidate_norm_sha="$(printf '%s\n' "$EFFECTIVE_CANDIDATE_CONFIG" | normalize_config_image | sha256sum | awk '{print $1}')"
            [ "$current_norm_sha" = "$candidate_norm_sha" ] || fail "effective current/candidate Compose configs differ beyond the api image reference (normalized SHA-256 mismatch) -- never printing the full configs"
            echo "effective_config_parity=confirmed_image_reference_only"

            echo "== ROLLBACK compose config (f476 digest reference) must also differ from CURRENT ONLY in the api image reference =="
            EFFECTIVE_ROLLBACK_CONFIG="$(JOBPULSE_API_IMAGE="$F476_IMAGE_DIGEST_REFERENCE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config)" || fail "failed to render effective ROLLBACK Compose config -- failing closed before mutation"
            local rollback_block_count rb_cfg_api_block rollback_image_lines rollback_image rollback_norm_sha
            rollback_block_count="$(grep -c '^  api:' <<< "$EFFECTIVE_ROLLBACK_CONFIG" || true)"
            [ "$rollback_block_count" = "1" ] || fail "effective rollback Compose config does not have exactly one api service block (found $rollback_block_count)"
            rb_cfg_api_block="$(printf '%s\n' "$EFFECTIVE_ROLLBACK_CONFIG" | awk '
              /^  api:/ { in_api=1; next }
              in_api && /^  [A-Za-z0-9_.-]+:/ { in_api=0 }
              in_api { print }
            ')"
            rollback_image_lines="$(grep -c '^[[:space:]]*image:[[:space:]]*' <<< "$rb_cfg_api_block" || true)"
            [ "$rollback_image_lines" = "1" ] || fail "effective rollback Compose api block does not have exactly one image: line (found $rollback_image_lines)"
            rollback_image="$(printf '%s\n' "$rb_cfg_api_block" | sed -n 's/^[[:space:]]*image:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            [ "$rollback_image" = "$F476_IMAGE_DIGEST_REFERENCE" ] || fail "effective rollback Compose image is '$rollback_image', expected exactly '$F476_IMAGE_DIGEST_REFERENCE'"
            rollback_norm_sha="$(printf '%s\n' "$EFFECTIVE_ROLLBACK_CONFIG" | normalize_config_image | sha256sum | awk '{print $1}')"
            [ "$rollback_norm_sha" = "$current_norm_sha" ] || fail "effective rollback Compose config differs from CURRENT beyond the api image reference -- never printing the full configs"
            echo "effective_rollback_config_parity=confirmed_image_reference_only"

            echo "== base compose service set (Tor is a separate overlay, proven independently) =="
            local base_services
            base_services="$(docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config --services)" || fail "failed to enumerate base Compose service set"
            [ "$(printf '%s\n' "$base_services" | sort)" = "$(printf 'api\ndb\nfrontend\n' | sort)" ] || fail "base Compose service set is not exactly api/db/frontend"
            echo "base_service_set=confirmed_api_db_frontend"

            echo "== runtime environment == f476 image defaults overlaid by effective CURRENT Compose environment (never prints values) =="
            command -v python3 > /dev/null 2>&1 || fail "python3 unavailable -- cannot prove runtime environment equivalence"
            local f476_env_json incident_env_json runtime_env_json current_json candidate_json
            f476_env_json="$(decode_image_env "$F476_IMAGE_ENV_JSON_B64")" || fail "cannot decode the digest-verified f476 image Env"
            incident_env_json="$(decode_image_env "$INCIDENT_IMAGE_ENV_JSON_B64")" || fail "cannot decode the digest-verified incident image Env"
            render_compose_json "$API_CONFIG_IMAGE_BEFORE" || exit 1
            current_json="$RENDERED_COMPOSE_JSON"
            render_compose_json "$INCIDENT_IMAGE_DIGEST_REFERENCE" || exit 1
            candidate_json="$RENDERED_COMPOSE_JSON"
            local rollback_json
            render_compose_json "$F476_IMAGE_DIGEST_REFERENCE" || exit 1
            rollback_json="$RENDERED_COMPOSE_JSON"
            runtime_env_json="$(docker inspect jobpulse-api-prod --format '{{json .Config.Env}}')" || fail "failed to read the running API container's environment"

            compute_env_parity_hashes "$current_json" "$f476_env_json" "$runtime_env_json" || exit 1
            echo "expected_current_env_key_count=$EXPECTED_ENV_KEY_COUNT"
            echo "actual_current_env_key_count=$ACTUAL_ENV_KEY_COUNT"
            if [ "$EXPECTED_RUNTIME_ENV_SHA256" != "$ACTUAL_RUNTIME_ENV_SHA256" ] || [ "$EXPECTED_ENV_KEY_COUNT" != "$ACTUAL_ENV_KEY_COUNT" ]; then
              fail "running API environment does not match the effective CURRENT Compose environment over the f476 image defaults (expected_sha256=$EXPECTED_RUNTIME_ENV_SHA256 actual_sha256=$ACTUAL_RUNTIME_ENV_SHA256) -- recreation would silently change runtime configuration"
            fi
            echo "runtime_env_parity=confirmed"
            local proven_current_env_sha="$EXPECTED_RUNTIME_ENV_SHA256"

            # Rollback from the f476 digest reference must reproduce EXACTLY
            # the proven pre-deployment environment.
            compute_env_parity_hashes "$rollback_json" "$f476_env_json" "[]" || exit 1
            [ "$EXPECTED_RUNTIME_ENV_SHA256" = "$proven_current_env_sha" ] || fail "a rollback from the f476 digest reference would not reproduce the pre-deployment environment exactly"
            echo "rollback_env_parity=confirmed"

            # The exact environment the candidate container must end up
            # with: incident image defaults overlaid by the (proven
            # identical) Compose environment. Compared after deployment.
            compute_env_parity_hashes "$candidate_json" "$incident_env_json" "[]" || exit 1
            local proven_candidate_env_sha="$EXPECTED_RUNTIME_ENV_SHA256"
            echo "expected_candidate_env_key_count=$EXPECTED_ENV_KEY_COUNT"

            # Final-gate snapshots: the second (last) call before mutation
            # overwrites the preflight values; rollback_api() refuses to
            # recreate if its own fresh re-render no longer matches.
            FINAL_EXPECTED_CURRENT_ENV_SHA256="$proven_current_env_sha"
            EXPECTED_CANDIDATE_ENV_SHA256="$proven_candidate_env_sha"
            FINAL_EFFECTIVE_CURRENT_CONFIG_SHA256="$(printf '%s\n' "$EFFECTIVE_CURRENT_CONFIG" | sha256sum | awk '{print $1}')"
            FINAL_EFFECTIVE_ROLLBACK_CONFIG_SHA256="$(printf '%s\n' "$EFFECTIVE_ROLLBACK_CONFIG" | sha256sum | awk '{print $1}')"
            echo "deploy_inputs_proof=confirmed"
          }

          # ---------------------------------------------------------------
          # Bounded convergence (Phase 4L pattern): every attempt
          # re-evaluates ALL conditions together -- direct + nginx health
          # JSON (status ok, database connected), running, Docker health
          # "healthy", and the exact expected image ID -- tolerating
          # "starting" until the bound. Two independent bounds: an
          # attempt ceiling AND a wall-clock deadline checked before every
          # iteration; every command inside carries its own tight timeout.
          # Then requires the exact expected Config.Image and re-proves
          # direct/no-Tor via narrow env inspection.
          # ---------------------------------------------------------------
          wait_for_api_convergence() {
            local expected_config_image="$1" expected_image_id="$2"
            local direct_ok=false nginx_ok=false running=unknown health=unknown image_id=unknown
            local converged=false state_line attempt
            local deadline=$((SECONDS + 120))
            for attempt in $(seq 1 40); do
              if [ "$SECONDS" -ge "$deadline" ]; then
                break
              fi
              direct_ok=false
              health_json_ok http://127.0.0.1:8000/health && direct_ok=true
              nginx_ok=false
              health_json_ok http://127.0.0.1/api/health && nginx_ok=true

              state_line="$(timeout 3 docker inspect -f "$CONTAINER_STATE_FORMAT" jobpulse-api-prod 2>/dev/null)" || state_line=""
              if [ -n "$state_line" ]; then
                image_id="$(state_field "$state_line" 2)"
                running="$(state_field "$state_line" 4)"
                health="$(state_field "$state_line" 5)"
              else
                running=unknown
                health=unknown
                image_id=unknown
              fi

              if [ "$direct_ok" = "true" ] && [ "$nginx_ok" = "true" ] && [ "$running" = "true" ] && [ "$health" = "healthy" ] && [ "$image_id" = "$expected_image_id" ]; then
                converged=true
                break
              fi
              sleep 3
            done

            echo "CONVERGENCE: last observed state running=$running health=$health imageId=$image_id directHealth=$direct_ok nginxHealth=$nginx_ok" >&2
            if [ "$converged" != "true" ]; then
              echo "FATAL: API did not converge on expected running/healthy/image-id/health-endpoint state within the bounded window" >&2
              return 1
            fi

            local cur_state cur_config_image cur_search_transport cur_tor_enabled
            cur_state="$(container_state jobpulse-api-prod)" || return 1
            cur_config_image="$(state_field "$cur_state" 7)"
            if [ "$cur_config_image" != "$expected_config_image" ]; then
              echo "FATAL: API Config.Image '$cur_config_image' does not equal expected '$expected_config_image'" >&2
              return 1
            fi
            cur_search_transport="$(docker inspect jobpulse-api-prod --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^SEARCH_TRANSPORT=//p' | head -n1 || true)"
            cur_tor_enabled="$(docker inspect jobpulse-api-prod --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^TOR_ENABLED=//p' | head -n1 || true)"
            if [ -n "$cur_search_transport" ] && [ "$cur_search_transport" != "direct" ]; then
              echo "FATAL: API SEARCH_TRANSPORT is not unset/direct (got '$cur_search_transport')" >&2
              return 1
            fi
            if [ "$cur_tor_enabled" != "false" ]; then
              echo "FATAL: API TOR_ENABLED is not exactly 'false' (got '${cur_tor_enabled:-<unset>}')" >&2
              return 1
            fi
            return 0
          }

          # verify_api_stability <expected-image-id>: the recreated
          # container must keep restart_count 0 and the SAME StartedAt
          # across a bounded observation window (no crash-loop that a
          # single healthy sample could hide).
          verify_api_stability() {
            local expected_image_id="$1" first second
            first="$(container_state jobpulse-api-prod)" || return 1
            [ "$(state_field "$first" 3)" = "0" ] || { echo "FATAL: API restart_count is $(state_field "$first" 3), expected 0" >&2; return 1; }
            sleep 20
            second="$(container_state jobpulse-api-prod)" || return 1
            if [ "$(state_field "$second" 1)" != "$(state_field "$first" 1)" ] \
              || [ "$(state_field "$second" 6)" != "$(state_field "$first" 6)" ] \
              || [ "$(state_field "$second" 3)" != "0" ] \
              || [ "$(state_field "$second" 4)" != "true" ] \
              || [ "$(state_field "$second" 5)" != "healthy" ] \
              || [ "$(state_field "$second" 2)" != "$expected_image_id" ]; then
              echo "FATAL: API was not stable across the observation window (restarts=$(state_field "$second" 3) running=$(state_field "$second" 4) health=$(state_field "$second" 5) startedAtUnchanged=$([ "$(state_field "$second" 6)" = "$(state_field "$first" 6)" ] && echo true || echo false))" >&2
              return 1
            fi
            echo "api_stability=confirmed restart_count=0"
            return 0
          }

          # Exact before/after equality of db/frontend/tor identity+state
          # (Id, Image, RestartCount, Running, Health, StartedAt,
          # Config.Image) -- none of them may be recreated, restarted, or
          # otherwise disturbed.
          verify_other_services_unchanged() {
            local db_now frontend_now tor_now
            db_now="$(container_state jobpulse-postgres-prod)" || { echo "FATAL: cannot read DB state" >&2; return 1; }
            frontend_now="$(container_state jobpulse-frontend-prod)" || { echo "FATAL: cannot read frontend state" >&2; return 1; }
            tor_now="$(container_state jobpulse-tor-prod)" || { echo "FATAL: cannot read Tor state" >&2; return 1; }
            [ "$db_now" = "$DB_STATE_BEFORE" ] || { echo "FATAL: DB container identity/state changed: before=$DB_STATE_BEFORE after=$db_now" >&2; return 1; }
            [ "$frontend_now" = "$FRONTEND_STATE_BEFORE" ] || { echo "FATAL: frontend container identity/state changed: before=$FRONTEND_STATE_BEFORE after=$frontend_now" >&2; return 1; }
            [ "$tor_now" = "$TOR_STATE_BEFORE" ] || { echo "FATAL: Tor container identity/state changed: before=$TOR_STATE_BEFORE after=$tor_now" >&2; return 1; }
            [ -z "$(docker port jobpulse-tor-prod 2>/dev/null || true)" ] || { echo "FATAL: Tor now publishes host ports" >&2; return 1; }
            echo "db_frontend_tor_unchanged=confirmed"
            return 0
          }

          verify_git_unchanged() {
            local head dirty
            head="$(git rev-parse HEAD)" || return 1
            [ "$head" = "$EXPECTED_PRODUCTION_GIT_SHA" ] || { echo "FATAL: production git HEAD changed (now $head)" >&2; return 1; }
            dirty="$(git status --porcelain | grep -v '^??' || true)"
            [ -z "$dirty" ] || { echo "FATAL: production tracked worktree is no longer clean" >&2; return 1; }
            [ "$(sha256sum "$COMPOSE_FILE" | awk '{print $1}')" = "$COMPOSE_SHA256" ] || { echo "FATAL: production compose file changed" >&2; return 1; }
            echo "git_invariant=confirmed_f476"
            return 0
          }

          # Hash-only fingerprint of every scheduler input this runner
          # proved (never printed raw): this account's crontab, root's
          # crontab, /etc/crontab, /etc/cron.d/*, and .collection.env.
          scheduler_fingerprint() {
            {
              echo "--own--"; timeout 5 crontab -l 2>&1 || true
              echo "--root--"; timeout 5 sudo -n crontab -u root -l 2>&1 || true
              echo "--etc--"; [ -r /etc/crontab ] && timeout 5 cat /etc/crontab
              echo "--cron.d--"
              if [ -d /etc/cron.d ]; then
                timeout 5 find /etc/cron.d -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum
              fi
              echo "--collection.env--"; [ -r /opt/jobpulse/.collection.env ] && sha256sum /opt/jobpulse/.collection.env
              echo "--end--"
            } 2>/dev/null | sha256sum | awk '{print $1}'
          }

          # Read-only classification of the CURRENT api container, used
          # only when rollback reports failure. Decided by image ID,
          # never by Config.Image text.
          classify_api_state_after_failed_rollback() {
            local cur
            cur="$(container_state jobpulse-api-prod 2>/dev/null)" || cur=""
            local cur_image_id cur_running
            cur_image_id="$(state_field "$cur" 2)"
            cur_running="$(state_field "$cur" 4)"
            if [ "$cur_image_id" = "$EXPECTED_F476_IMAGE_ID" ] && [ "$cur_running" = "true" ]; then
              API_STATE_CLASSIFICATION="F476_API_RUNNING"
            elif [ "$cur_image_id" = "$EXPECTED_INCIDENT_IMAGE_ID" ]; then
              API_STATE_CLASSIFICATION="INCIDENT_API_PRESENT"
            else
              API_STATE_CLASSIFICATION="UNKNOWN_API_STATE"
            fi
            echo "final_api_state=${cur:-unreadable}" >&2
            echo "api_state_classification=$API_STATE_CLASSIFICATION" >&2
          }

          # ---------------------------------------------------------------
          # API-only rollback to the pre-deployment f476 RUNTIME: the same
          # f476 image ID and the same proven runtime environment, recreated
          # from the immutable f476 digest reference pulled and verified
          # before mutation. Restoration is defined by immutable identity +
          # runtime invariants, never by the historical Config.Image alias
          # (naming metadata that may no longer resolve). No tagging. Never
          # touches git, db, frontend, tor, cron, or secrets. Never a second
          # attempt.
          # ---------------------------------------------------------------
          rollback_api() {
            if [ "$ROLLBACK_PREPARED" != "true" ]; then
              echo "ROLLBACK_ABORTED: rollback was never prepared before mutation -- refusing a blind recreation" >&2
              return 1
            fi
            if [ -z "$FINAL_EFFECTIVE_ROLLBACK_CONFIG_SHA256" ] || [ -z "$FINAL_EXPECTED_CURRENT_ENV_SHA256" ]; then
              echo "ROLLBACK_ABORTED: pre-deployment snapshots are missing -- refusing a blind recreation" >&2
              return 1
            fi

            echo "ROLLBACK: re-checking production input provenance for drift since the final pre-mutation gate" >&2
            if [ "$(sha256sum "$COMPOSE_FILE" | awk '{print $1}')" != "$COMPOSE_SHA256" ]; then
              echo "ROLLBACK_ABORTED_INPUT_DRIFT: static production Compose file no longer matches the immutable f476 hash" >&2
              return 1
            fi
            local rb_config rb_config_sha
            rb_config="$(JOBPULSE_API_IMAGE="$F476_IMAGE_DIGEST_REFERENCE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config)" || {
              echo "ROLLBACK_ABORTED_INPUT_DRIFT: could not re-render effective ROLLBACK Compose config" >&2
              return 1
            }
            rb_config_sha="$(printf '%s\n' "$rb_config" | sha256sum | awk '{print $1}')"
            if [ "$rb_config_sha" != "$FINAL_EFFECTIVE_ROLLBACK_CONFIG_SHA256" ]; then
              echo "ROLLBACK_ABORTED_INPUT_DRIFT: effective ROLLBACK Compose config changed since the final pre-mutation gate" >&2
              return 1
            fi
            local f476_env_json
            f476_env_json="$(decode_image_env "$F476_IMAGE_ENV_JSON_B64")" || return 1
            render_compose_json "$F476_IMAGE_DIGEST_REFERENCE" || return 1
            compute_env_parity_hashes "$RENDERED_COMPOSE_JSON" "$f476_env_json" "[]" || return 1
            if [ "$EXPECTED_RUNTIME_ENV_SHA256" != "$FINAL_EXPECTED_CURRENT_ENV_SHA256" ]; then
              echo "ROLLBACK_ABORTED_INPUT_DRIFT: effective CURRENT Compose environment changed since the final pre-mutation gate" >&2
              return 1
            fi
            echo "ROLLBACK: inputs unchanged since the final pre-mutation gate -- safe to recreate" >&2

            # The f476 rollback artifact was pulled by digest and verified
            # before mutation; re-prove it is still locally present with the
            # exact f476 identity immediately before using it.
            local rb_local_id
            rb_local_id="$(docker image inspect "$F476_IMAGE_DIGEST_REFERENCE" --format '{{.Id}}' 2>/dev/null || true)"
            if [ "$rb_local_id" != "$EXPECTED_F476_IMAGE_ID" ]; then
              echo "ROLLBACK_ABORTED: f476 rollback artifact $F476_IMAGE_DIGEST_REFERENCE is no longer locally present as $EXPECTED_F476_IMAGE_ID (got '${rb_local_id:-<absent>}')" >&2
              return 1
            fi
            echo "ROLLBACK: recreating api from the immutable f476 digest reference $F476_IMAGE_DIGEST_REFERENCE" >&2
            JOBPULSE_API_IMAGE="$F476_IMAGE_DIGEST_REFERENCE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" up -d --no-build --no-deps --force-recreate api || {
              echo "FATAL: rollback recreation command failed" >&2
              return 1
            }

            wait_for_api_convergence "$F476_IMAGE_DIGEST_REFERENCE" "$EXPECTED_F476_IMAGE_ID" || return 1

            local rb_collector_sha rb_runtime_env
            rb_collector_sha="$(in_container_collector_sha256)" || { echo "FATAL: cannot read rolled-back collector hash" >&2; return 1; }
            if [ "$rb_collector_sha" != "$F476_COLLECTOR_SHA256" ]; then
              echo "FATAL: rolled-back API is not running the f476 collector (got $rb_collector_sha)" >&2
              return 1
            fi
            local rb_provider_sha
            rb_provider_sha="$(in_container_provider_sha256)" || { echo "FATAL: cannot read rolled-back provider hash" >&2; return 1; }
            if [ "$rb_provider_sha" != "$F476_PROVIDER_SHA256" ]; then
              echo "FATAL: rolled-back API is not running the f476 provider (Phase 4B must stay absent; got $rb_provider_sha)" >&2
              return 1
            fi
            rb_runtime_env="$(docker inspect jobpulse-api-prod --format '{{json .Config.Env}}')" || return 1
            compute_env_parity_hashes "$RENDERED_COMPOSE_JSON" "$f476_env_json" "$rb_runtime_env" || return 1
            if [ "$ACTUAL_RUNTIME_ENV_SHA256" != "$FINAL_EXPECTED_CURRENT_ENV_SHA256" ]; then
              echo "FATAL: rolled-back API runtime environment is not the exact pre-deployment environment" >&2
              return 1
            fi
            verify_other_services_unchanged || return 1
            verify_git_unchanged || return 1
            if [ "$(scheduler_fingerprint)" != "$SCHEDULER_FINGERPRINT_BEFORE" ]; then
              echo "FATAL: scheduler inputs differ from the pre-deployment fingerprint after rollback" >&2
              return 1
            fi
            echo "ROLLBACK: API restored to the f476 runtime from $F476_IMAGE_DIGEST_REFERENCE (image $EXPECTED_F476_IMAGE_ID; pre-deployment Config.Image was $API_CONFIG_IMAGE_BEFORE), healthy, f476 collector+provider, exact pre-deployment environment, direct/no-Tor, db/frontend/tor/git/scheduler unchanged" >&2
            return 0
          }

          release_locks() {
            if [ -n "$INTERNAL_LOCK_FD" ]; then
              exec {INTERNAL_LOCK_FD}>&- || true
            fi
            if [ -n "$OUTER_LOCK_FD" ]; then
              exec {OUTER_LOCK_FD}>&- || true
            fi
          }

          final_exit_trap() {
            local ec=$?
            set +e
            trap - ERR

            if [ "$WORKFLOW_SUCCESS" != "true" ]; then
              if [ "$API_MUTATION_STARTED" = "true" ] && [ "$DEPLOY_CONFIRMED" != "true" ]; then
                echo "--- incident deployment did not complete successfully -- attempting exactly one API-only rollback ---" >&2
                ROLLBACK_ATTEMPTED=true
                if rollback_api; then
                  ROLLBACK_CONFIRMED=true
                  # A confirmed rollback does NOT make this run succeed.
                  echo "INCIDENT_DEPLOY_FAILED_ROLLBACK_CONFIRMED_PRESTATE_RESTORED"
                else
                  echo "FATAL: rollback failed or could not be verified -- manual operator review required (no second rollback attempt)" >&2
                  classify_api_state_after_failed_rollback
                  echo "INCIDENT_DEPLOY_FAILED_ROLLBACK_NOT_CONFIRMED_MANUAL_REVIEW_REQUIRED"
                fi
              else
                echo "No API mutation had started -- production was not changed; nothing to roll back." >&2
                echo "INCIDENT_DEPLOY_ABORTED_BEFORE_MUTATION"
              fi
              echo "--- rollback summary ---" >&2
              echo "api_mutation_started=$API_MUTATION_STARTED" >&2
              echo "rollback_attempted=$ROLLBACK_ATTEMPTED" >&2
              echo "rollback_confirmed=$ROLLBACK_CONFIRMED" >&2
              echo "api_state_classification=${API_STATE_CLASSIFICATION:-not_evaluated}" >&2
              [ "$ec" -ne 0 ] || ec=1
            fi

            [ -n "$TMP_DOCKER_CONFIG" ] && rm -rf "$TMP_DOCKER_CONFIG"
            release_locks
            rm -f "$REMOTE_SCRIPT_SELF"
            exit "$ec"
          }
          trap final_exit_trap EXIT

          cd /opt/jobpulse || fail "cannot cd to /opt/jobpulse"

          echo "===INCIDENT_259C507_API_DEPLOY_START==="
          echo "== identity =="
          hostname

          echo "== precondition: production git state (this workflow NEVER mutates git) =="
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "production_git_sha=$CURRENT_SHA"
          [ "$CURRENT_SHA" = "$EXPECTED_PRODUCTION_GIT_SHA" ] || fail "production git HEAD ($CURRENT_SHA) is not the expected f476 baseline ($EXPECTED_PRODUCTION_GIT_SHA)"
