          # ZERO production filesystem writes: the three JSON documents are
          # held in shell variables and streamed through a length-prefixed
          # stdin framing protocol into one python3 consumer. Only
          # hashes/counts ever leave this process.
          # ---------------------------------------------------------------
          emit_env_parity_frame() {
            local payload="$1" len
            len="$(printf '%s' "$payload" | wc -c)"
            printf '%s\n' "$len"
            printf '%s' "$payload"
