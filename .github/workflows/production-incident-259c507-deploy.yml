name: Production Incident 259c507 Deploy

# ============================================================================
# INCIDENT 259c507 -- ONE-TIME, API-ONLY PRODUCTION DEPLOYMENT RUNNER.
#
# Context: production (git f4765f857355c6543f68cea0e481b7f20a917147, f476)
# silently discards legitimate LinkedIn jobs. The reviewed fix is source
# commit 259c507e10def1cae5a4f10cd718811981233f0d (sole parent f476, only
# runtime change scripts/collector_postgres.py). It was built ONCE, by
# production-incident-259c507-image-build.yml (run 36858099909), into the
# immutable artifact
#   ghcr.io/mrezamaghouli/jobpulse-api:incident-259c507e10def1cae5a4f10cd718811981233f0d
#   OCI index      sha256:91cd873be81d013c16503fb7b5ccec3790946203ec1c22ade31fef1882e8e5c4
#   linux/amd64    sha256:24d18483e82bac1932bf4ddd6eaf3d1f7cca321e0247bba6fe06220e09e07316
#   image config   sha256:b905231fe790bc21c12c89303986c76a94c329b5d1b53b54d49265a62b08d1f7
#
# Why the API container must be replaced: the authoritative production
# cron runs scripts/run_collection_cycle_safe.sh from the HOST checkout,
# but that wrapper executes every collection step INSIDE the api
# container (`docker compose exec -T api ...`) -- process_search_demand_queue
# -> linkedin_plan_collect -> collector_postgres all run from the code
# baked into the running API image. Changing host git would not change
# collection behavior; replacing the API container's image does.
#
# This workflow performs exactly ONE production mutation: it recreates
# ONLY the api service from the immutable incident artifact, referenced
# by DIGEST (never by tag), after a strict fail-closed preflight. It
# NEVER:
#   - changes production git (no reset/checkout/pull/merge/clean/stash)
#   - recreates/restarts db, frontend, or tor
#   - touches cron, systemd, .collection.env, secrets, or env files
#   - runs a collection cycle, a collector/queue script, or contacts
#     LinkedIn (deployment does NOT authorize a collection run)
#   - sets SEARCH_TRANSPORT=proxy or TOR_ENABLED=true, or touches
#     Tor/ControlPort/NEWNYM
#   - performs Phase 4M API reference normalization (Phase 4M remains
#     paused) or dispatches any other workflow
#   - deploys :main, :latest, the main/b63cb54 image, a 370562b image,
#     or any operator-supplied image (there is no image/SHA/target input)
#
# If anything fails after the mutation marker, it attempts exactly ONE
# API-only rollback to the pre-deployment f476 API runtime (same f476
# image ID, same runtime environment), recreated from the immutable f476
# digest reference that was pulled and verified BEFORE mutation, and
# verifies that rollback. A confirmed rollback does NOT make the run
# succeed.
#
# This is NOT a repurposing of, and does not modify:
#   - deploy.yml (floating :main + git reset to origin/main -- never use)
#   - production-direct-runtime-upgrade.yml (also moves production git)
#   - production-api-reference-normalization.yml (Phase 4M, paused)
#   - production-prenormalization-readonly-verification.yml (Phase 4M)
#   - production-incident-259c507-image-build.yml (building the artifact
#     did not authorize deploying it; this runner is that separate,
#     separately authorized step)
#
# workflow_dispatch ONLY, from main, gated by an exact confirmation token.
# See docs/PRODUCTION_RUNBOOK.md's "Incident 259c507: API-only deployment
# runner" section.
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Type exactly DEPLOY_259C507_INCIDENT_IMAGE to confirm. This
          recreates ONLY the production api container from the immutable
          incident image
          ghcr.io/mrezamaghouli/jobpulse-api@sha256:91cd873be81d013c16503fb7b5ccec3790946203ec1c22ade31fef1882e8e5c4
          (source 259c507e10def1cae5a4f10cd718811981233f0d). It never
          changes production git, never touches db/frontend/tor/cron,
          never runs a collection cycle, and rolls the API back to its
          exact pre-deployment runtime if any post-deploy check fails.
        required: true
        type: string

permissions:
  contents: read
  packages: read

# Shares the SAME concurrency group as production-direct-runtime-upgrade.yml
# and production-api-reference-normalization.yml: all three mutate the
# same production API runtime and must never overlap.
concurrency:
  group: jobpulse-production-direct-runtime-upgrade
  cancel-in-progress: false

env:
  VM_HOST: "35.192.251.190"
  VM_USER: "mrezamaghouli"
  VM_PORT: "22"
  CONFIRMATION: ${{ inputs.confirmation }}
  # One-time pinned constants. There is deliberately no input that can
  # change any of them -- a different artifact or baseline requires a
  # separately reviewed workflow change.
  TARGET_SOURCE_SHA: "259c507e10def1cae5a4f10cd718811981233f0d"
  # The incident source's only parent IS the production baseline that
  # must be live (and must stay live -- this runner never moves git).
  TARGET_PARENT_SHA: "f4765f857355c6543f68cea0e481b7f20a917147"
  EXPECTED_PRODUCTION_GIT_SHA: "f4765f857355c6543f68cea0e481b7f20a917147"
  # The ONLY image this runner can deploy -- immutable digest form. Never
  # derived from the dispatch commit, a tag, or any input.
  INCIDENT_IMAGE: "ghcr.io/mrezamaghouli/jobpulse-api@sha256:91cd873be81d013c16503fb7b5ccec3790946203ec1c22ade31fef1882e8e5c4"
  INCIDENT_IMAGE_REFERENCE: "ghcr.io/mrezamaghouli/jobpulse-api:incident-259c507e10def1cae5a4f10cd718811981233f0d"
  INCIDENT_IMAGE_INDEX_DIGEST: "sha256:91cd873be81d013c16503fb7b5ccec3790946203ec1c22ade31fef1882e8e5c4"
  INCIDENT_IMAGE_AMD64_MANIFEST_DIGEST: "sha256:24d18483e82bac1932bf4ddd6eaf3d1f7cca321e0247bba6fe06220e09e07316"
  INCIDENT_IMAGE_CONFIG_DIGEST: "sha256:b905231fe790bc21c12c89303986c76a94c329b5d1b53b54d49265a62b08d1f7"
  INCIDENT_BUILD_RUN_ID: "36858099909"
  INCIDENT_PURPOSE_LABEL: "linkedin-header-artifact-false-positive-fix"
  # Historical f476 API image (the expected pre-deployment runtime and the
  # rollback target): OCI index (= Docker image ID under this host's
  # containerd image store), linux/amd64 manifest, config.
  EXPECTED_F476_IMAGE_ID: "sha256:7739628f61c3bba88ff4e395c0f0a0ce3bea3e3abb40956207b495f9d909b753"
  EXPECTED_F476_AMD64_MANIFEST_DIGEST: "sha256:75207004ec746504940d6bf1b61dd6a86901c5d6ecd2499987c5bc1220580907"
  EXPECTED_F476_CONFIG_DIGEST: "sha256:fd9f1eedc8924304aba851770b56f17c8b3dde30a6ecf246dee79129073a9801"
  # The rollback artifact, by immutable digest. Production may still run
  # f476 from its containerd snapshot after the local image object was
  # removed (proven 2026-10-02), so the runner re-pulls exactly this
  # digest -- after the runner-side GHCR chain verification -- before any
  # mutation. Never a tag, never the historical rollback alias.
  F476_IMAGE_DIGEST_REFERENCE: "ghcr.io/mrezamaghouli/jobpulse-api@sha256:7739628f61c3bba88ff4e395c0f0a0ce3bea3e3abb40956207b495f9d909b753"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Safety ceiling, not a retry mechanism: one candidate attempt and at
    # most one rollback attempt. Preflight incl. scheduler provenance
    # (~1 min) + digest pull (~2-3 min cold) + candidate convergence
    # (<=~2.5 min) + stability window + rollback convergence (<=~2.5 min)
    # stays well under this bound.
    timeout-minutes: 20
    steps:
      - name: Require dispatch from main
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: this workflow may only be dispatched from refs/heads/main (got '${{ github.ref }}')" >&2
            exit 1
          fi

      - name: Require exact confirmation token
        run: |
          set -euo pipefail
          if [ "${CONFIRMATION:-}" != "DEPLOY_259C507_INCIDENT_IMAGE" ]; then
            echo "ERROR: confirmation input must be exactly DEPLOY_259C507_INCIDENT_IMAGE" >&2
            exit 1
          fi

      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive immutable source provenance from pinned git objects
        run: |
          set -euo pipefail

          if [ "$TARGET_PARENT_SHA" != "$EXPECTED_PRODUCTION_GIT_SHA" ]; then
            echo "ERROR: TARGET_PARENT_SHA and EXPECTED_PRODUCTION_GIT_SHA pins disagree" >&2
            exit 1
          fi
          case "$INCIDENT_IMAGE" in
            "ghcr.io/mrezamaghouli/jobpulse-api@${INCIDENT_IMAGE_INDEX_DIGEST}") ;;
            *) echo "ERROR: INCIDENT_IMAGE is not the digest reference of INCIDENT_IMAGE_INDEX_DIGEST" >&2; exit 1 ;;
          esac
          case "$F476_IMAGE_DIGEST_REFERENCE" in
            "ghcr.io/mrezamaghouli/jobpulse-api@${EXPECTED_F476_IMAGE_ID}") ;;
            *) echo "ERROR: F476_IMAGE_DIGEST_REFERENCE is not the digest reference of EXPECTED_F476_IMAGE_ID" >&2; exit 1 ;;
          esac

          git fetch origin main
          git cat-file -e "${EXPECTED_PRODUCTION_GIT_SHA}^{commit}"
          git cat-file -e "${TARGET_SOURCE_SHA}^{commit}"

          # The incident source must be the reviewed, merged fix whose
          # ONLY parent is the live production baseline.
          parents="$(git rev-list --parents -n 1 "$TARGET_SOURCE_SHA" | cut -d' ' -f2-)"
          if [ "$parents" != "$EXPECTED_PRODUCTION_GIT_SHA" ]; then
            echo "ERROR: $TARGET_SOURCE_SHA parents are '$parents', expected exactly '$EXPECTED_PRODUCTION_GIT_SHA'" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$TARGET_SOURCE_SHA" origin/main

          # Production keeps running the f476 checkout (this runner never
          # moves production git). The compose file and frontend must be
          # byte-identical between f476 and 259c507 so the f476 host
          # checkout is a correct service definition for the incident
          # image.
          # scripts/providers/ is checked too: the incident image must NOT
          # carry the Phase 4B poster-profile provider change.
          for path in docker-compose.prod.yml frontend/index.html scripts/providers/linkedin_browser_provider.py; do
            if [ "$(git rev-parse "${EXPECTED_PRODUCTION_GIT_SHA}:${path}")" != "$(git rev-parse "${TARGET_SOURCE_SHA}:${path}")" ]; then
              echo "ERROR: $path differs between f476 and 259c507 -- refusing to deploy the incident image against the f476 checkout" >&2
              exit 1
            fi
          done

          # Every hash below comes from immutable git objects in THIS
          # checkout, never from production or a working tree.
          COMPOSE_SHA256="$(git show "${EXPECTED_PRODUCTION_GIT_SHA}:docker-compose.prod.yml" | sha256sum | awk '{print $1}')"
          FRONTEND_SHA256="$(git show "${EXPECTED_PRODUCTION_GIT_SHA}:frontend/index.html" | sha256sum | awk '{print $1}')"
          F476_COLLECTOR_SHA256="$(git show "${EXPECTED_PRODUCTION_GIT_SHA}:scripts/collector_postgres.py" | sha256sum | awk '{print $1}')"
          INCIDENT_COLLECTOR_SHA256="$(git show "${TARGET_SOURCE_SHA}:scripts/collector_postgres.py" | sha256sum | awk '{print $1}')"
          F476_PROVIDER_SHA256="$(git show "${EXPECTED_PRODUCTION_GIT_SHA}:scripts/providers/linkedin_browser_provider.py" | sha256sum | awk '{print $1}')"
          if [ "$F476_COLLECTOR_SHA256" = "$INCIDENT_COLLECTOR_SHA256" ]; then
            echo "ERROR: collector_postgres.py is identical in f476 and 259c507 -- the in-container code proof would be meaningless" >&2
            exit 1
          fi

          echo "compose_sha256=$COMPOSE_SHA256"
          echo "frontend_sha256=$FRONTEND_SHA256"
          echo "f476_collector_sha256=$F476_COLLECTOR_SHA256"
          echo "incident_collector_sha256=$INCIDENT_COLLECTOR_SHA256"
          echo "f476_provider_sha256=$F476_PROVIDER_SHA256"
          {
            echo "COMPOSE_SHA256=$COMPOSE_SHA256"
            echo "FRONTEND_SHA256=$FRONTEND_SHA256"
            echo "F476_COLLECTOR_SHA256=$F476_COLLECTOR_SHA256"
            echo "INCIDENT_COLLECTOR_SHA256=$INCIDENT_COLLECTOR_SHA256"
            echo "F476_PROVIDER_SHA256=$F476_PROVIDER_SHA256"
          } >> "$GITHUB_ENV"

      - name: Write registry digest-chain verifier
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/incident_deploy_registry.py" <<'REGISTRY_PY'
          """Read-only, content-addressed GHCR verification of the incident
          artifact. Never pushes, deletes, or pulls image layers -- only
          manifests and config blobs are fetched, each re-hashed against the
          digest its verified parent declared (never trusting HTTP status or
          the Docker-Content-Digest header)."""
          import base64
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          REGISTRY_HOST = "ghcr.io"
          REPOSITORY = "mrezamaghouli/jobpulse-api"
          INCIDENT_TAG = "incident-259c507e10def1cae5a4f10cd718811981233f0d"
          INCIDENT_INDEX_DIGEST = "sha256:91cd873be81d013c16503fb7b5ccec3790946203ec1c22ade31fef1882e8e5c4"
          INCIDENT_AMD64_MANIFEST_DIGEST = "sha256:24d18483e82bac1932bf4ddd6eaf3d1f7cca321e0247bba6fe06220e09e07316"
          INCIDENT_CONFIG_DIGEST = "sha256:b905231fe790bc21c12c89303986c76a94c329b5d1b53b54d49265a62b08d1f7"
          F476_INDEX_DIGEST = "sha256:7739628f61c3bba88ff4e395c0f0a0ce3bea3e3abb40956207b495f9d909b753"
          F476_AMD64_MANIFEST_DIGEST = "sha256:75207004ec746504940d6bf1b61dd6a86901c5d6ecd2499987c5bc1220580907"
          F476_CONFIG_DIGEST = "sha256:fd9f1eedc8924304aba851770b56f17c8b3dde30a6ecf246dee79129073a9801"
          REQUIRED_LABELS = {
              "org.opencontainers.image.revision": "259c507e10def1cae5a4f10cd718811981233f0d",
              "io.jobpulse.incident.parent": "f4765f857355c6543f68cea0e481b7f20a917147",
              "io.jobpulse.incident.purpose": "linkedin-header-artifact-false-positive-fix",
              "io.jobpulse.incident.build-run-id": "36858099909",
          }
          MAX_BYTES = 10 * 1024 * 1024
          SHA256_DIGEST_RE = re.compile(r"^sha256:[0-9a-f]{64}$")
          INDEX_MEDIA_TYPES = {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }
          MANIFEST_MEDIA_TYPES = {
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          }
          ACCEPT = ",".join(sorted(INDEX_MEDIA_TYPES | MANIFEST_MEDIA_TYPES))
          ATTESTATION_REFERENCE_TYPE = "attestation-manifest"
          # Runtime contract: must be identical to the f476 image.
          FATAL_CONFIG_KEYS = ("Cmd", "Entrypoint", "WorkingDir", "ExposedPorts", "User")
          # Image-default Env keys that could change search transport / Tor
          # / proxy behavior. Their values must be identical to f476's
          # (both absent is fine).
          TRANSPORT_SENSITIVE_KEY_RE = re.compile(r"^(SEARCH_TRANSPORT|TOR_.*|.*PROXY.*)$", re.IGNORECASE)
          SUCCESS_MARKER = "INCIDENT_IMAGE_DIGEST_CHAIN_VERIFIED"


          class ProvenanceError(Exception):
              pass


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def _read_bounded(response):
              data = response.read(MAX_BYTES + 1)
              if len(data) > MAX_BYTES:
                  raise ProvenanceError("registry response exceeds the size bound")
              return data


          class Registry:
              """Minimal GHCR client: at most one redirect hop, https only,
              Authorization never forwarded across the hop."""

              def __init__(self, token):
                  self.token = token
                  self.opener = urllib.request.build_opener(_NoRedirect)

              def _request(self, url, headers):
                  request = urllib.request.Request(url, headers=headers)
                  try:
                      with self.opener.open(request, timeout=60) as response:
                          return response.status, _read_bounded(response), None
                  except urllib.error.HTTPError as error:
                      if error.code in (301, 302, 303, 307, 308):
                          return error.code, b"", error.headers.get("Location")
                      return error.code, b"", None

              def get(self, path):
                  url = f"https://{REGISTRY_HOST}/v2/{REPOSITORY}/{path}"
                  headers = {"Authorization": f"Bearer {self.token}", "Accept": ACCEPT}
                  status, body, location = self._request(url, headers)
                  if location:
                      target = urllib.parse.urljoin(url, location)
                      if urllib.parse.urlparse(target).scheme != "https":
                          raise ProvenanceError("registry redirect is not https")
                      status, body, second = self._request(target, {"Accept": ACCEPT})
                      if second:
                          raise ProvenanceError("registry issued more than one redirect hop")
                  return status, body


          def pull_token(username, password):
              credentials = base64.b64encode(f"{username}:{password}".encode()).decode()
              query = urllib.parse.urlencode(
                  {"service": REGISTRY_HOST, "scope": f"repository:{REPOSITORY}:pull"}
              )
              request = urllib.request.Request(
                  f"https://{REGISTRY_HOST}/token?{query}",
                  headers={"Authorization": f"Basic {credentials}"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  token = json.loads(_read_bounded(response)).get("token")
              if not token:
                  raise ProvenanceError("registry did not return a pull token")
              return token


          def sha256_digest(body):
              return "sha256:" + hashlib.sha256(body).hexdigest()


          def require_digest(value, context):
              if not isinstance(value, str) or not SHA256_DIGEST_RE.match(value):
                  raise ProvenanceError(f"{context}: not a sha256 digest: {value!r}")
              return value


          def parse_json_object(body, context):
              try:
                  value = json.loads(body)
              except (ValueError, UnicodeDecodeError) as error:
                  raise ProvenanceError(f"{context}: invalid JSON ({error})") from None
              if not isinstance(value, dict):
                  raise ProvenanceError(f"{context}: expected a JSON object")
              return value


          def fetch_verified(registry, kind, digest):
              require_digest(digest, kind)
              status, body = registry.get(f"{kind}/{digest}")
              if status != 200:
                  raise ProvenanceError(f"{kind}/{digest}: HTTP {status}")
              if not body:
                  raise ProvenanceError(f"{kind}/{digest}: empty body")
              actual = sha256_digest(body)
              if actual != digest:
                  raise ProvenanceError(f"{kind}/{digest}: content hashes to {actual}")
              return body


          def verify_tag_resolves(registry, tag, index_digest):
              status, body = registry.get(f"manifests/{tag}")
              if status != 200:
                  raise ProvenanceError(f"tag {tag}: HTTP {status}")
              actual = sha256_digest(body)
              if actual != index_digest:
                  raise ProvenanceError(f"tag {tag} resolves to {actual}, not the pinned index digest {index_digest}")


          def select_runtime_manifest(index):
              """Exactly one linux/amd64 runtime manifest; every other entry
              must be a Buildx attestation manifest that references it."""
              if index.get("mediaType") not in INDEX_MEDIA_TYPES:
                  raise ProvenanceError(f"top-level object is not an image index: {index.get('mediaType')!r}")
              entries = index.get("manifests")
              if not isinstance(entries, list) or not entries:
                  raise ProvenanceError("image index has no manifests")
              runtime, attestations = [], []
              for entry in entries:
                  if not isinstance(entry, dict):
                      raise ProvenanceError("malformed image index entry")
                  require_digest(entry.get("digest"), "index entry")
                  annotations = entry.get("annotations") or {}
                  reference_type = annotations.get("vnd.docker.reference.type")
                  if reference_type == ATTESTATION_REFERENCE_TYPE:
                      attestations.append(entry)
                      continue
                  if reference_type is not None:
                      raise ProvenanceError(f"unexpected index reference type {reference_type!r}")
                  platform = entry.get("platform") or {}
                  if platform.get("os") == "linux" and platform.get("architecture") == "amd64":
                      if entry.get("mediaType") not in MANIFEST_MEDIA_TYPES:
                          raise ProvenanceError("linux/amd64 entry has an unexpected media type")
                      runtime.append(entry)
                  else:
                      raise ProvenanceError(f"unexpected image index entry for platform {platform!r}")
              if len(runtime) != 1:
                  raise ProvenanceError(f"expected exactly one linux/amd64 runtime manifest, found {len(runtime)}")
              selected = runtime[0]
              for attestation in attestations:
                  referenced = (attestation.get("annotations") or {}).get("vnd.docker.reference.digest")
                  if referenced != selected["digest"]:
                      raise ProvenanceError("attestation manifest does not reference the runtime manifest")
              return selected


          def describe_image(registry, index_digest):
              index = parse_json_object(fetch_verified(registry, "manifests", index_digest), "index")
              selected = select_runtime_manifest(index)
              manifest = parse_json_object(
                  fetch_verified(registry, "manifests", selected["digest"]), "runtime manifest"
              )
              if manifest.get("mediaType", selected["mediaType"]) not in MANIFEST_MEDIA_TYPES:
                  raise ProvenanceError("runtime manifest has an unexpected media type")
              config_descriptor = manifest.get("config")
              layers = manifest.get("layers")
              if not isinstance(config_descriptor, dict) or not isinstance(layers, list) or not layers:
                  raise ProvenanceError("runtime manifest is missing config or layers")
              config_digest = require_digest(config_descriptor.get("digest"), "config")
              config = parse_json_object(fetch_verified(registry, "blobs", config_digest), "image config")
              if config.get("os") != "linux" or config.get("architecture") != "amd64":
                  raise ProvenanceError("image config is not linux/amd64")
              container_config = config.get("config")
              if not isinstance(container_config, dict):
                  raise ProvenanceError("image config has no 'config' object")
              return {
                  "index_digest": index_digest,
                  "runtime_manifest_digest": selected["digest"],
                  "config_digest": config_digest,
                  "container_config": container_config,
              }


          def env_map(env_list, context):
              if not isinstance(env_list, list) or not all(isinstance(e, str) for e in env_list):
                  raise ProvenanceError(f"{context}: Env is not a list of strings")
              result = {}
              for entry in env_list:
                  key, sep, value = entry.partition("=")
                  if not sep or not key:
                      raise ProvenanceError(f"{context}: malformed Env entry")
                  if key in result:
                      raise ProvenanceError(f"{context}: duplicate Env key {key}")
                  result[key] = value
              return result


          def verify(registry):
              # Hop 0: the mutable tag must currently resolve to the pinned
              # index digest -- but from here on only digests are used.
              verify_tag_resolves(registry, INCIDENT_TAG, INCIDENT_INDEX_DIGEST)

              incident = describe_image(registry, INCIDENT_INDEX_DIGEST)
              if incident["runtime_manifest_digest"] != INCIDENT_AMD64_MANIFEST_DIGEST:
                  raise ProvenanceError(
                      f"index resolves to linux/amd64 manifest {incident['runtime_manifest_digest']}, "
                      f"not the pinned {INCIDENT_AMD64_MANIFEST_DIGEST}"
                  )
              if incident["config_digest"] != INCIDENT_CONFIG_DIGEST:
                  raise ProvenanceError(
                      f"manifest resolves to config {incident['config_digest']}, not the pinned {INCIDENT_CONFIG_DIGEST}"
                  )

              labels = incident["container_config"].get("Labels") or {}
              for key, expected in REQUIRED_LABELS.items():
                  if labels.get(key) != expected:
                      raise ProvenanceError(f"image label {key} is {labels.get(key)!r}, expected {expected!r}")

              # The expected pre-deployment runtime / rollback target: the
              # historical f476 image, proven by its full digest chain.
              f476 = describe_image(registry, F476_INDEX_DIGEST)
              if f476["runtime_manifest_digest"] != F476_AMD64_MANIFEST_DIGEST:
                  raise ProvenanceError(
                      f"f476 index resolves to linux/amd64 manifest {f476['runtime_manifest_digest']}, "
                      f"not the pinned {F476_AMD64_MANIFEST_DIGEST}"
                  )
              if f476["config_digest"] != F476_CONFIG_DIGEST:
                  raise ProvenanceError(
                      f"f476 manifest resolves to config {f476['config_digest']}, not the pinned {F476_CONFIG_DIGEST}"
                  )
              for key in FATAL_CONFIG_KEYS:
                  if incident["container_config"].get(key) != f476["container_config"].get(key):
                      raise ProvenanceError(f"runtime contract key {key} differs from the f476 image")

              incident_env_list = incident["container_config"].get("Env")
              f476_env_list = f476["container_config"].get("Env")
              incident_env = env_map(incident_env_list, "incident image")
              f476_env = env_map(f476_env_list, "f476 image")
              for key in sorted(set(incident_env) | set(f476_env)):
                  if TRANSPORT_SENSITIVE_KEY_RE.match(key) and incident_env.get(key) != f476_env.get(key):
                      raise ProvenanceError(f"transport-sensitive image Env key {key} differs from the f476 image")

              changed_keys = sorted(
                  k for k in set(incident_env) | set(f476_env) if incident_env.get(k) != f476_env.get(k)
              )
              return {
                  "incident_env_list": incident_env_list,
                  "f476_env_list": f476_env_list,
                  "image_default_env_keys_changed_vs_f476": changed_keys,
              }


          def main(argv):
              if len(argv) != 2 or argv[1] != "verify":
                  raise ProvenanceError("usage: incident_deploy_registry.py verify")
              env = os.environ
              registry = Registry(pull_token(env["GHCR_USERNAME"], env["GHCR_PASSWORD"]))
              result = verify(registry)
              # Only key NAMES are ever printed, never Env values.
              print(f"incident_index_digest={INCIDENT_INDEX_DIGEST}")
              print(f"incident_amd64_manifest_digest={INCIDENT_AMD64_MANIFEST_DIGEST}")
              print(f"incident_config_digest={INCIDENT_CONFIG_DIGEST}")
              print("image_default_env_keys_changed_vs_f476=" + ",".join(result["image_default_env_keys_changed_vs_f476"]))
              with open(env["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  for name, value in (
                      ("F476_IMAGE_ENV_JSON_B64", result["f476_env_list"]),
                      ("INCIDENT_IMAGE_ENV_JSON_B64", result["incident_env_list"]),
                  ):
                      encoded = base64.b64encode(
                          json.dumps(value, separators=(",", ":"), ensure_ascii=True).encode()
                      ).decode()
                      handle.write(f"{name}={encoded}\n")
              print(SUCCESS_MARKER)
              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main(sys.argv))
              except ProvenanceError as error:
                  print(f"PROVENANCE_ERROR: {error}", file=sys.stderr)
                  sys.exit(1)
          REGISTRY_PY

