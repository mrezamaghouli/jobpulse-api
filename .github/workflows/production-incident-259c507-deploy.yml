          IMAGE_LABELS_FORMAT='{{index .Config.Labels "org.opencontainers.image.revision"}}|{{index .Config.Labels "io.jobpulse.incident.parent"}}|{{index .Config.Labels "io.jobpulse.incident.purpose"}}|{{index .Config.Labels "io.jobpulse.incident.build-run-id"}}'

