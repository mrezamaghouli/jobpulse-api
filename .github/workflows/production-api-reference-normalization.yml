                    fail "$COLLECTION_ENV_PATH sets JOBPULSE_COLLECTION_CYCLE_LOCK_PATH using dynamic shell syntax -- refusing to guess, failing closed"
                  fi
                else
                  LOCK_VALUE="$RAW_VALUE"
                fi
                if [[ "$LOCK_VALUE" == *'$'* ]] || [[ "$LOCK_VALUE" == *'`'* ]]; then
                  fail "$COLLECTION_ENV_PATH sets JOBPULSE_COLLECTION_CYCLE_LOCK_PATH using dynamic shell syntax -- refusing to guess, failing closed"
                fi
                LOCK_ASSIGNMENTS_FOUND=$((LOCK_ASSIGNMENTS_FOUND + 1))
                if [ "$LOCK_ASSIGNMENTS_FOUND" -gt 1 ]; then
                  fail "$COLLECTION_ENV_PATH sets JOBPULSE_COLLECTION_CYCLE_LOCK_PATH more than once with potentially conflicting values -- refusing to guess which is authoritative, failing closed"
                fi
                if [ "$LOCK_VALUE" != "$INTERNAL_LOCK_PATH" ]; then
                  fail "$COLLECTION_ENV_PATH sets JOBPULSE_COLLECTION_CYCLE_LOCK_PATH to '$LOCK_VALUE', not the expected '$INTERNAL_LOCK_PATH' -- refusing to proceed"
                fi
              elif [[ "$line" == *"JOBPULSE_COLLECTION_CYCLE_LOCK_PATH"* ]]; then
                fail "$COLLECTION_ENV_PATH references JOBPULSE_COLLECTION_CYCLE_LOCK_PATH in a line that is not a recognizable assignment -- refusing to guess, failing closed"
              fi
            done <<< "$COLLECTION_ENV_CONTENT"
          fi
          # Absent file or absent assignment is acceptable: the wrapper's
          # own source default already resolves to INTERNAL_LOCK_PATH,
          # and run 34679402811 proved that is the live effective value.
          echo "effective_internal_lock_provenance=confirmed_or_absent_default"

          echo "== collection scheduler safety: acquire locks non-blocking, outer then internal =="
          exec {OUTER_LOCK_FD}>"$OUTER_LOCK_PATH" || fail "cannot open outer lock file $OUTER_LOCK_PATH"
          flock -n "$OUTER_LOCK_FD" || fail "outer collection lock busy: $OUTER_LOCK_PATH -- refusing to proceed, no mutation"
          echo "outer_lock_acquired=yes"

          exec {INTERNAL_LOCK_FD}>"$INTERNAL_LOCK_PATH" || fail "cannot open internal lock file $INTERNAL_LOCK_PATH"
          flock -n "$INTERNAL_LOCK_FD" || fail "internal collection lock busy: $INTERNAL_LOCK_PATH -- refusing to proceed, no mutation"
          echo "internal_lock_acquired=yes"

          echo "== active collector check (read-only, docker top -- never kills anything) =="
          TOP_OUTPUT="$(docker top jobpulse-api-prod)"
          echo "$TOP_OUTPUT"
          ACTIVE_COLLECTOR=no
          for pattern in linkedin_auth_preflight seed_priority_coverage_queue process_search_demand_queue linkedin_plan_collect collector_postgres reconcile_priority_coverage run_collection_cycle; do
            if grep -q "$pattern" <<< "$TOP_OUTPUT"; then
              ACTIVE_COLLECTOR=yes
              echo "active_collector_pattern=$pattern"
            fi
          done
          echo "active_collector=$ACTIVE_COLLECTOR"
          [ "$ACTIVE_COLLECTOR" = "no" ] || fail "active collector process detected -- refusing to proceed, no mutation"

          echo "== canonical image provenance (GHCR pull, never touches a running container) =="
          TMP_DOCKER_CONFIG="$(mktemp -d)"
          if [ "$HAS_TOKEN" = "true" ]; then
            # The GHCR token (if any) arrives on THIS script's own stdin,
            # piped through the SSH session that invoked it -- never as a
            # command-line argument/argv, never Base64-transformed in
            # transit, never printed. Public images can also be pulled
            # anonymously (HAS_TOKEN=false is accepted).
            DOCKER_CONFIG="$TMP_DOCKER_CONFIG" docker login ghcr.io -u mrezamaghouli --password-stdin
          fi
          DOCKER_CONFIG="$TMP_DOCKER_CONFIG" docker pull "$CANONICAL_IMAGE"
          PULLED_IMAGE_ID="$(docker image inspect "$CANONICAL_IMAGE" --format '{{.Id}}')"
          [ "$PULLED_IMAGE_ID" = "$EXPECTED_IMAGE_ID" ] || fail "canonical image $CANONICAL_IMAGE resolved to unexpected ID $PULLED_IMAGE_ID (expected $EXPECTED_IMAGE_ID) -- refusing to mutate before ever touching the running container"
          echo "canonical_image_provenance=confirmed_same_bytes"

          # First call: the full pre-mutation reference-only-change proof
          # (effective CURRENT/CANDIDATE image identity, SEARCH_TRANSPORT,
          # TOR_ENABLED, normalized current/candidate Compose parity, base
          # service set, and runtime-vs-effective-CURRENT environment
          # equivalence). Both this call and the locks acquired earlier
          # (outer then internal, above) already hold -- this call runs
          # AFTER the locks, never before them.
          prove_reference_only_inputs

          echo "== final pre-mutation revalidation (narrows the preflight-to-mutation race window) =="
          REVALIDATE_SHA="$(git rev-parse HEAD)"
          [ "$REVALIDATE_SHA" = "$EXPECTED_PRODUCTION_SHA" ] || fail "production git SHA drifted before mutation (revalidation): $REVALIDATE_SHA"
          REVALIDATE_API_ID="$(api_field '{{.Id}}')"
          [ "$REVALIDATE_API_ID" = "$EXPECTED_API_CONTAINER_ID" ] || fail "API container ID drifted before mutation (revalidation)"
          REVALIDATE_API_CONFIG_IMAGE="$(api_field '{{.Config.Image}}')"
          [ "$REVALIDATE_API_CONFIG_IMAGE" = "$EXPECTED_CURRENT_CONFIG_IMAGE" ] || fail "API Config.Image drifted before mutation (revalidation)"
          REVALIDATE_API_IMAGE_ID="$(api_field '{{.Image}}')"
          [ "$REVALIDATE_API_IMAGE_ID" = "$EXPECTED_IMAGE_ID" ] || fail "API underlying image ID drifted before mutation (revalidation)"
          REVALIDATE_DB_ID="$(db_field '{{.Id}}')"
          [ "$REVALIDATE_DB_ID" = "$EXPECTED_DB_CONTAINER_ID" ] || fail "DB container ID drifted before mutation (revalidation)"
          REVALIDATE_FRONTEND_ID="$(frontend_field '{{.Id}}')"
          [ "$REVALIDATE_FRONTEND_ID" = "$EXPECTED_FRONTEND_CONTAINER_ID" ] || fail "frontend container ID drifted before mutation (revalidation)"
          REVALIDATE_TOR_ID="$(tor_field '{{.Id}}')"
          [ "$REVALIDATE_TOR_ID" = "$EXPECTED_TOR_CONTAINER_ID" ] || fail "Tor container ID drifted before mutation (revalidation)"
          REVALIDATE_COMPOSE_SHA256="$(sha256sum "$COMPOSE_FILE" | awk '{print $1}')"
          [ "$REVALIDATE_COMPOSE_SHA256" = "$COMPOSE_SHA256" ] || fail "compose file SHA-256 drifted before mutation (revalidation)"
          REVALIDATE_SEARCH_TRANSPORT="$(docker exec jobpulse-api-prod printenv SEARCH_TRANSPORT 2>/dev/null || echo UNSET)"
          if [ "$REVALIDATE_SEARCH_TRANSPORT" != "UNSET" ] && [ "$REVALIDATE_SEARCH_TRANSPORT" != "direct" ]; then
            fail "SEARCH_TRANSPORT drifted before mutation (revalidation)"
          fi
          REVALIDATE_TOR_ENABLED="$(docker exec jobpulse-api-prod printenv TOR_ENABLED 2>/dev/null || echo UNSET)"
          [ "$REVALIDATE_TOR_ENABLED" = "false" ] || fail "TOR_ENABLED drifted before mutation (revalidation)"
          echo "final_pre_mutation_revalidation=ok"

          echo "== final pre-mutation revalidation: full reference-only-inputs proof re-run fresh, immediately before mutation =="
          # Locks (acquired earlier) prevent a CONCURRENT collection cycle,
          # but they do not prevent a human/process from editing
          # .env/.api_keys.env/.admin.env on disk between the earlier
          # preflight call and here. Re-running the ENTIRE
          # prove_reference_only_inputs() proof -- image identity,
          # SEARCH_TRANSPORT, TOR_ENABLED, normalized current/candidate
          # parity, base service set, and runtime-vs-effective-CURRENT
          # environment equivalence -- immediately adjacent to the mutation
          # marker just below closes that race window for every safety-
          # critical value, not only the candidate's. This also
          # re-snapshots FINAL_EXPECTED_ENV_SHA256, which rollback_api()
          # later compares against if this normalization attempt fails.
          prove_reference_only_inputs
          echo "final_reference_only_revalidation=ok"

          echo "== ONLY AUTHORIZED PRODUCTION MUTATION: recreate api with the canonical f476 reference (same image bytes) =="
          API_MUTATION_STARTED=true
          JOBPULSE_API_IMAGE="$CANONICAL_IMAGE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" up -d --no-build --no-deps --force-recreate api

          wait_for_api_convergence "$CANONICAL_IMAGE" || exit 1

          echo "== normalization-specific success conditions =="
          NEW_API_ID="$(docker inspect -f '{{.Id}}' jobpulse-api-prod)"
          [ "$NEW_API_ID" != "$EXPECTED_API_CONTAINER_ID" ] || fail "API container ID is unchanged after --force-recreate -- recreation did not actually occur"
          NEW_API_RESTART_COUNT="$(docker inspect -f '{{.RestartCount}}' jobpulse-api-prod)"
          [ "$NEW_API_RESTART_COUNT" = "0" ] || fail "API restart_count is not 0 after recreation (got $NEW_API_RESTART_COUNT)"
          echo "new_api_container_id=$NEW_API_ID"
          echo "image_bytes_unchanged=true (still $EXPECTED_IMAGE_ID)"

          echo "== post-candidate DB/frontend/Tor invariant (must remain fully unchanged) =="
          DB_ID_AFTER="$(db_field '{{.Id}}')"
          DB_IMAGE_ID_AFTER="$(db_field '{{.Image}}')"
          DB_RESTART_COUNT_AFTER="$(db_field '{{.RestartCount}}')"
          DB_HEALTH_AFTER="$(db_field '{{with (index .State "Health")}}{{.Status}}{{else}}none{{end}}')"
          [ "$DB_ID_AFTER" = "$DB_ID_BEFORE" ] || fail "DB container ID changed: before=$DB_ID_BEFORE after=$DB_ID_AFTER"
          [ "$DB_IMAGE_ID_AFTER" = "$DB_IMAGE_ID_BEFORE" ] || fail "DB image ID changed: before=$DB_IMAGE_ID_BEFORE after=$DB_IMAGE_ID_AFTER"
          [ "$DB_RESTART_COUNT_AFTER" = "$DB_RESTART_COUNT_BEFORE" ] || fail "DB restart_count changed: before=$DB_RESTART_COUNT_BEFORE after=$DB_RESTART_COUNT_AFTER"
          [ "$DB_HEALTH_AFTER" = "healthy" ] || fail "DB is not healthy after recreation (got $DB_HEALTH_AFTER)"

          FRONTEND_ID_AFTER="$(frontend_field '{{.Id}}')"
          FRONTEND_IMAGE_ID_AFTER="$(frontend_field '{{.Image}}')"
          FRONTEND_RESTART_COUNT_AFTER="$(frontend_field '{{.RestartCount}}')"
          FRONTEND_RUNNING_AFTER="$(frontend_field '{{.State.Running}}')"
          [ "$FRONTEND_ID_AFTER" = "$FRONTEND_ID_BEFORE" ] || fail "frontend container ID changed (was recreated): before=$FRONTEND_ID_BEFORE after=$FRONTEND_ID_AFTER"
          [ "$FRONTEND_IMAGE_ID_AFTER" = "$FRONTEND_IMAGE_ID_BEFORE" ] || fail "frontend image ID changed: before=$FRONTEND_IMAGE_ID_BEFORE after=$FRONTEND_IMAGE_ID_AFTER"
          [ "$FRONTEND_RESTART_COUNT_AFTER" = "$FRONTEND_RESTART_COUNT_BEFORE" ] || fail "frontend restart_count changed: before=$FRONTEND_RESTART_COUNT_BEFORE after=$FRONTEND_RESTART_COUNT_AFTER"
          [ "$FRONTEND_RUNNING_AFTER" = "true" ] || fail "frontend is not running after recreation"

          TOR_ID_AFTER="$(tor_field '{{.Id}}')"
          TOR_IMAGE_ID_AFTER="$(tor_field '{{.Image}}')"
          TOR_RESTART_COUNT_AFTER="$(tor_field '{{.RestartCount}}')"
          TOR_HEALTH_AFTER="$(tor_field '{{with (index .State "Health")}}{{.Status}}{{else}}none{{end}}')"
          [ "$TOR_ID_AFTER" = "$TOR_ID_BEFORE" ] || fail "Tor container ID changed: before=$TOR_ID_BEFORE after=$TOR_ID_AFTER"
          [ "$TOR_IMAGE_ID_AFTER" = "$TOR_IMAGE_ID_BEFORE" ] || fail "Tor image ID changed: before=$TOR_IMAGE_ID_BEFORE after=$TOR_IMAGE_ID_AFTER"
          [ "$TOR_RESTART_COUNT_AFTER" = "$TOR_RESTART_COUNT_BEFORE" ] || fail "Tor restart_count changed: before=$TOR_RESTART_COUNT_BEFORE after=$TOR_RESTART_COUNT_AFTER"
          [ "$TOR_HEALTH_AFTER" = "healthy" ] || fail "Tor is not healthy after recreation (got $TOR_HEALTH_AFTER)"
          TOR_PUBLISHED_PORTS_AFTER="$(docker port jobpulse-tor-prod 2>/dev/null || true)"
          [ -z "$TOR_PUBLISHED_PORTS_AFTER" ] || fail "Tor now publishes host ports (expected none): $TOR_PUBLISHED_PORTS_AFTER"
          echo "db_frontend_tor_post_candidate_invariant=ok"

          echo "== post-candidate live frontend invariant (must remain exact f476, no frontend action taken) =="
          LIVE_FRONTEND_SHA256_AFTER="$(curl --connect-timeout 3 --max-time 5 -fsS http://127.0.0.1/ | sha256sum | awk '{print $1}')"
          [ "$LIVE_FRONTEND_SHA256_AFTER" = "$FRONTEND_SHA256" ] || fail "live frontend SHA-256 changed after API recreation (before=$FRONTEND_SHA256 after=$LIVE_FRONTEND_SHA256_AFTER)"

          echo "== post-candidate git invariant (this workflow never mutates git) =="
          POST_SHA="$(git rev-parse HEAD)"
          [ "$POST_SHA" = "$EXPECTED_PRODUCTION_SHA" ] || fail "production git SHA changed unexpectedly (before=$EXPECTED_PRODUCTION_SHA after=$POST_SHA)"
          DIRTY_TRACKED_AFTER="$(git status --porcelain | grep -v '^??' || true)"
          [ -z "$DIRTY_TRACKED_AFTER" ] || fail "production tracked worktree is not clean after recreation"
          echo "git_invariant=ok"

          echo "===NORMALIZATION_END==="
          echo "API_REFERENCE_NORMALIZED_TO_CANONICAL_F476"
          echo "PRODUCTION_API_REFERENCE_NORMALIZATION_COMPLETE"
          NORMALIZATION_CONFIRMED=true
          WORKFLOW_SUCCESS=true
          REMOTE_SCRIPT

          cleanup_runner() {
            rm -f ~/.ssh/jobpulse_normalization_key "$REMOTE_SCRIPT_LOCAL"
          }
          trap cleanup_runner EXIT

          REMOTE_SCRIPT_PATH="/tmp/jobpulse-api-reference-normalization-remote-${RUN_ID}.sh"

          # Only this one temporary file is transferred -- never .env,
          # .api_keys.env, .admin.env, .auth, cookies, storage state, the
          # ControlPort password file, or database credentials.
          scp "${SSH_OPTS[@]}" -i "$SSH_KEY_PATH" -P "$VM_PORT" \
            "$REMOTE_SCRIPT_LOCAL" "$VM_USER@$VM_HOST:${REMOTE_SCRIPT_PATH}"

          HAS_TOKEN="false"
          if [ -n "${GHCR_TOKEN:-}" ]; then
            HAS_TOKEN="true"
          fi

          # The GHCR token (if any) travels ONLY through this ssh
          # invocation's own stdin, piped straight into the remote
          # script's `docker login --password-stdin` -- never Base64-
          # encoded, never placed in the remote command string/argv,
          # never logged. Docker auth uses an isolated temporary
          # DOCKER_CONFIG (never the production user's default config),
          # so no credential persists in ~/.docker/config.json.
          printf '%s' "${GHCR_TOKEN:-}" | ssh "${SSH_OPTS[@]}" -i "$SSH_KEY_PATH" -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            "bash '$REMOTE_SCRIPT_PATH' '$COMPOSE_SHA256' '$FRONTEND_SHA256' '$PROVIDER_SHA256' '$HAS_TOKEN'"
