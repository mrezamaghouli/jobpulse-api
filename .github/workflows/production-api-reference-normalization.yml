            ROOT_CRONTAB_OUTPUT="$(timeout 5 sudo -n crontab -u root -l 2>&1)" || ROOT_CRONTAB_STATUS=$?
            if [ "$ROOT_CRONTAB_STATUS" -eq 0 ]; then
