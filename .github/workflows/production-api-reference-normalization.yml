name: Production API Reference Normalization

# ============================================================================
# PHASE 4M -- ONE-TIME, INCIDENT-CLEANUP PRODUCTION RUNNER.
#
# Context: Phase 4K (Production Split-Release Recovery run 36238209271)
# restored production's functional f476 baseline -- git checked out at
# f4765f857355c6543f68cea0e481b7f20a917147, API running the correct old
# (f476) image bytes, healthy. The API's Config.Image reference is,
# however, still the temporary local rollback alias
# jobpulse-api-rollback:bccbbd997ee8-1427495 that Phase 4E's rollback
# left behind -- intentional debt, deferred at every prior phase (4H,
# 4J, 4L) specifically so it could be handled here, deliberately,
# separately from any code/git/byte change.
#
# This workflow performs exactly ONE semantic change: it recreates ONLY
# the production api container so that Docker records its Config.Image
# as the canonical GHCR reference
# ghcr.io/mrezamaghouli/jobpulse-api:f4765f857355c6543f68cea0e481b7f20a917147
# instead of the rollback alias -- while requiring the underlying image
# ID to be EXACTLY the same bytes as before
# (sha256:7739628f61c3bba88ff4e395c0f0a0ce3bea3e3abb40956207b495f9d909b753).
# There is no code/image-byte upgrade and no git checkout change; the
# container itself must still be recreated (with --force-recreate)
# because Docker stores Config.Image on the container's own
# configuration, not something that can be edited in place.
#
# This is NOT a repurposing of, and does not modify:
#   - production-direct-runtime-upgrade.yml (the general-purpose
#     upgrade/rollback runner)
#   - production-split-release-recovery.yml (the Phase 4H/4J recovery
#     runner)
#   - production-runtime-diagnostic.yml (deliberately run separately,
#     AFTER this workflow, as its own reviewed step)
#   - deploy.yml
#
# It never sets SEARCH_TRANSPORT=proxy, never touches Tor
# configuration/ControlPort/NEWNYM, never contacts LinkedIn, never runs
# a collector/queue script, never mutates production git, and never
# recreates/restarts db/frontend/tor. The scheduler-provenance model
# (crontab/systemd discovery before the two collection-cycle locks are
# acquired) is copied as literally as practical from the already-
# reviewed Phase 4J version in production-split-release-recovery.yml --
# see tests/test_production_api_reference_normalization_workflow.py's
# parity test.
#
# If candidate recreation succeeds but any post-recreation validation
# fails, this workflow attempts exactly one API-only rollback: it
# retags the same (unchanged) image bytes back under the exact old
# rollback alias and recreates the api service with that reference, so
# production returns to its pre-run state. A confirmed rollback does
# NOT make this workflow succeed -- the normalization attempt still
# failed, and the run concludes non-zero with the classification
# NORMALIZATION_FAILED_ROLLBACK_CONFIRMED_PRESTATE_RESTORED.
#
# workflow_dispatch ONLY, gated by an exact confirmation token typed by
# the operator. See docs/PRODUCTION_RUNBOOK.md's Phase 4M section for
# the full rationale.
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Type exactly NORMALIZE_F476_API_REFERENCE to confirm. This
          recreates ONLY the production api container so its
          Config.Image becomes the canonical
          ghcr.io/mrezamaghouli/jobpulse-api:f4765f857355c6543f68cea0e481b7f20a917147
          reference, requiring the underlying image ID to remain
          EXACTLY sha256:7739628f61c3bba88ff4e395c0f0a0ce3bea3e3abb40956207b495f9d909b753
          (the same bytes, never a code/image upgrade). It never
          changes production git, never touches db/frontend/tor, and
          attempts an API-only rollback to the prior rollback alias if
          any post-recreation check fails.
        required: true
        type: string

permissions:
  contents: read

# Shares the SAME concurrency group as production-direct-runtime-upgrade.yml
# because both mutate the same production API runtime -- this ensures
# the two runners can never overlap.
concurrency:
  group: jobpulse-production-direct-runtime-upgrade
  cancel-in-progress: false

env:
  VM_HOST: "35.192.251.190"
  VM_USER: "mrezamaghouli"
  VM_PORT: "22"
  CONFIRMATION: ${{ inputs.confirmation }}
  # One-time pinned constants -- see docs/PRODUCTION_RUNBOOK.md's Phase
  # 4M section. Production is proven by Phase 4K to be functionally on
  # this exact commit/image; any drift from these exact values fails
  # closed before mutation.
  EXPECTED_PRODUCTION_SHA: "f4765f857355c6543f68cea0e481b7f20a917147"
  EXPECTED_CURRENT_CONFIG_IMAGE: "jobpulse-api-rollback:bccbbd997ee8-1427495"
  CANONICAL_IMAGE: "ghcr.io/mrezamaghouli/jobpulse-api:f4765f857355c6543f68cea0e481b7f20a917147"
  EXPECTED_IMAGE_ID: "sha256:7739628f61c3bba88ff4e395c0f0a0ce3bea3e3abb40956207b495f9d909b753"
  EXPECTED_API_CONTAINER_ID: "ac66a4acef51c8ac3dc27b38a5559c5aa056ec033ceef43c9f8a0e4a8cbd3682"
  EXPECTED_DB_CONTAINER_ID: "98f20abb30f4fdfe9473431370c3f6db29c39183d67f31d49638a493a1f605e9"
  EXPECTED_FRONTEND_CONTAINER_ID: "fb949b779e80a53f4a9542d2eaa30945d1abbf357fbb2391b2422238371b7dd8"
  EXPECTED_TOR_CONTAINER_ID: "e2210c3c47f7a73fca1d5b2faeb62b2eeec89526a56f5da4cb1a00a3298b1612"

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require dispatch from main
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: this workflow may only be dispatched from refs/heads/main (got '${{ github.ref }}')" >&2
            exit 1
          fi

      - name: Require exact confirmation token
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "NORMALIZE_F476_API_REFERENCE" ]; then
            echo "ERROR: confirmation input must be exactly NORMALIZE_F476_API_REFERENCE" >&2
            exit 1
          fi

      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive immutable file hashes for the f476 production baseline
        run: |
          set -euo pipefail

          git fetch origin main
          git cat-file -e "${EXPECTED_PRODUCTION_SHA}^{commit}"

          # Production remains checked out at f476 throughout this
          # workflow (it never touches git) -- these hashes MUST come
          # from the immutable f476 commit object, never from this
          # branch's own (possibly newer) working tree.
          COMPOSE_SHA256="$(git show "${EXPECTED_PRODUCTION_SHA}:docker-compose.prod.yml" | sha256sum | awk '{print $1}')"
          FRONTEND_SHA256="$(git show "${EXPECTED_PRODUCTION_SHA}:frontend/index.html" | sha256sum | awk '{print $1}')"
          PROVIDER_SHA256="$(git show "${EXPECTED_PRODUCTION_SHA}:scripts/providers/linkedin_browser_provider.py" | sha256sum | awk '{print $1}')"

          echo "f476 compose SHA-256: $COMPOSE_SHA256"
          echo "f476 frontend SHA-256: $FRONTEND_SHA256"
          echo "f476 provider SHA-256: $PROVIDER_SHA256"

          {
            echo "COMPOSE_SHA256=$COMPOSE_SHA256"
            echo "FRONTEND_SHA256=$FRONTEND_SHA256"
            echo "PROVIDER_SHA256=$PROVIDER_SHA256"
          } >> "$GITHUB_ENV"

      - name: Validate VM_SSH_KEY secret is present
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_KEY:-}" ]; then
            echo "ERROR: VM_SSH_KEY secret is missing" >&2
            exit 1
          fi

      - name: Run production API reference normalization
        id: normalization
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/jobpulse_normalization_key
          chmod 600 ~/.ssh/jobpulse_normalization_key
          ssh-keyscan -T 10 -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

          SSH_OPTS=(-o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SSH_KEY_PATH=~/.ssh/jobpulse_normalization_key

          REMOTE_SCRIPT_LOCAL="$(mktemp)"
          cat > "$REMOTE_SCRIPT_LOCAL" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          COMPOSE_SHA256="$1"
          FRONTEND_SHA256="$2"
          PROVIDER_SHA256="$3"
          HAS_TOKEN="$4"
          REMOTE_SCRIPT_SELF="$0"

          # Generic failure tracer: fires on any command that trips set -e,
          # including inside functions (requires -E). Reports rc/line/command
          # only -- never env or secret values.
          report_err() {
            local rc=$?
            local line="$1"
            local cmd="$2"
            echo "NORMALIZATION_ERROR_TRACE: rc=${rc} line=${line} cmd=${cmd}" >&2
            return "$rc"
          }
          trap 'report_err "$LINENO" "$BASH_COMMAND"' ERR

          fail() {
            echo "NORMALIZATION_FAILED: $*" >&2
            exit 1
          }

          COMPOSE_SHA256="${COMPOSE_SHA256:?required}"
          FRONTEND_SHA256="${FRONTEND_SHA256:?required}"
          PROVIDER_SHA256="${PROVIDER_SHA256:?required}"
          HAS_TOKEN="${HAS_TOKEN:?required}"

          # One-time pinned constants -- see docs/PRODUCTION_RUNBOOK.md's
          # Phase 4M section. Hardcoded here (not threaded through as
          # arguments) exactly like EXPECTED_CURRENT_SHA is hardcoded
          # inside production-direct-runtime-upgrade.yml's remote
          # script: these values are specific to this one-time runner
          # version, not general parameters.
          EXPECTED_PRODUCTION_SHA="f4765f857355c6543f68cea0e481b7f20a917147"
          EXPECTED_CURRENT_CONFIG_IMAGE="jobpulse-api-rollback:bccbbd997ee8-1427495"
          CANONICAL_IMAGE="ghcr.io/mrezamaghouli/jobpulse-api:f4765f857355c6543f68cea0e481b7f20a917147"
          EXPECTED_IMAGE_ID="sha256:7739628f61c3bba88ff4e395c0f0a0ce3bea3e3abb40956207b495f9d909b753"
          EXPECTED_API_CONTAINER_ID="ac66a4acef51c8ac3dc27b38a5559c5aa056ec033ceef43c9f8a0e4a8cbd3682"
          EXPECTED_DB_CONTAINER_ID="98f20abb30f4fdfe9473431370c3f6db29c39183d67f31d49638a493a1f605e9"
          EXPECTED_FRONTEND_CONTAINER_ID="fb949b779e80a53f4a9542d2eaa30945d1abbf357fbb2391b2422238371b7dd8"
          EXPECTED_TOR_CONTAINER_ID="e2210c3c47f7a73fca1d5b2faeb62b2eeec89526a56f5da4cb1a00a3298b1612"
          PRODUCTION_PROJECT="jobpulse"
          COMPOSE_FILE="/opt/jobpulse/docker-compose.prod.yml"

          # Same canonical lock paths as the Phase 4J-reviewed recovery
          # runner -- reused, not reinvented (see the scheduler
          # provenance section below).
          OUTER_LOCK_PATH="/tmp/jobpulse_collection_cycle.lock"
          INTERNAL_LOCK_PATH="/opt/jobpulse/state/run_collection_cycle.lock"
          OUTER_LOCK_FD=""
          INTERNAL_LOCK_FD=""
          TMP_DOCKER_CONFIG=""

          # Working directory for the semantic environment-equivalence proof
          # (rendered Compose JSON, image-default Env JSON, running
          # container Env JSON) -- created lazily by
          # prove_reference_only_inputs()/render_current_env_json_pair(),
          # chmod 700, its files chmod 600, and unconditionally removed in
          # final_exit_trap. These files can transiently hold resolved
          # secret values from env_file inputs, so they are never left on
          # disk past this run and their contents are never echoed --
          # only hashes/counts ever leave this process.
          ENV_PARITY_TMP_DIR=""
          # The most recently proven "expected current runtime environment"
          # hash (image defaults overlaid by the effective CURRENT Compose
          # environment). Snapshotted by prove_reference_only_inputs() on
          # every successful call; by the time mutation starts this is the
          # final-gate value. rollback_api() re-renders the CURRENT config
          # fresh and refuses to recreate if it no longer matches this
          # snapshot -- see the rollback input-drift guard below.
          FINAL_EXPECTED_ENV_SHA256=""
          # SHA-256 of the exact effective CURRENT Compose config text
          # (EFFECTIVE_CURRENT_CONFIG), snapshotted the same way, by the
          # same function, on every successful call -- the final-gate
          # call's value is what rollback_api() compares itself against.
          # This catches drift the semantic environment hash above cannot:
          # a resolved/interpolated non-environment property (restart
          # policy, volumes, command, ports, ...) changing on disk after
          # the final gate but before rollback.
          FINAL_EFFECTIVE_CURRENT_CONFIG_SHA256=""

          WORKFLOW_SUCCESS=false
          # Set immediately BEFORE the mutating command, not after it
          # returns -- same partial-mutation discipline as
          # production-direct-runtime-upgrade.yml: `docker compose ...
          # up --force-recreate` can itself partially apply and then
          # still exit non-zero.
          API_MUTATION_STARTED=false
          NORMALIZATION_CONFIRMED=false
          ROLLBACK_ATTEMPTED=false
          ROLLBACK_CONFIRMED=false

          # Populated by the pre-mutation precondition checks below;
          # rollback_api() and the final EXIT trap read these.
          API_IMAGE_ID_BEFORE=""

          # Phase 4L-style shared bounded convergence check. Re-evaluates
          # ALL FIVE core conditions together every attempt (never two
          # serialized readiness loops followed by one immediate,
          # non-repeated Docker health inspect -- the historical Phase
          # 4E false-negative shape) and enforces TWO independent bounds
          # (a 45-attempt ceiling AND an explicit SECONDS-based ~90s
          # wall-clock deadline, checked before every iteration's
          # probe), with every command inside an iteration carrying its
          # own tight timeout (health curls: connect-timeout 1s/
          # max-time 2s; the three running/health/image-id reads
          # consolidated into one timeout-3-wrapped docker inspect).
          # After convergence, additionally requires the container's
          # Config.Image equals the caller-supplied expected reference
          # and re-proves the direct/no-Tor invariant -- used both for
          # candidate normalization (expected=$CANONICAL_IMAGE) and for
          # rollback (expected=$EXPECTED_CURRENT_CONFIG_IMAGE).
          wait_for_api_convergence() {
            local expected_config_image="$1"
            local healthy=false
            local nginx_healthy=false
            local running=unknown
            local health=unknown
            local image_id=unknown
            local converged=false
            local state_line
            local attempt
            local deadline=$((SECONDS + 90))
            for attempt in $(seq 1 45); do
              if [ "$SECONDS" -ge "$deadline" ]; then
                break
              fi

              healthy=false
              curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8000/health > /dev/null 2>&1 && healthy=true

              nginx_healthy=false
              curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1/api/health > /dev/null 2>&1 && nginx_healthy=true

              state_line="$(timeout 3 docker inspect -f '{{.State.Running}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|{{.Image}}' jobpulse-api-prod 2>/dev/null)" || state_line=""
              if [ -n "$state_line" ]; then
                IFS='|' read -r running health image_id <<< "$state_line"
              else
                running=unknown
                health=unknown
                image_id=unknown
              fi

              if [ "$healthy" = "true" ] && [ "$nginx_healthy" = "true" ] && [ "$running" = "true" ] && [ "$health" = "healthy" ] && [ "$image_id" = "$EXPECTED_IMAGE_ID" ]; then
                converged=true
                break
              fi
              sleep 2
            done

            echo "CONVERGENCE: last observed state running=$running health=$health imageId=$image_id directHealth=$healthy nginxHealth=$nginx_healthy" >&2

            if [ "$converged" != "true" ]; then
              echo "FATAL: API did not converge on expected running/healthy/image-id/health-endpoint state within the bounded window" >&2
              return 1
            fi

            local cur_config_image cur_search_transport cur_tor_enabled
            cur_config_image="$(docker inspect -f '{{.Config.Image}}' jobpulse-api-prod)"
            if [ "$cur_config_image" != "$expected_config_image" ]; then
              echo "FATAL: API Config.Image '$cur_config_image' does not equal expected '$expected_config_image'" >&2
              return 1
            fi

            # The old (pre-normalization) image predates the reviewed
            # SearchTransport abstraction and cannot be trusted to
            # expose get_search_transport_mode() -- re-prove the same
            # direct/no-Tor invariant via narrow env inspection only,
            # never a full env dump, exactly like
            # production-direct-runtime-upgrade.yml's rollback_api().
            cur_search_transport="$(docker inspect jobpulse-api-prod --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^SEARCH_TRANSPORT=//p' | head -n1 || true)"
            cur_tor_enabled="$(docker inspect jobpulse-api-prod --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^TOR_ENABLED=//p' | head -n1 || true)"

            if [ -n "$cur_search_transport" ] && [ "$cur_search_transport" != "direct" ]; then
              echo "FATAL: API SEARCH_TRANSPORT is not unset/direct (got '$cur_search_transport')" >&2
              return 1
            fi
            if [ "$cur_tor_enabled" != "false" ]; then
              echo "FATAL: API TOR_ENABLED is not exactly 'false' (got '${cur_tor_enabled:-<unset>}')" >&2
              return 1
            fi

            return 0
          }

          # Renders the effective CURRENT Compose config in JSON (never
          # falls back to an unsafe YAML-value parser for this proof -- if
          # JSON config support is unavailable this fails closed before
          # mutation) plus the immutable f476 image's own default Env,
          # into two mode-600 temp files under a lazily-created mode-700
          # ENV_PARITY_TMP_DIR (created once, reused by every call --
          # including the rollback input-drift guard below). Never echoes
          # their contents; the whole directory is unconditionally removed
          # in final_exit_trap regardless of outcome. Read-only; never
          # mutates Docker.
          render_current_env_json_pair() {
            if [ -z "$ENV_PARITY_TMP_DIR" ]; then
              ENV_PARITY_TMP_DIR="$(mktemp -d)" || { echo "FATAL: cannot create the temporary directory for the environment-equivalence proof" >&2; return 1; }
              chmod 700 "$ENV_PARITY_TMP_DIR"
            fi
            COMPOSE_CURRENT_JSON_FILE="$ENV_PARITY_TMP_DIR/compose_current.json"
            IMAGE_ENV_JSON_FILE="$ENV_PARITY_TMP_DIR/image_env.json"

            JOBPULSE_API_IMAGE="$EXPECTED_CURRENT_CONFIG_IMAGE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config --format json > "$COMPOSE_CURRENT_JSON_FILE" || {
              rm -f "$COMPOSE_CURRENT_JSON_FILE"
              echo "FATAL: docker compose config --format json is unsupported or failed for the effective CURRENT config -- failing closed, never falling back to an unsafe YAML-value parser for the environment equivalence proof" >&2
              return 1
            }
            chmod 600 "$COMPOSE_CURRENT_JSON_FILE"

            docker image inspect "$EXPECTED_IMAGE_ID" --format '{{json .Config.Env}}' > "$IMAGE_ENV_JSON_FILE" || {
              rm -f "$COMPOSE_CURRENT_JSON_FILE" "$IMAGE_ENV_JSON_FILE"
              echo "FATAL: failed to read the immutable f476 image's default Env -- failing closed before mutation" >&2
              return 1
            }
            chmod 600 "$IMAGE_ENV_JSON_FILE"
            return 0
          }

          # Single narrow python3 (stdlib json+hashlib only, never PyYAML)
          # helper: given the three JSON file paths (effective CURRENT
          # Compose config, image default Env, and an "actual" Env list --
          # which may be a bare "[]" file when only the expected side is
          # needed, see the rollback input-drift guard), computes the
          # semantic (image-defaults-overlaid-by-Compose-environment)
          # "expected" env and the parsed "actual" env, canonicalizes each
          # as a sort_keys/compact-separator JSON object, and SHA-256-
          # hashes both. Never prints an environment VALUE -- only
          # hashes/counts, or on failure a narrow message naming at most a
          # key NAME (never a value). Never mutates Docker.
          compute_env_parity_hashes() {
            local compose_json_file="$1" image_env_file="$2" runtime_env_file="$3"
            local py_output py_status
            py_output="$(python3 - "$compose_json_file" "$image_env_file" "$runtime_env_file" 2>&1 <<'ENV_PARITY_PY'
          import json
          import sys
          import hashlib


          def load_json_file(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)


          def stringify(value, ctx):
              if value is None:
                  raise ValueError(f"{ctx}: ambiguous null value")
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, (str, int, float)):
                  return str(value)
              raise ValueError(f"{ctx}: unexpected type {type(value).__name__}")


          def parse_kv_list(entries, ctx):
              result = {}
              for entry in entries:
                  if not isinstance(entry, str) or "=" not in entry:
                      raise ValueError(f"{ctx}: malformed entry")
                  key, _, value = entry.partition("=")
                  if not key:
                      raise ValueError(f"{ctx}: malformed entry (empty key)")
                  if key in result:
                      raise ValueError(f"{ctx}: duplicate key {key}")
                  result[key] = value
              return result


          def canonical_hash(env_map):
              canonical = json.dumps(env_map, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()


          try:
              compose_json_path, image_env_path, runtime_env_path = sys.argv[1:4]

              compose_config = load_json_file(compose_json_path)
              services = compose_config.get("services")
              if not isinstance(services, dict):
                  raise ValueError("effective current config: 'services' missing or not an object")
              api = services.get("api")
              if not isinstance(api, dict):
                  raise ValueError("effective current config: 'api' service missing or not an object")
              environment = api.get("environment")
              if not isinstance(environment, dict):
                  raise ValueError("effective current config: api 'environment' missing or not an object")
              compose_env = {
                  key: stringify(value, f"effective current environment key {key}")
                  for key, value in environment.items()
              }

              image_env_list = load_json_file(image_env_path)
              if not isinstance(image_env_list, list):
                  raise ValueError("image default Env is not a list")
              image_env = parse_kv_list(image_env_list, "image default Env")

              runtime_env_list = load_json_file(runtime_env_path)
              if not isinstance(runtime_env_list, list):
                  raise ValueError("running container Env is not a list")
              runtime_env = parse_kv_list(runtime_env_list, "running container Env")

              expected_env = dict(image_env)
              expected_env.update(compose_env)

              print(f"EXPECTED_RUNTIME_ENV_SHA256={canonical_hash(expected_env)}")
              print(f"ACTUAL_RUNTIME_ENV_SHA256={canonical_hash(runtime_env)}")
              print(f"EXPECTED_ENV_KEY_COUNT={len(expected_env)}")
              print(f"ACTUAL_ENV_KEY_COUNT={len(runtime_env)}")
          except Exception as exc:
              print(f"ENV_PARITY_ERROR: {exc}", file=sys.stderr)
              sys.exit(1)
          ENV_PARITY_PY
            )"
            py_status=$?
            if [ "$py_status" -ne 0 ]; then
              echo "FATAL: semantic environment comparison failed: $py_output" >&2
              return 1
            fi
            while IFS='=' read -r env_parity_key env_parity_value; do
              case "$env_parity_key" in
                EXPECTED_RUNTIME_ENV_SHA256) EXPECTED_RUNTIME_ENV_SHA256="$env_parity_value" ;;
                ACTUAL_RUNTIME_ENV_SHA256) ACTUAL_RUNTIME_ENV_SHA256="$env_parity_value" ;;
                EXPECTED_ENV_KEY_COUNT) EXPECTED_ENV_KEY_COUNT="$env_parity_value" ;;
                ACTUAL_ENV_KEY_COUNT) ACTUAL_ENV_KEY_COUNT="$env_parity_value" ;;
              esac
            done <<< "$py_output"
            return 0
          }

          # Consolidates the full pre-mutation reference-only-change proof
          # into one reusable function so the preflight and final-gate
          # call sites can never drift apart (see
          # docs/PRODUCTION_RUNBOOK.md's Phase 4M section). Called once
          # after canonical image provenance and once again immediately
          # before the mutation marker is set -- BOTH calls happen AFTER
          # the outer+internal collection-cycle locks are already held
          # (the locks are acquired earlier, before the active collector
          # check). Never mutates Docker; on any violation it calls
          # fail(), which exits the whole script before mutation ever
          # starts.
          prove_reference_only_inputs() {
            echo "== effective compose configs (read-only, no mutation yet): render CURRENT + CANDIDATE =="
            EFFECTIVE_CURRENT_CONFIG="$(JOBPULSE_API_IMAGE="$EXPECTED_CURRENT_CONFIG_IMAGE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config)" || fail "failed to render effective CURRENT Compose config -- failing closed before mutation"
            EFFECTIVE_CANDIDATE_CONFIG="$(JOBPULSE_API_IMAGE="$CANONICAL_IMAGE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config)" || fail "failed to render effective CANDIDATE Compose config -- failing closed before mutation"

            echo "== effective CURRENT compose config: api service block/image uniqueness + identity =="
            CURRENT_API_BLOCK_START_COUNT="$(grep -c '^  api:' <<< "$EFFECTIVE_CURRENT_CONFIG")"
            [ "$CURRENT_API_BLOCK_START_COUNT" = "1" ] || fail "effective current Compose config does not have exactly one api service block (found $CURRENT_API_BLOCK_START_COUNT) -- refusing to guess, failing closed"
            EFFECTIVE_CURRENT_API_BLOCK="$(printf '%s\n' "$EFFECTIVE_CURRENT_CONFIG" | awk '
              /^  api:/ { in_api=1; next }
              in_api && /^  [A-Za-z0-9_.-]+:/ { in_api=0 }
              in_api { print }
            ')"
            CURRENT_API_IMAGE_LINE_COUNT="$(grep -c '^[[:space:]]*image:[[:space:]]*' <<< "$EFFECTIVE_CURRENT_API_BLOCK")"
            [ "$CURRENT_API_IMAGE_LINE_COUNT" = "1" ] || fail "effective current Compose api block does not have exactly one image: line (found $CURRENT_API_IMAGE_LINE_COUNT) -- refusing to guess, failing closed"
            EFFECTIVE_CURRENT_API_IMAGE="$(printf '%s\n' "$EFFECTIVE_CURRENT_API_BLOCK" | sed -n 's/^[[:space:]]*image:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            [ "$EFFECTIVE_CURRENT_API_IMAGE" = "$EXPECTED_CURRENT_CONFIG_IMAGE" ] || fail "effective current Compose image is '$EFFECTIVE_CURRENT_API_IMAGE', expected exactly '$EXPECTED_CURRENT_CONFIG_IMAGE' -- current Compose inputs no longer describe the running pre-normalization container"
            echo "effective_current_api_image=$EFFECTIVE_CURRENT_API_IMAGE"

            echo "== effective CANDIDATE compose config: api service block/image uniqueness + identity =="
            CANDIDATE_API_BLOCK_START_COUNT="$(grep -c '^  api:' <<< "$EFFECTIVE_CANDIDATE_CONFIG")"
            [ "$CANDIDATE_API_BLOCK_START_COUNT" = "1" ] || fail "effective candidate Compose config does not have exactly one api service block (found $CANDIDATE_API_BLOCK_START_COUNT) -- refusing to guess, failing closed"
            EFFECTIVE_CANDIDATE_API_BLOCK="$(printf '%s\n' "$EFFECTIVE_CANDIDATE_CONFIG" | awk '
              /^  api:/ { in_api=1; next }
              in_api && /^  [A-Za-z0-9_.-]+:/ { in_api=0 }
              in_api { print }
            ')"
            CANDIDATE_API_IMAGE_LINE_COUNT="$(grep -c '^[[:space:]]*image:[[:space:]]*' <<< "$EFFECTIVE_CANDIDATE_API_BLOCK")"
            [ "$CANDIDATE_API_IMAGE_LINE_COUNT" = "1" ] || fail "effective candidate Compose api block does not have exactly one image: line (found $CANDIDATE_API_IMAGE_LINE_COUNT) -- refusing to guess, failing closed"
            EFFECTIVE_CANDIDATE_API_IMAGE="$(printf '%s\n' "$EFFECTIVE_CANDIDATE_API_BLOCK" | sed -n 's/^[[:space:]]*image:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            [ "$EFFECTIVE_CANDIDATE_API_IMAGE" = "$CANONICAL_IMAGE" ] || fail "effective candidate Compose image is '$EFFECTIVE_CANDIDATE_API_IMAGE', expected exactly '$CANONICAL_IMAGE'"
            echo "effective_candidate_api_image=$EFFECTIVE_CANDIDATE_API_IMAGE"

            EFFECTIVE_CURRENT_ENV_BLOCK="$(printf '%s\n' "$EFFECTIVE_CURRENT_API_BLOCK" | awk '
              /^    environment:/ { in_env=1; next }
              in_env && /^    [A-Za-z0-9_.-]+:/ { in_env=0 }
              in_env { print }
            ')"
            EFFECTIVE_CANDIDATE_ENV_BLOCK="$(printf '%s\n' "$EFFECTIVE_CANDIDATE_API_BLOCK" | awk '
              /^    environment:/ { in_env=1; next }
              in_env && /^    [A-Za-z0-9_.-]+:/ { in_env=0 }
              in_env { print }
            ')"

            echo "== effective CURRENT/CANDIDATE compose config: SEARCH_TRANSPORT -- the independent-review blocker =="
            # The RUNNING container's SEARCH_TRANSPORT was already checked
            # above against the live container's own env, but the candidate
            # api service is recreated by `docker compose ... up
            # --force-recreate`, which reads THESE Compose/env inputs, never
            # the old running container's env. A `.env` drift setting
            # SEARCH_TRANSPORT to the proxy value would otherwise only be
            # caught AFTER mutation, by wait_for_api_convergence(). Checking
            # both effective configs here, before mutation, closes that gap --
            # and checking the CURRENT config too proves rollback's inputs are
            # equally safe, since rollback_api() recreates from these same
            # inputs.
            EFFECTIVE_CURRENT_SEARCH_TRANSPORT="$(printf '%s\n' "$EFFECTIVE_CURRENT_ENV_BLOCK" | sed -n 's/^[[:space:]]*SEARCH_TRANSPORT:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            if [ -n "$EFFECTIVE_CURRENT_SEARCH_TRANSPORT" ] && [ "$EFFECTIVE_CURRENT_SEARCH_TRANSPORT" != "direct" ]; then
              fail "effective current Compose SEARCH_TRANSPORT is not unset/direct (got '$EFFECTIVE_CURRENT_SEARCH_TRANSPORT') -- rollback recreates the api service from these same Compose/env inputs, refusing to proceed"
            fi
            echo "effective_current_search_transport=${EFFECTIVE_CURRENT_SEARCH_TRANSPORT:-<unset>}"

            EFFECTIVE_CANDIDATE_SEARCH_TRANSPORT="$(printf '%s\n' "$EFFECTIVE_CANDIDATE_ENV_BLOCK" | sed -n 's/^[[:space:]]*SEARCH_TRANSPORT:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            if [ -n "$EFFECTIVE_CANDIDATE_SEARCH_TRANSPORT" ] && [ "$EFFECTIVE_CANDIDATE_SEARCH_TRANSPORT" != "direct" ]; then
              fail "effective candidate Compose SEARCH_TRANSPORT is not unset/direct (got '$EFFECTIVE_CANDIDATE_SEARCH_TRANSPORT') -- --force-recreate would create the candidate api container with this transport, refusing to proceed before mutation"
            fi
            echo "effective_candidate_search_transport=${EFFECTIVE_CANDIDATE_SEARCH_TRANSPORT:-<unset>}"

            echo "== effective CURRENT/CANDIDATE compose config: TOR_ENABLED (both, not candidate-only) =="
            EFFECTIVE_CURRENT_TOR_ENABLED="$(printf '%s\n' "$EFFECTIVE_CURRENT_ENV_BLOCK" | sed -n 's/^[[:space:]]*TOR_ENABLED:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            [ "$EFFECTIVE_CURRENT_TOR_ENABLED" = "false" ] || fail "effective current Compose TOR_ENABLED is not exactly 'false' (got '${EFFECTIVE_CURRENT_TOR_ENABLED:-<unset>}')"
            echo "effective_current_tor_enabled=$EFFECTIVE_CURRENT_TOR_ENABLED"

            EFFECTIVE_CANDIDATE_TOR_ENABLED="$(printf '%s\n' "$EFFECTIVE_CANDIDATE_ENV_BLOCK" | sed -n 's/^[[:space:]]*TOR_ENABLED:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n1)"
            [ "$EFFECTIVE_CANDIDATE_TOR_ENABLED" = "false" ] || fail "effective candidate Compose TOR_ENABLED is not exactly 'false' (got '${EFFECTIVE_CANDIDATE_TOR_ENABLED:-<unset>}')"
            echo "effective_candidate_tor_enabled=$EFFECTIVE_CANDIDATE_TOR_ENABLED"

            echo "== reference-only Compose parity: current and candidate configs must differ ONLY in the api image reference =="
            # rollback_api() recreates the api service from these SAME
            # production Compose/env inputs (JOBPULSE_API_IMAGE=<old alias>) --
            # proving here, pre-mutation, that the current and candidate
            # effective configs are byte-identical except for the api image
            # reference means rollback's recreation cannot unexpectedly
            # inherit a newly-drifted SEARCH_TRANSPORT proxy value (or any
            # other property) that only the candidate side happened to carry.
            normalize_config_image() {
              awk '
                /^  api:/ { in_api=1; print; next }
                in_api && /^  [A-Za-z0-9_.-]+:/ { in_api=0 }
                in_api && /^[[:space:]]*image:[[:space:]]*/ { sub(/image:.*/, "image: __JOBPULSE_API_REFERENCE__"); print; next }
                { print }
              '
            }
            NORMALIZED_CURRENT_CONFIG="$(printf '%s\n' "$EFFECTIVE_CURRENT_CONFIG" | normalize_config_image)"
            NORMALIZED_CANDIDATE_CONFIG="$(printf '%s\n' "$EFFECTIVE_CANDIDATE_CONFIG" | normalize_config_image)"
            CURRENT_NORMALIZED_SHA256="$(printf '%s\n' "$NORMALIZED_CURRENT_CONFIG" | sha256sum | awk '{print $1}')"
            CANDIDATE_NORMALIZED_SHA256="$(printf '%s\n' "$NORMALIZED_CANDIDATE_CONFIG" | sha256sum | awk '{print $1}')"
            echo "effective_current_normalized_config_sha256=$CURRENT_NORMALIZED_SHA256"
            echo "effective_candidate_normalized_config_sha256=$CANDIDATE_NORMALIZED_SHA256"
            [ "$CURRENT_NORMALIZED_SHA256" = "$CANDIDATE_NORMALIZED_SHA256" ] || fail "effective current/candidate Compose configs differ beyond the api image reference (normalized SHA-256 mismatch) -- never printing the full configs, see the narrow evidence above"
            echo "effective_config_parity=confirmed_image_reference_only"

            echo "== base compose service set (read-only; Tor is a separate overlay, proven independently, never asserted here) =="
            BASE_SERVICES_OUTPUT="$(docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config --services)" || fail "failed to enumerate base Compose service set -- failing closed before mutation"
            BASE_SERVICES_SORTED="$(printf '%s\n' "$BASE_SERVICES_OUTPUT" | sort)"
            EXPECTED_BASE_SERVICES_SORTED="$(printf 'api\ndb\nfrontend\n' | sort)"
            [ "$BASE_SERVICES_SORTED" = "$EXPECTED_BASE_SERVICES_SORTED" ] || fail "base Compose service set is not exactly api/db/frontend (got: $(printf '%s' "$BASE_SERVICES_OUTPUT" | tr '\n' ','))"
            echo "base_service_set=confirmed_api_db_frontend"

            echo "== runtime environment vs effective CURRENT Compose environment (semantic, image defaults overlaid) =="
            # CURRENT-vs-CANDIDATE parity (above) alone is insufficient: the
            # RUNNING api container may have been created earlier with
            # older env_file-resolved values (.api_keys.env,
            # /opt/jobpulse/.admin.env, .env) than what Compose would
            # resolve today. If both the effective CURRENT and effective
            # CANDIDATE configs already agree on a value that differs from
            # what the running container actually has, current-vs-candidate
            # parity would still pass while --force-recreate silently
            # changes that variable -- violating the reference-change-only
            # invariant. This proof compares the RUNNING container's actual
            # environment against what Compose would produce for CURRENT
            # (the immutable image's own default Env, overlaid by the
            # effective CURRENT Compose environment -- Compose values win),
            # using explicit semantic JSON normalization, never the
            # `docker compose config --hash`/config-hash-label shortcut
            # (env_file has had version-specific config-hash mismatch
            # behavior).
            command -v python3 > /dev/null 2>&1 || fail "python3 command unavailable -- cannot compute the semantic runtime/effective-current environment equivalence proof, refusing to proceed without it"

            render_current_env_json_pair || exit 1

            RUNTIME_ENV_JSON_FILE="$ENV_PARITY_TMP_DIR/runtime_env.json"
            docker inspect jobpulse-api-prod --format '{{json .Config.Env}}' > "$RUNTIME_ENV_JSON_FILE" || {
              rm -f "$COMPOSE_CURRENT_JSON_FILE" "$IMAGE_ENV_JSON_FILE" "$RUNTIME_ENV_JSON_FILE"
              fail "failed to read the running API container's actual environment -- failing closed before mutation"
            }
            chmod 600 "$RUNTIME_ENV_JSON_FILE"

            compute_env_parity_hashes "$COMPOSE_CURRENT_JSON_FILE" "$IMAGE_ENV_JSON_FILE" "$RUNTIME_ENV_JSON_FILE"
            ENV_PARITY_STATUS=$?
            rm -f "$COMPOSE_CURRENT_JSON_FILE" "$IMAGE_ENV_JSON_FILE" "$RUNTIME_ENV_JSON_FILE"
            [ "$ENV_PARITY_STATUS" -eq 0 ] || exit 1

            echo "expected_env_key_count=$EXPECTED_ENV_KEY_COUNT"
            echo "actual_env_key_count=$ACTUAL_ENV_KEY_COUNT"
            if [ "$EXPECTED_RUNTIME_ENV_SHA256" != "$ACTUAL_RUNTIME_ENV_SHA256" ] || [ "$EXPECTED_ENV_KEY_COUNT" != "$ACTUAL_ENV_KEY_COUNT" ]; then
              fail "runtime API environment does not match effective CURRENT Compose environment after applying immutable image defaults (expected_sha256=$EXPECTED_RUNTIME_ENV_SHA256 actual_sha256=$ACTUAL_RUNTIME_ENV_SHA256 expected_key_count=$EXPECTED_ENV_KEY_COUNT actual_key_count=$ACTUAL_ENV_KEY_COUNT)"
            fi
            echo "runtime_env_parity=confirmed"

            # Snapshot the just-proven "expected CURRENT" hash so
            # rollback_api() can refuse a blind recreation if the CURRENT
            # Compose/env inputs drift after this point (see the rollback
            # input-drift guard there). prove_reference_only_inputs() is
            # called twice (preflight, then again immediately before
            # mutation) -- both calls overwrite this snapshot, so by the
            # time API_MUTATION_STARTED is set, it holds the FINAL gate's
            # value, never the earlier preflight's.
            FINAL_EXPECTED_ENV_SHA256="$EXPECTED_RUNTIME_ENV_SHA256"

            # Same idea, but for the exact effective CURRENT Compose
            # config text (byte-preserving, never re-parsed) -- catches
            # rollback-time drift in a resolved/interpolated property that
            # the semantic environment hash above does not cover (e.g. a
            # restart policy, volume, command, or port mapping change).
            # Never logs the config itself, only its hash.
            FINAL_EFFECTIVE_CURRENT_CONFIG_SHA256="$(printf '%s\n' "$EFFECTIVE_CURRENT_CONFIG" | sha256sum | awk '{print $1}')"

            echo "effective_compose_preflight=confirmed"
          }

          # API-only rollback: the underlying image bytes never changed
          # (EXPECTED_IMAGE_ID is the same before and after normalization),
          # so rollback only needs to point the OLD logical reference back
          # at those same bytes and recreate the container with it --
          # never a second image pull, never a git operation (this
          # workflow has no git rollback path because it never touches
          # git).
          rollback_api() {
            # Rollback input-drift guards: locks remain held across
            # mutation and rollback, but they prevent a CONCURRENT
            # collection cycle only -- they do not prevent a human/process
            # from editing the production Compose file itself, or
            # .env/.api_keys.env/.admin.env, on the host in between.
            # rollback_api() recreates the api service from these SAME
            # CURRENT Compose/env inputs -- the same inputs the final
            # pre-mutation gate (prove_reference_only_inputs(), called
            # immediately before the mutation marker is set) already
            # snapshotted into FINAL_EXPECTED_ENV_SHA256 and
            # FINAL_EFFECTIVE_CURRENT_CONFIG_SHA256. Re-render and re-hash
            # everything fresh here and refuse to recreate with unproven,
            # possibly-drifted inputs -- never a blind rollback
            # recreation, never a second rollback attempt on top of this
            # one. All three of the following must pass before any
            # rollback mutation:
            #   1. the immutable static COMPOSE_FILE bytes are still the
            #      reviewed f476 file (proves the service DEFINITION
            #      itself did not change);
            #   2. the effective CURRENT Compose config (image + resolved
            #      non-environment properties: restart policy, volumes,
            #      command, ports, ...) is still byte-identical to the
            #      final gate's snapshot;
            #   3. the semantic effective CURRENT environment (image
            #      defaults overlaid by Compose) still matches the final
            #      gate's snapshot (pre-existing guard, unchanged).
            if [ -n "$FINAL_EXPECTED_ENV_SHA256" ] || [ -n "$FINAL_EFFECTIVE_CURRENT_CONFIG_SHA256" ]; then
              echo "ROLLBACK: re-checking production input provenance for drift since the final pre-mutation gate" >&2

              ROLLBACK_COMPOSE_SHA256="$(sha256sum "$COMPOSE_FILE" | awk '{print $1}')"
              if [ "$ROLLBACK_COMPOSE_SHA256" != "$COMPOSE_SHA256" ]; then
                echo "ROLLBACK_ABORTED_INPUT_DRIFT: static production Compose file no longer matches the immutable pinned f476 hash (expected_static_compose_sha256=$COMPOSE_SHA256 actual_static_compose_sha256=$ROLLBACK_COMPOSE_SHA256) -- refusing to recreate the api service with an unproven, possibly-drifted service definition" >&2
                return 1
              fi
              echo "rollback_static_compose_provenance=confirmed" >&2

              ROLLBACK_EFFECTIVE_CURRENT_CONFIG="$(JOBPULSE_API_IMAGE="$EXPECTED_CURRENT_CONFIG_IMAGE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" config)" || {
                echo "ROLLBACK_ABORTED_INPUT_DRIFT: could not re-render effective CURRENT Compose config before rollback -- refusing to recreate with unproven inputs" >&2
                return 1
              }
              ROLLBACK_EFFECTIVE_CURRENT_CONFIG_SHA256="$(printf '%s\n' "$ROLLBACK_EFFECTIVE_CURRENT_CONFIG" | sha256sum | awk '{print $1}')"
              if [ "$ROLLBACK_EFFECTIVE_CURRENT_CONFIG_SHA256" != "$FINAL_EFFECTIVE_CURRENT_CONFIG_SHA256" ]; then
                echo "ROLLBACK_ABORTED_INPUT_DRIFT: effective CURRENT Compose config no longer matches the final pre-mutation gate's snapshot (final_gate_config_sha256=$FINAL_EFFECTIVE_CURRENT_CONFIG_SHA256 rollback_time_config_sha256=$ROLLBACK_EFFECTIVE_CURRENT_CONFIG_SHA256) -- never printing the full config, refusing to recreate the api service with unproven, possibly-drifted inputs" >&2
                return 1
              fi
              echo "rollback_effective_current_config=unchanged" >&2

              if ! render_current_env_json_pair; then
                echo "ROLLBACK_ABORTED_INPUT_DRIFT: could not re-render effective CURRENT Compose config before rollback -- refusing to recreate with unproven inputs" >&2
                return 1
              fi
              ROLLBACK_DUMMY_RUNTIME_FILE="$ENV_PARITY_TMP_DIR/rollback_dummy_runtime.json"
              printf '[]' > "$ROLLBACK_DUMMY_RUNTIME_FILE"
              chmod 600 "$ROLLBACK_DUMMY_RUNTIME_FILE"
              if ! compute_env_parity_hashes "$COMPOSE_CURRENT_JSON_FILE" "$IMAGE_ENV_JSON_FILE" "$ROLLBACK_DUMMY_RUNTIME_FILE"; then
                rm -f "$COMPOSE_CURRENT_JSON_FILE" "$IMAGE_ENV_JSON_FILE" "$ROLLBACK_DUMMY_RUNTIME_FILE"
                echo "ROLLBACK_ABORTED_INPUT_DRIFT: could not re-verify effective CURRENT Compose/env inputs before rollback -- refusing to recreate with unproven inputs" >&2
                return 1
              fi
              rm -f "$COMPOSE_CURRENT_JSON_FILE" "$IMAGE_ENV_JSON_FILE" "$ROLLBACK_DUMMY_RUNTIME_FILE"
              if [ "$EXPECTED_RUNTIME_ENV_SHA256" != "$FINAL_EXPECTED_ENV_SHA256" ]; then
                echo "ROLLBACK_ABORTED_INPUT_DRIFT: effective CURRENT Compose/env inputs changed since the final pre-mutation gate (final_gate_sha256=$FINAL_EXPECTED_ENV_SHA256 rollback_time_sha256=$EXPECTED_RUNTIME_ENV_SHA256) -- refusing to recreate the api service with unproven, possibly-drifted inputs" >&2
                return 1
              fi
              echo "rollback_effective_current_environment=unchanged" >&2
              echo "ROLLBACK: static Compose file, effective CURRENT config, and effective CURRENT environment all unchanged since the final pre-mutation gate -- safe to recreate" >&2
            fi

            echo "ROLLBACK: retagging $EXPECTED_IMAGE_ID as $EXPECTED_CURRENT_CONFIG_IMAGE and recreating api" >&2
            docker tag "$EXPECTED_IMAGE_ID" "$EXPECTED_CURRENT_CONFIG_IMAGE" || {
              echo "FATAL: failed to retag rollback reference $EXPECTED_CURRENT_CONFIG_IMAGE -> $EXPECTED_IMAGE_ID" >&2
              return 1
            }
            JOBPULSE_API_IMAGE="$EXPECTED_CURRENT_CONFIG_IMAGE" docker compose -p "$PRODUCTION_PROJECT" -f "$COMPOSE_FILE" up -d --no-build --no-deps --force-recreate api

            wait_for_api_convergence "$EXPECTED_CURRENT_CONFIG_IMAGE" || return 1

            echo "ROLLBACK: API restored to pre-normalization reference $EXPECTED_CURRENT_CONFIG_IMAGE, running+healthy, direct/no-Tor invariant holds" >&2
            return 0
          }

          release_locks() {
            if [ -n "$INTERNAL_LOCK_FD" ]; then
              exec {INTERNAL_LOCK_FD}>&- || true
            fi
            if [ -n "$OUTER_LOCK_FD" ]; then
              exec {OUTER_LOCK_FD}>&- || true
            fi
          }

          final_exit_trap() {
            local ec=$?
            set +e

            if [ "$WORKFLOW_SUCCESS" != "true" ] && [ "$API_MUTATION_STARTED" = "true" ] && [ "$NORMALIZATION_CONFIRMED" != "true" ]; then
              echo "--- normalization did not complete successfully -- attempting API-only rollback ---" >&2
              ROLLBACK_ATTEMPTED=true
              if rollback_api; then
                ROLLBACK_CONFIRMED=true
                # Rollback succeeding does NOT make this workflow
                # succeed -- the normalization attempt itself still
                # failed. This classification is the explicit, narrow
                # evidence an operator needs: production is safely back
                # at its pre-run state, but nothing was normalized.
                echo "NORMALIZATION_FAILED_ROLLBACK_CONFIRMED_PRESTATE_RESTORED"
              else
                echo "FATAL: rollback failed -- production API state is uncertain; manual operator review required (no second rollback attempt)" >&2
                CUR_API_ID="$(docker inspect -f '{{.Id}}' jobpulse-api-prod 2>/dev/null || echo unknown)"
                CUR_CONFIG_IMAGE="$(docker inspect -f '{{.Config.Image}}' jobpulse-api-prod 2>/dev/null || echo unknown)"
                CUR_IMAGE_ID="$(docker inspect -f '{{.Image}}' jobpulse-api-prod 2>/dev/null || echo unknown)"
                CUR_RUNNING="$(docker inspect -f '{{.State.Running}}' jobpulse-api-prod 2>/dev/null || echo unknown)"
                CUR_HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' jobpulse-api-prod 2>/dev/null || echo unknown)"
                CUR_DIRECT_HEALTH=false
                curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8000/health > /dev/null 2>&1 && CUR_DIRECT_HEALTH=true
                CUR_NGINX_HEALTH=false
                curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1/api/health > /dev/null 2>&1 && CUR_NGINX_HEALTH=true
                CUR_SEARCH_TRANSPORT="$(docker exec jobpulse-api-prod printenv SEARCH_TRANSPORT 2>/dev/null || echo UNSET)"
                CUR_TOR_ENABLED="$(docker exec jobpulse-api-prod printenv TOR_ENABLED 2>/dev/null || echo UNSET)"
                CUR_DB_ID="$(docker inspect -f '{{.Id}}' jobpulse-postgres-prod 2>/dev/null || echo unknown)"
                CUR_FRONTEND_ID="$(docker inspect -f '{{.Id}}' jobpulse-frontend-prod 2>/dev/null || echo unknown)"
                CUR_TOR_ID="$(docker inspect -f '{{.Id}}' jobpulse-tor-prod 2>/dev/null || echo unknown)"
                echo "final_api_container_id=$CUR_API_ID" >&2
                echo "final_api_config_image=$CUR_CONFIG_IMAGE" >&2
                echo "final_api_image_id=$CUR_IMAGE_ID" >&2
                echo "final_api_running=$CUR_RUNNING" >&2
                echo "final_api_health=$CUR_HEALTH" >&2
                echo "final_api_direct_health=$CUR_DIRECT_HEALTH" >&2
                echo "final_api_nginx_health=$CUR_NGINX_HEALTH" >&2
                echo "final_search_transport=$CUR_SEARCH_TRANSPORT" >&2
                echo "final_tor_enabled=$CUR_TOR_ENABLED" >&2
                echo "final_db_id=$CUR_DB_ID" >&2
                echo "final_frontend_id=$CUR_FRONTEND_ID" >&2
                echo "final_tor_id=$CUR_TOR_ID" >&2
              fi

              echo "--- rollback summary ---" >&2
              echo "api_mutation_started=$API_MUTATION_STARTED" >&2
              echo "rollback_attempted=$ROLLBACK_ATTEMPTED" >&2
              echo "rollback_confirmed=$ROLLBACK_CONFIRMED" >&2
            fi

            [ -n "$TMP_DOCKER_CONFIG" ] && rm -rf "$TMP_DOCKER_CONFIG"
            # ENV_PARITY_TMP_DIR can transiently hold resolved env_file
            # secret values (rendered Compose JSON, container Env JSON) --
            # unconditionally removed here regardless of outcome, on top
            # of the prompt per-call rm -f already done by every function
            # that renders into it.
            [ -n "$ENV_PARITY_TMP_DIR" ] && rm -rf "$ENV_PARITY_TMP_DIR"
            release_locks
            rm -f "$REMOTE_SCRIPT_SELF"

            exit "$ec"
          }
          trap final_exit_trap EXIT

          cd /opt/jobpulse || fail "cannot cd to /opt/jobpulse"

          echo "===NORMALIZATION_START==="
          echo "== identity =="
          hostname

          echo "== precondition: production git state (this workflow NEVER mutates git) =="
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "current_sha=$CURRENT_SHA"
          [ "$CURRENT_SHA" = "$EXPECTED_PRODUCTION_SHA" ] || fail "production git HEAD ($CURRENT_SHA) is not the expected f476 SHA ($EXPECTED_PRODUCTION_SHA) -- refusing to guess, no mutation"

          DIRTY_TRACKED_BEFORE="$(git status --porcelain | grep -v '^??' || true)"
          [ -z "$DIRTY_TRACKED_BEFORE" ] || fail "production tracked worktree is not clean before mutation"
          echo "git_precondition=ok"

          echo "== precondition: host file provenance against immutable f476 hashes =="
          ACTUAL_COMPOSE_SHA256="$(sha256sum "$COMPOSE_FILE" | awk '{print $1}')"
          [ "$ACTUAL_COMPOSE_SHA256" = "$COMPOSE_SHA256" ] || fail "compose file SHA-256 ($ACTUAL_COMPOSE_SHA256) does not match expected f476 hash ($COMPOSE_SHA256)"
          ACTUAL_FRONTEND_SHA256="$(sha256sum frontend/index.html | awk '{print $1}')"
