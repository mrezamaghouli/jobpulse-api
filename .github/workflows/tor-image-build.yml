name: Build JobPulse Tor Image

# Distinct name and distinct trigger paths from "Build JobPulse API Image"
# (.github/workflows/docker-build.yml) so this workflow's completion NEVER
# satisfies Deploy Production's `workflow_run` trigger (deploy.yml only
# reacts to a workflow literally named "Build JobPulse API Image"
# completing on main). Building/publishing the Tor image here can never,
# by itself, cause an application deploy or a Tor rollout -- both remain
# separate, explicit actions.
on:
  push:
    branches:
      - main
    paths:
      - docker/tor/**
      - docker-compose.prod.tor.yml
      - .github/workflows/tor-image-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jobpulse-tor-image-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mrezamaghouli/jobpulse-tor

jobs:
  build-tor:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Tor image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/tor
          file: ./docker/tor/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:main
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
