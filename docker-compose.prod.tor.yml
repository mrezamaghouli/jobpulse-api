# Production Tor dark-launch overlay (Phase 3).
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.tor.yml \
#     up -d --no-build tor
#
# Adds a Tor daemon to the production stack for bootstrap/health/restart/
# secret-handling/control-plane validation. Deliberately does NOT
# redefine api/db/frontend: this overlay adds only the `tor` service (plus
# an optional, never-auto-started `tor-diagnostic` operator service under
# the `tor-ops` profile) -- api/db/frontend's compose definitions,
# environment, health, and startup ordering in docker-compose.prod.yml
# are completely untouched whether or not this overlay is applied. api's
# TOR_ENABLED stays "false" (see docker-compose.prod.yml) and api has no
# depends_on pointing at this service.
#
# Security settings below (read_only, cap_drop/cap_add, tmpfs mounts)
# were arrived at experimentally against a real container built from
# docker/tor/Dockerfile (Tor 0.4.9.11 / debian:bookworm-slim), not
# assumed -- see the inline notes on each setting. Confirmed: container
# reaches Bootstrapped 100%, ControlPort auth succeeds, the root
# filesystem is genuinely read-only (write attempts outside the tmpfs
# mounts fail), and restarting the container does not report stale
# health from a previous process's bootstrap line.
#
# Requires TOR_CONTROL_PASSWORD_FILE's target to exist on the host --
# production convention: /opt/jobpulse/.tor_control_password, mode 600,
# owned by the production user. That real file is never created by this
# repository/task.
services:
  tor:
    # Immutable, prebuilt image only -- no `build:` in production. Built
    # and pushed by .github/workflows/tor-image-build.yml as
    # ghcr.io/mrezamaghouli/jobpulse-tor:<tag>. Fails closed (refuses to
    # start) if JOBPULSE_TOR_IMAGE is not set -- no `latest`/`main`
    # default for an actual production rollout, so an operator can never
    # accidentally launch an unpinned image by forgetting to set this.
    image: ${JOBPULSE_TOR_IMAGE:?JOBPULSE_TOR_IMAGE is required, e.g. ghcr.io/mrezamaghouli/jobpulse-tor:<commit-sha>}
    container_name: jobpulse-tor-prod
    restart: unless-stopped

    # Secret model (see docker/tor/README-secret-model.md): only a FILE
    # PATH travels through the environment/`docker inspect` -- never the
    # plaintext password. The real secret file
    # (/opt/jobpulse/.tor_control_password, mode 600) is bind-mounted
    # read-only at a fixed, conventional path.
    environment:
      TOR_CONTROL_PASSWORD_FILE: /run/secrets/tor_control_password
    volumes:
      - /opt/jobpulse/.tor_control_password:/run/secrets/tor_control_password:ro

    expose:
      - "9050"
      - "9051"
    # Deliberately no `ports:` -- 9050/9051 are reachable only from other
    # containers on this compose project's internal Docker network, never
    # from the host's public interfaces. Confirmed via
    # `docker compose config` (see tests/test_tor_production_dark_launch.py)
    # that no `ports:` mapping is present for this service.

    healthcheck:
      # Same discipline as the existing dev overlay: greps for the
      # CURRENT process's own "Bootstrapped 100%" line, not just a TCP
      # connect -- and docker/tor/entrypoint.sh truncates notices.log on
      # every start specifically so a restarted container can never read
      # as healthy from a PREVIOUS process's bootstrap line. Verified
      # experimentally: `docker restart` on a running, healthy container
      # drops health to "starting" and only returns to "healthy" once the
      # new process re-bootstraps to 100% -- never reports healthy from
      # the stale log line still present on the tmpfs mount across a
      # restart (mounts persist across restart; only the entrypoint's
      # explicit truncation prevents the stale read).
      test: ["CMD", "grep", "-q", "Bootstrapped 100%", "/var/log/tor/notices.log"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

    # --- Hardening, experimentally verified against a real container ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Minimum capability set that actually boots Tor under `read_only:
    # true` -- determined by trial, not assumed:
    #   CHOWN, DAC_OVERRIDE, FOWNER -- entrypoint.sh's `chown -R
    #     debian-tor:debian-tor ...` and subsequent `chmod 700
    #     /var/lib/tor` (dropping ALL alone made both fail: chown needs
    #     CHOWN, and chmod-ing a directory no longer owned by root once
    #     it's been chowned to debian-tor needs FOWNER; the secret file
    #     bind mount, owned by the host user rather than root, also needs
    #     DAC_OVERRIDE for entrypoint.sh's root process to read it under
    #     `cap_drop: ALL`).
    #   SETUID, SETGID -- Tor's own internal privilege drop from root (it
    #     binds the SocksPort/ControlPort listeners as root, per
    #     torrc.base, then drops to the `debian-tor` user) requires these;
    #     without them Tor cannot complete its own setuid/setgid call.
    # NET_BIND_SERVICE is deliberately NOT added: 9050/9051 are
    # unprivileged (>1024) ports, and omitting it was confirmed not to
    # block startup.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID

    read_only: true
    tmpfs:
      # /run/tor holds the torrc generated at boot (moved off
      # /etc/tor/torrc so /etc itself can stay part of the read-only
      # image layer -- see docker/tor/entrypoint.sh).
      - /run/tor:mode=0755
      - /var/lib/tor:mode=0700
      - /var/log/tor:mode=0755

    # No privileged mode, no host networking, no Docker socket, no
    # unrelated production secrets/volumes -- this service's only mounts
    # are the two tmpfs paths above and the single read-only secret file
    # bind mount.
    mem_limit: 128m
    cpus: 0.5

  # ---------------------------------------------------------------------
  # Operator-only diagnostic, gated behind an explicit Compose profile so
  # it NEVER starts as part of `up`, `up -d`, or `up -d tor` -- only
  # `docker compose ... --profile tor-ops run --rm tor-diagnostic`
  # (or `up` with --profile tor-ops explicitly passed) will start it, and
  # only for the single diagnostic run before it exits.
  #
  # Reuses the existing JobPulse API image (same Python/Playwright/stem/
  # Phase 2 module environment scripts/tor/production_dark_launch_check.py
  # needs) rather than building a separate diagnostic image.
  # ---------------------------------------------------------------------
  tor-diagnostic:
    profiles:
      - tor-ops
    image: ${JOBPULSE_API_IMAGE:-ghcr.io/mrezamaghouli/jobpulse-api:main}
    container_name: jobpulse-tor-diagnostic
    restart: "no"
    depends_on:
      tor:
        condition: service_healthy

    # This is the ONLY place TOR_ENABLED=true is ever set anywhere in the
    # production compose graph -- api/db/frontend (docker-compose.prod.yml)
    # and the tor service above never set it. Scoped to this one-off,
    # explicitly-invoked diagnostic container only.
    environment:
      TOR_ENABLED: "true"
      TOR_SOCKS_HOST: tor
      TOR_SOCKS_PORT: "9050"
      TOR_CONTROL_HOST: tor
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD_FILE: /run/secrets/tor_control_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Neutral connectivity check only -- never a LinkedIn URL. Operators
      # may override via .env if they prefer a different neutral endpoint.
      TOR_IP_CHECK_URL: ${TOR_IP_CHECK_URL:-https://check.torproject.org/api/ip}

    volumes:
      - /opt/jobpulse/.tor_control_password:/run/secrets/tor_control_password:ro
    env_file:
      # Only PostgreSQL connection details (needed for Phase 2 bootstrap
      # persistence) -- deliberately NOT .api_keys.env or
      # /opt/jobpulse/.admin.env, which api itself uses and which this
      # diagnostic has no reason to see.
      - .env

    command: ["python", "-m", "scripts.tor.production_dark_launch_check"]

    # No ports, no Docker socket. Never calls collector code -- this
    # image's default command (running the API server) is overridden
    # above; nothing here executes app/main.py or any collector module.
    #
    # NOTE (open item, not yet experimentally verified in this task):
    # check_exit_ip()'s Playwright/Chromium launch may need adjustments
    # (e.g. shared-memory size, sandbox flags) under a locked-down
    # container profile. This service intentionally does NOT set
    # read_only/cap_drop here until that is verified against the real
    # jobpulse-api image + Playwright/Chromium combination -- see the
    # Phase 3 report's open items. Tracked as a follow-up, not shipped
    # as an untested claim.

  # ---------------------------------------------------------------------
  # Phase 3.4L: isolated, SOCKS-only, neutral-target search-transport
  # canary -- a SEPARATE sibling of tor-diagnostic above, not an
  # extension of it. tor-diagnostic intentionally carries PostgreSQL
  # config, ControlPort config, the TOR_CONTROL_PASSWORD_FILE secret
  # mount, and Phase 2 bootstrap-persistence behavior; this service needs
  # NONE of that. It proves one narrow thing: that
  # scripts/search_transport/canary.py, using the same
  # get_search_transport() selector production collection would use (via
  # SEARCH_TRANSPORT=proxy set here, never forced in code), can reach the
  # neutral Tor-check endpoint through tor:9050 and get back a response
  # that semantically confirms Tor routing (IsTor=true + a real IP) --
  # not merely an HTTP 200. See docs/PRODUCTION_RUNBOOK.md's Phase 3.4L
  # section for the future operator invocation; this task does not run
  # it. Same tor-ops profile discipline as tor-diagnostic: never starts
  # on `up`/`up -d`, only an explicit `--profile tor-ops run --rm
  # search-transport-canary`.
  #
  # No ports, no volumes, no env_file, no PostgreSQL/POSTGRES_* vars, no
  # TOR_ENABLED, no TOR_CONTROL_* vars, no control-password secret mount,
  # no .api_keys.env/.admin.env/.auth/logs mount, no Docker socket, no
  # privileged mode, no host networking. Timeout values below are
  # service-local and intentionally tighter than the proxy-mode defaults
  # in app/config.py (which stay unchanged) -- appropriate for a single
  # bounded one-shot canary run, not for production collection traffic.
  #
  # No fixed container_name (unlike tor/tor-diagnostic above): this
  # service is only ever invoked via `docker compose run --rm`, which
  # Compose already names uniquely per invocation (project+service+run
  # number). Pinning a fixed name here would only reintroduce a
  # collision risk if a previous run's container wasn't cleaned up (e.g.
  # an operator's client was killed before `--rm` could fire) -- with no
  # operational benefit, since nothing else ever needs to address this
  # one-shot container by a stable name the way `jobpulse-tor-prod`'s
  # network alias does for the long-lived `tor` service.
  # ---------------------------------------------------------------------
  search-transport-canary:
    profiles:
      - tor-ops
    image: ${JOBPULSE_API_IMAGE:-ghcr.io/mrezamaghouli/jobpulse-api:main}
    restart: "no"
    depends_on:
      tor:
        condition: service_healthy

    environment:
      SEARCH_TRANSPORT: "proxy"
      TOR_SOCKS_HOST: tor
      TOR_SOCKS_PORT: "9050"
      # Neutral connectivity check only -- never a LinkedIn URL. Operators
      # may override via .env if they prefer a different neutral endpoint,
      # but any override MUST stay HTTP/HTTPS, non-LinkedIn, and return a
      # JSON object shaped like {"IsTor": bool, "IP": str} --
      # scripts/search_transport/canary.py validates and rejects any
      # unsafe/malformed target before making any request, and a
      # schema-incompatible neutral endpoint will correctly fail Tor-route
      # verification (see docs/PRODUCTION_RUNBOOK.md's Phase 3.4L section).
      TOR_IP_CHECK_URL: ${TOR_IP_CHECK_URL:-https://check.torproject.org/api/ip}
      SEARCH_TRANSPORT_PROXY_PROBE_TIMEOUT_MS: "3000"
      SEARCH_TRANSPORT_PROXY_CONNECT_TIMEOUT_MS: "30000"
      SEARCH_TRANSPORT_PROXY_READ_TIMEOUT_MS: "10000"

    # Wrapped in the repository's existing in-container process-group
    # deadline (scripts/run_with_deadline.py) -- Playwright's own
    # connect/read timeouts (SEARCH_TRANSPORT_PROXY_*_TIMEOUT_MS above)
    # only bound navigation/actions AFTER a page exists; they do not
    # bound sync_playwright() startup or chromium.launch() itself. This
    # is the second, independent, process-wide bound: --seconds 60 is
    # comfortably above the sum of the probe/connect/read timeouts above
    # (3s + 30s + 10s = 43s) plus browser-launch overhead, and
    # --kill-after 5 matches the grace period convention already used by
    # scripts/run_collection_cycle_safe.sh's other run_with_deadline call
    # sites. If this deadline fires (exit 124) or the runner is signaled
    # (128+signum), the canary process is killed before it can print its
    # own final JSON result line -- that is a distinct, hard failure mode
    # from the canary's own documented EXIT_* contract (see the runbook).
    # This does not add a retry: run_with_deadline runs the command
    # exactly once and never re-invokes it on timeout.
    command:
      [
        "python", "-m", "scripts.run_with_deadline",
        "--seconds", "60",
        "--kill-after", "5",
        "--",
        "python", "-m", "scripts.search_transport.canary",
      ]

    # No ports, no env_file, no volumes, no Docker socket. Never calls
    # collector/provider/queue code -- this image's default command
    # (running the API server) is overridden above with the dedicated,
    # standalone canary module only, wrapped by run_with_deadline (also
    # collector/provider/queue-free -- see scripts/run_with_deadline.py).
